<script>
// FIREWALL v700 + DOMAIN LOCK FIXED
(function(){
  const ALLOWED_DOMAINS = ["kash1-bot.github.io","xhettriak.github.io","localhost","127.0.0.1","gen-z-visual-2.onrender.com"];
  const host = location.hostname;
  const isAllowed = location.protocol==="file:" || host==="" || host.includes("github.io") || host.includes("onrender") || ALLOWED_DOMAINS.some(h=>host.includes(h));
  if(!isAllowed){
    document.documentElement.innerHTML=`<h1 style='color:#ff00ff;text-align:center;margin-top:20%;font-family:Space Grotesk'>⛔ Domain Blocked<br><small style='color:#666'>${host} not allowed</small></h1>`;
    throw new Error("Blocked: "+host);
  }

  const role = (localStorage.getItem("role")||JSON.parse(localStorage.getItem("user")||"{}").role||"").toLowerCase();
  const email = (localStorage.getItem("email")||JSON.parse(localStorage.getItem("user")||"{}").email||"").toLowerCase();
  const ALLOWED_ADMINS = ["xhettriakash1@gmail.com","akashchettri2003@gmail.com"];
  const token = localStorage.getItem("token")||localStorage.getItem("genz_token");
  if(!token){location.href="login.html";return;}
  if(role!=="admin" && !ALLOWED_ADMINS.includes(email)){
    if(!ALLOWED_ADMINS.includes(email)){
      document.addEventListener('DOMContentLoaded',()=>{
        document.body.innerHTML=`<div style="background:#070708;color:white;height:100vh;display:flex;align-items:center;justify-content:center;flex-direction:column;font-family:Space Grotesk;text-align:center;padding:20px"><div style="width:80px;height:80px;background:linear-gradient(135deg,#ff00ff,#7a00ff);border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:40px;box-shadow:0 0 30px #ff00ff80">⛔</div><h1 style="color:#ff00ff;margin-top:16px">ADMIN ONLY</h1><p style="color:#666;margin-top:8px">Firewall v700 ACTIVE<br>Logged as: ${email} (${role})<br>Domain: ${host} ✅</p><a href="login.html" style="margin-top:24px;background:white;color:black;padding:14px 28px;border-radius:99px;text-decoration:none;font-weight:900;display:inline-block">Login as Admin</a></div>`;
      });
      throw new Error("Not Admin");
    }
  }
})();
