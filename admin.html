<!DOCTYPE html>
<html><head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Admin Panel</title>
<link rel="stylesheet" href="style.css">
<style>
*{box-sizing:border-box}body{background:#0a0a0a;color:white;margin:0;font-family:system-ui}
header{display:flex;justify-content:space-between;padding:12px 16px;border-bottom:1px solid #222;position:sticky;top:0;background:#0a0a0a;z-index:10}
.logo{font-weight:900}.logo span{color:#a855f7}
.wrap{max-width:1000px;margin:0 auto;padding:16px}
.card{background:#141417;border:1px solid #232326;border-radius:20px;padding:16px;margin-bottom:16px}
.row{display:flex;gap:12px;align-items:center;padding:12px 0;border-bottom:1px solid #222;flex-wrap:wrap}
.badge{font-size:10px;padding:3px 8px;border-radius:99px;font-weight:800}
.badge-reader{background:#1e293b;color:#60a5fa}.badge-creator{background:#2a1e3b;color:#c084fc}
.btn{padding:7px 14px;border-radius:99px;border:none;font-weight:800;cursor:pointer;font-size:12px}
.btn-del{background:#ff0055;color:white}.btn-approve{background:#22c55e;color:black}
.tabs{display:flex;gap:6px;background:#141417;border:1px solid #232326;padding:4px;border-radius:99px;width:fit-content;margin:18px 0;flex-wrap:wrap}
.tabs div{padding:9px 14px;border-radius:99px;font-weight:800;font-size:12px;cursor:pointer;color:#888}.tabs div.on{background:white;color:black}
.small{font-size:11px;color:#666}
</style>
</head>
<body>
<header><div class="logo">ADMIN <span>PANEL</span></div><div style="display:flex;gap:6px"><a href="index.html" style="background:#222;color:white;text-decoration:none;padding:8px 14px;border-radius:99px">Home</a><button onclick="logout()" style="background:#ff0055;color:white;border:none;padding:8px 14px;border-radius:99px;font-weight:700">Logout</button></div></header>
<div class="wrap">
<h2>Admin Panel 👑</h2>
<p class="small" id="adminInfo"></p>
<div class="tabs"><div id="tUsers" class="on">👥 Users</div><div id="tPending">⏳ Pending</div></div>
<div id="boxUsers" class="card"></div>
<div id="boxPending" class="card" style="display:none"></div>
</div>
<script>
const API="http://localhost:3000/api";
if(localStorage.getItem("role")!=="admin"){alert("Admin only");location.href="login.html";}
document.getElementById("adminInfo").innerText=localStorage.getItem("genz_user");

document.getElementById("tUsers").onclick=()=>{document.getElementById("boxUsers").style.display="block";document.getElementById("boxPending").style.display="none";document.getElementById("tUsers").className="on";document.getElementById("tPending").className=""; loadUsers();};
document.getElementById("tPending").onclick=()=>{document.getElementById("boxUsers").style.display="none";document.getElementById("boxPending").style.display="block";document.getElementById("tPending").className="on";document.getElementById("tUsers").className=""; loadPending();};

async function loadUsers(){
 let r=await fetch(API+"/users"); let users=await r.json();
 let h=`<h3>All Users (${users.length})</h3>`;
 users.forEach(u=>{
  h+=`<div class="row"><div style="flex:1"><b>${u.name}</b> <span class="badge ${u.role=='creator'?'badge-creator':'badge-reader'}">${u.role}</span> ${u.verified?'':'(pending)'}<br><span class="small">${u.email} • ${u.password}</span></div><div style="display:flex;gap:5px">${!u.verified?`<button class="btn btn-approve" onclick="approve('${u.email}')">Approve</button>`:""}<button class="btn btn-del" onclick="del('${u.email}')">Delete</button></div></div>`;
 });
 document.getElementById("boxUsers").innerHTML=h;
}
async function loadPending(){
 let r=await fetch(API+"/pending"); let pending=await r.json();
 let h=`<h3>Pending Creators (${pending.length})</h3>`;
 if(pending.length==0) h+="<p class='small'>No pending</p>";
 pending.forEach(p=>{
  h+=`<div class="row" style="flex-direction:column;align-items:flex-start"><b>${p.name}</b><span class="small">${p.email}</span><span class="small">${p.portfolio}</span><span class="small">${p.bio}</span><div style="display:flex;gap:6px;margin-top:8px"><button class="btn btn-approve" onclick="approve('${p.email}')">Approve</button><button class="btn btn-del" onclick="del('${p.email}')">Reject</button></div></div>`;
 });
 document.getElementById("boxPending").innerHTML=h;
}
async function approve(email){ await fetch(API+"/approve",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({email})}); loadUsers(); loadPending(); }
async function del(email){ if(!confirm("Delete "+email+"?"))return; await fetch(API+"/delete",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({email})}); loadUsers(); loadPending(); }
function logout(){ localStorage.clear(); location.href="login.html"; }
loadUsers();
</script>
</body>
</html>
