<!DOCTYPE html><html><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Admin v708 FB DASH</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#07070a;color:#fff;font-family:system-ui}
header{display:flex;justify-content:space-between;align-items:center;padding:10px 14px;background:#111;border-bottom:1px solid #222;position:sticky;top:0;z-index:99}
.logo{font-weight:900}.logo span{color:#ff0055}
.wrap{max-width:900px;margin:0 auto;padding:14px 14px 100px}
.card{background:#15151a;border:1px solid #222;border-radius:16px;padding:14px;margin-bottom:12px}
.stat{display:inline-block;background:#1a1a1e;border:1px solid #222;border-radius:10px;padding:8px 12px;margin:4px;font-size:12px}
input,select{width:100%;padding:11px 12px;margin:5px 0;background:#0e0e12;border:1px solid #2a2a32;border-radius:10px;color:#fff;outline:none}
.btn{padding:10px 14px;border-radius:20px;border:none;font-weight:800;cursor:pointer}
.btn-y{background:#facc15;color:#000}.btn-r{background:#ef4444;color:#fff}.btn-g{background:#00ff88;color:#000}
.novel{display:flex;gap:10px;align-items:center;background:#0e0e12;border:1px solid #222;padding:10px;border-radius:12px;margin:6px 0}
.novel img{width:44px;height:60px;object-fit:cover;border-radius:8px}
.search{border-radius:99px!important}
</style>
</head><body>
<header><div class="logo">Gen-Z <span>Admin</span> <small style="font-size:9px;background:#00ff88;color:#000;padding:2px 5px;border-radius:5px">v708 DASH</small></div><div style="display:flex;gap:6px"><a href="index.html?v=708" style="background:#222;color:#aaa;padding:7px 10px;border-radius:20px;text-decoration:none;font-size:11px">Home</a><button onclick="localStorage.clear();location.href='login.html?v=708'" style="background:#ef4444;color:#fff;border:none;padding:7px 10px;border-radius:20px;font-size:11px">Logout</button></div></header>

<div class="wrap">
<div class="card" style="border-color:#00ff8840">
<b>👑 Admin v708 FB DASHBOARD</b><br><small style="color:#888">Delete + Views + Paid</small>
<div style="margin-top:8px">
<span class="stat">Novels: <b id="cLiveNov">0</b></span>
<span class="stat">Comics: <b id="cLiveCom">0</b></span>
<span class="stat">Views: <b id="cViews">0</b></span>
<span class="stat">Users: <b id="cUsr">0</b></span>
</div>
</div>

<div class="card" style="border-color:#facc15;background:#1a1a00">
<b>🔑 Reset Password - FAST</b>
<input id="resetEmail" class="search" placeholder="🔍 User email">
<input id="resetNewPass" type="password" placeholder="New password min 6">
<button class="btn btn-y" style="width:100%;margin-top:6px" onclick="adminResetPass()">Reset as Admin</button>
<div id="resetStat" style="font-size:11px;color:#facc15;margin-top:6px"></div>
</div>

<div class="card">
<div style="display:flex;justify-content:space-between;align-items:center"><b>📚 LIVE Content</b><input id="qContent" class="search" placeholder="Search title" style="width:140px;margin:0" oninput="filterContent()"></div>
<div id="listLive" style="margin-top:10px">Waking...</div>
</div>

<div class="card">
<div style="display:flex;justify-content:space-between;align-items:center"><b>👥 Users</b><input id="qUser" class="search" placeholder="Search email" style="width:140px;margin:0" oninput="filterUsers()"></div>
<div id="listUsers" style="margin-top:10px">Waking...</div>
</div>
</div>

<script>
const API_BASE="https://gen-z-visual-2.onrender.com";const API=API_BASE+"/api";
let TOKEN=localStorage.getItem("token")||localStorage.getItem("genz_token")||"";
let allContent=[], allUsers=[];
async function adminResetPass(){
 let email=resetEmail.value.trim(), newPass=resetNewPass.value;
 if(!email||!newPass||newPass.length<6){resetStat.innerText="Fill valid";return;}
 resetStat.innerText="Resetting...";
 try{
  let r=await fetch(API+"/auth/change-password",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({email,oldPassword:"CREATOR2026",newPassword:newPass})});
  let d=await r.json(); resetStat.innerText=r.ok?"✅ OK for "+email:"❌ "+(d.error||"fail");
 }catch(e){resetStat.innerText="❌ "+e.message;}
}
let filterQ="";
function filterContent(){filterQ=qContent.value.toLowerCase();renderContent();}
function renderContent(){
 let f=allContent.filter(x=>x.title.toLowerCase().includes(filterQ));
 listLive.innerHTML=f.slice(0,30).map(x=>`<div class="novel"><img src="${x.cover||x.coverImage||x.pages?.[0]||'https://picsum.photos/400/600'}"><div style="flex:1"><b style="font-size:11px">${x.title.slice(0,30)}</b><br><small style="color:#888">${x.type} • ${x.access==='paid'?'💎 ₹'+x.price:'FREE'} • 👁️ ${x.views||0}</small></div><button onclick="del('${x._id}','${x.type}')" class="btn btn-r" style="padding:6px 10px;font-size:10px">Del</button></div>`).join("")||"No match";
}
function filterUsers(){let q=qUser.value.toLowerCase(); listUsers.innerHTML=allUsers.filter(u=>u.email.toLowerCase().includes(q)).slice(0,30).map(u=>`<div style="padding:6px 0;border-bottom:1px solid #222;font-size:11px;display:flex;justify-content:space-between"><span>${u.email} <small style="color:#666">${u.role||''}</small></span><button onclick="resetEmail.value='${u.email}';window.scrollTo(0,0)" style="background:#222;color:#facc15;border:none;padding:3px 8px;border-radius:10px;font-size:10px">Reset</button></div>`).join("")||"No users";}
async function del(id,type){
 if(!confirm("Delete "+type+"?")) return;
 let url=type==='novel'?API+"/novels/"+id:API+"/comics/"+id;
 try{let r=await fetch(url,{method:"DELETE",headers:{Authorization:"Bearer "+TOKEN}}); if(r.ok){alert("Deleted"); load();} else alert("Need admin token - login again as admin");}catch(e){alert(e.message);}
}
async function load(){
 try{
  await fetch(API_BASE+"/",{cache:"no-store"});
  let [rn,rc,ru]=await Promise.all([
    fetch(API+"/novels",{cache:"no-store"}), fetch(API+"/comics",{cache:"no-store"}),
    fetch(API+"/users",{headers:{Authorization:"Bearer "+TOKEN},cache:"no-store"}).catch(()=>({json:async()=>[]}))
  ]);
  let n=await rn.json(); let c=await rc.json(); n=Array.isArray(n)?n:n.novels||[]; c=Array.isArray(c)?c:c.comics||[];
  allContent=[...n.map(x=>({...x,type:'novel'})),...c.map(x=>({...x,type:'comic'}))].sort((a,b)=>new Date(b.createdAt)-new Date(a.createdAt));
  cLiveNov.innerText=n.length; cLiveCom.innerText=c.length; cViews.innerText=allContent.reduce((s,x)=>s+(x.views||0),0);
  renderContent();
  try{let u=await ru.json(); u=Array.isArray(u)?u:u.users||[]; allUsers=u; cUsr.innerText=u.length; filterUsers();}catch{cUsr.innerText="0";}
 }catch(e){listLive.innerText="Waking... "+e.message;}
}
load();
</script></body></html>
