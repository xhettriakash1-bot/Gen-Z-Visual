<!DOCTYPE html>
<html><head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Comics v703.3</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#07070a;color:#fff;font-family:system-ui,sans-serif}
.top{position:sticky;top:0;z-index:99;display:flex;justify-content:space-between;align-items:center;padding:12px 16px;background:#111;border-bottom:1px solid #222}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:16px;max-width:800px;margin:0 auto 120px}
@media(min-width:600px){.grid{grid-template-columns:repeat(3,1fr)}}
.card{background:#15151a;border:1px solid #222;border-radius:18px;overflow:hidden;position:relative}
.card img{width:100%;height:200px;object-fit:cover}
.info{padding:10px}
.badge{position:absolute;top:8px;left:8px;background:#ff8800;color:#000;font-size:9px;font-weight:900;padding:3px 8px;border-radius:20px}
.btn{width:100%;background:#fff;color:#000;border:none;padding:8px;border-radius:20px;font-weight:800;margin-top:6px;cursor:pointer;font-size:12px}
.nav{position:fixed;bottom:0;left:0;right:0;background:#111;border-top:1px solid #222;display:flex;justify-content:space-around;padding:8px 0}
.nav a{color:#666;text-decoration:none;font-size:11px;text-align:center}
.nav a.active{color:#ff8800}
.publish-fab{position:fixed;bottom:80px;right:16px;background:linear-gradient(135deg,#ff8800,#ff5500);color:#fff;padding:14px 22px;border-radius:99px;font-weight:900;text-decoration:none;box-shadow:0 10px 30px #ff880060;z-index:50}
</style>
</head><body>
<div class="top">
  <div style="font-weight:900">🎨 Comics <span style="color:#ff8800">v703.3</span></div>
  <div style="display:flex;gap:10px"><a href="index.html" style="color:#888;text-decoration:none;font-size:12px">Home</a><a href="dashboard.html" style="color:#ff8800;text-decoration:none;font-size:12px;font-weight:800">+ Studio</a></div>
</div>

<div style="max-width:800px;margin:0 auto;padding:16px">
  <h2 style="margin:0;font-size:22px;font-weight:900">All Comics <span style="color:#ff8800">PUBLIC</span></h2>
  <p style="color:#666;font-size:11px;margin-top:4px">v703.3 • Publish button fixed</p>
</div>

<div class="grid" id="list"></div>

<a href="dashboard.html?type=comic" class="publish-fab">+ Publish Comic</a>

<div class="nav">
<a href="index.html">🏠<br>Home</a><a href="novels.html">📚<br>Novels</a><a href="comic.html" class="active">💥<br>Comics</a><a href="dashboard.html">📝<br>Studio</a>
</div>

<script>
const API="https://gen-z-visual-2.onrender.com/api";
async function load(){
 let all=[];
 try{ 
   let novels=JSON.parse(localStorage.getItem("myNovels")||"[]");
   let books=JSON.parse(localStorage.getItem("myBooks")||"[]");
   // SHOW ALL AS COMICS FOR NOW - fix filter
   all=all.concat([...novels,...books].map(c=>({...c,source:"DEVICE"}))); 
 }catch(e){ console.log(e); }
 try{ let r=await fetch(`${API}/comics`); if(r.ok){ let b=await r.json(); b=Array.isArray(b)?b:b.comics||[]; all=all.concat(b.map(c=>({...c,source:"LIVE"}))); } }catch(e){}
 if(!all.length){
   document.getElementById("list").innerHTML=`<div style="grid-column:1/-1;text-align:center;color:#666;padding:40px"><div style="font-size:40px">💥</div><br>No comics yet<br><small>Your uploads are in Novels? Click Publish below</small><br><br><a href="dashboard.html?type=comic" style="background:#ff8800;color:#000;padding:12px 24px;border-radius:99px;text-decoration:none;font-weight:900;display:inline-block">+ Publish Your First Comic</a></div>`;
   return;
 }
 document.getElementById("list").innerHTML=all.map(c=>`
  <div class="card"><span class="badge">${c.source}</span><img src="${c.cover||c.coverImage||'https://picsum.photos/400/600'}" onerror="this.src='https://picsum.photos/400/600'"><div class="info"><b style="font-size:12px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${c.title}</b><small style="color:#888">${c.author||'GenZ'}</small><button class="btn" onclick="location.href='read-comic.html?id=${c._id||c.id}'">Read • ${c.pages?c.pages.length:1}p</button></div></div>
 `).join("");
}
load();
</script>
</body></html>
