<!DOCTYPE html><html><head><meta name="viewport" content="width=device-width, initial-scale=1"><title>Comics</title><style>*{margin:0;padding:0;box-sizing:border-box;font-family:sans-serif}body{background:#080808;color:white;padding:15px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.card{background:#151515;border:1px solid #262626;border-radius:16px;overflow:hidden}img{width:100%;height:200px;object-fit:cover}.info{padding:10px}.btn{background:#00ff88;color:black;border:none;padding:8px;width:100%;border-radius:20px;font-weight:700}</style></head><body><h2>🎨 All Comics</h2><br><div class="grid" id="comicList"></div><script>fetch('data/comics.xml').then(r=>r.text()).then(s=>{let x=new DOMParser().parseFromString(s,"text/xml");let html="";x.querySelectorAll("comic").forEach(c=>{html+=`<div class="card"><img src="${c.querySelector('cover').textContent}"><div class="info"><b>${c.querySelector('title').textContent}</b><br><small>${c.querySelector('author').textContent}</small><p style="font-size:11px;color:#888;margin:5px 0">${c.querySelector('desc').textContent}</p><button class="btn" onclick="location.href='read-comic.html?id=${c.querySelector('id').textContent}'">Read</button></div></div>`});document.getElementById("comicList").innerHTML=html});</script></body></html>
