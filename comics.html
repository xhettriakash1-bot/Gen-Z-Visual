<!DOCTYPE html><html><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Comics v708 FB FILTER</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#07070a;color:#fff;font-family:system-ui}
header{position:sticky;top:0;z-index:99;display:flex;justify-content:space-between;align-items:center;padding:10px 14px;background:rgba(17,17,18,0.94);backdrop-filter:blur(12px);border-bottom:1px solid #222}
.logo{font-weight:900}.logo span{color:#ff8800}
.search-wrap{max-width:600px;margin:0 auto;padding:10px 14px;position:sticky;top:49px;z-index:98;background:#07070a}
.search{width:100%;padding:12px 16px;border-radius:99px;background:#1a1a1e;border:1px solid #2a2a30;color:#fff;outline:none}
.filters{display:flex;gap:8px;overflow:auto;padding:10px 14px;max-width:600px;margin:0 auto}
.chip{padding:7px 14px;border-radius:99px;background:#1a1a1e;border:1px solid #2a2a30;color:#888;font-size:12px;white-space:nowrap;cursor:pointer}
.chip.on{background:#ff8800;color:#000;border-color:#ff8800;font-weight:800}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;padding:10px 14px 120px;max-width:600px;margin:0 auto}
.grid.list{grid-template-columns:1fr}
.card{background:#15151a;border:1px solid #222;border-radius:16px;overflow:hidden;cursor:pointer;position:relative}
.card.list{display:flex;gap:10px;padding:10px}
.card img{width:100%;height:220px;object-fit:cover}
.card.list img{width:90px;height:120px;border-radius:10px}
.badge{position:absolute;top:8px;left:8px;padding:3px 8px;border-radius:20px;font-size:8px;font-weight:900}
.badge-live{background:#00ff88;color:#000}.badge-paid{background:#facc15;color:#000}
.info{padding:10px}
.actions{display:flex;gap:12px;padding:0 10px 10px;color:#666;font-size:11px}
.actions span{cursor:pointer}
.nav{position:fixed;bottom:0;left:0;right:0;background:#111;border-top:1px solid #222;display:flex;justify-content:space-around;padding:8px 0;z-index:99}
.nav a{color:#666;text-decoration:none;font-size:11px;text-align:center}.nav a.active{color:#ff8800}
</style>
</head><body>
<header><div class="logo">🎨 Comics <small style="font-size:9px;background:#ff8800;color:#000;padding:2px 5px;border-radius:5px">v708 LIKE</small></div><div style="display:flex;gap:8px"><button onclick="toggleView()" style="padding:6px 10px;border-radius:8px;background:#222;border:1px solid #333;color:#fff">⊞</button><a href="dashboard.html?v=708" style="padding:7px 12px;border-radius:20px;background:#ff8800;color:#000;text-decoration:none;font-size:11px;font-weight:800">+ Studio</a></div></header>
<div class="search-wrap"><input id="q" class="search" placeholder="🔍 Search comics..." oninput="filter()"></div>
<div class="filters"><div class="chip on" onclick="setGenre('all',this)">All</div><div class="chip" onclick="setGenre('action',this)">Action</div><div class="chip" onclick="setGenre('romance',this)">Romance</div><div class="chip" onclick="setGenre('free',this)">FREE</div><div class="chip" onclick="setGenre('paid',this)">PAID</div></div>
<div id="grid" class="grid"></div>
<div class="nav"><a href="index.html?v=708">🏠<br>Home</a><a href="novels.html?v=708">📚<br>Novels</a><a href="comics.html?v=708" class="active">🎨<br>Comics</a><a href="dashboard.html?v=708">✏️<br>Studio</a></div>
<script>
const API="https://gen-z-visual-2.onrender.com";let all=[],genre='all',isList=false;
function getLikes(id){return parseInt(localStorage.getItem("like_comic_"+id)||"0");}
function toggleLike(e,id){e.stopPropagation();let k="like_comic_"+id;let cur=localStorage.getItem(k);if(cur){localStorage.removeItem(k);}else{localStorage.setItem(k,"1");}render();}
async function load(){document.getElementById('grid').innerHTML="<p style='color:#555;padding:20px'>⏳ Waking LIVE...</p>";try{let r=await fetch(API+"/api/comics",{cache:"no-store"});let d=await r.json();all=Array.isArray(d)?d:d.comics||[];}catch{all=[];}render();}
function render(){let q=document.getElementById('q').value.toLowerCase();let f=all.filter(n=>{let okG=genre==='all'||(genre==='free'&&(n.access||'free')==='free')||(genre==='paid'&&(n.access||'')==='paid')||(n.genre||'').toLowerCase().includes(genre);let okQ=!q||n.title.toLowerCase().includes(q);return okG&&okQ;});
document.getElementById('grid').innerHTML=f.map(c=>`<div class="card ${isList?'list':''}" onclick="location.href='read-comic.html?id=${c._id}&v=708'"><span class="badge ${c.access==='paid'?'badge-paid':'badge-live'}">${c.access==='paid'?'₹'+c.price:'FREE'}</span><img src="${c.cover||c.pages?.[0]||'https://picsum.photos/400/600'}" loading="lazy"><div class="info"><b style="font-size:13px">${c.title.slice(0,28)}</b><br><small style="color:#888">👁️ ${c.views||0}</small></div><div class="actions"><span onclick="toggleLike(event,'${c._id}')">${getLikes(c._id)?'❤️':'🤍'} ${(c.likes||0)+getLikes(c._id)}</span><span>💬 ${c.comments||0}</span><span>↗️ Share</span></div></div>`).join('')||"<p style='color:#666;padding:20px'>No comics</p>";}
function setGenre(g,el){genre=g;document.querySelectorAll('.chip').forEach(c=>c.classList.remove('on'));el.classList.add('on');render();}
function filter(){render();}function toggleView(){isList=!isList;document.getElementById('grid').classList.toggle('list',isList);render();}
load();
</script></body></html>
