<!DOCTYPE html>
<html><head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Creator Studio - Gen-Z Visual v700 LIVE</title>
<link rel="stylesheet" href="style.css?v=700">
<script>
if(window.top!==window.self) window.top.location=window.self.location;
const Firewall={
  patterns:[/<script/gi,/javascript:/gi,/onerror=/gi,/onload=/gi,/union.*select/gi,/<iframe/gi,/eval\(/gi],
  scan(v){ return this.patterns.some(p=>p.test(v)); },
  protect(){
    document.addEventListener('input',e=>{
      if(e.target.tagName==="INPUT"||e.target.tagName==="TEXTAREA"){
        if(this.scan(e.target.value)){ e.target.value=""; e.target.style.border="2px solid red"; e.target.placeholder="⛔ Blocked"; }
      }
    });
  }
};
window.addEventListener('DOMContentLoaded',()=>Firewall.protect());
(function(){
  const user = JSON.parse(localStorage.getItem("user")||localStorage.getItem("genz_user")||"{}");
  const role = (localStorage.getItem("role") || user.role || "").toLowerCase();
  const email = (localStorage.getItem("email") || user.email || "").toLowerCase();
  const ALLOWED_ADMINS = ["xhettriakash1@gmail.com","akashchettri2003@gmail.com"];
  const allowed = role==="creator" || role==="admin" || ALLOWED_ADMINS.includes(email);
  if(!allowed){
    document.addEventListener('DOMContentLoaded',()=>{
      document.body.innerHTML = `<div style="background:#000;color:white;height:100vh;display:flex;align-items:center;justify-content:center;flex-direction:column;font-family:system-ui;text-align:center;padding:20px">
      <h1 style="color:#ef4444">⛔ CREATOR ONLY</h1><p style="color:#888">Login as Creator or Admin.<br>Current: ${email} (${role||'guest'})</p>
      <a href="login.html" style="margin-top:20px;background:white;color:black;padding:12px 24px;border-radius:99px;text-decoration:none;font-weight:900">Login</a></div>`;
    });
  }
})();
</script>
<style>
*{box-sizing:border-box}body{background:#0a0a0a;color:white;margin:0;font-family:system-ui}
header{display:flex;justify-content:space-between;padding:12px 16px;border-bottom:1px solid #222;position:sticky;top:0;background:#0a0a0a;z-index:10}
.logo{font-weight:900}.logo span{color:#a855f7}
.wrap{max-width:600px;margin:24px auto;padding:0 16px}
.card{background:#141417;border:1px solid #232326;border-radius:24px;padding:22px}
input,textarea,select{width:100%;padding:13px;margin:8px 0;background:#0e0e10;border:1px solid #2a2a2e;border-radius:12px;color:white;outline:none}
.btn{width:100%;padding:14px;background:#22c55e;color:black;border:none;border-radius:99px;font-weight:900;cursor:pointer;margin-top:10px;font-size:15px}
.btn-drive{background:#a855f7;color:white;margin-top:8px}
.badge{padding:6px 12px;border-radius:99px;background:#222;color:#22c55e;font-size:11px;font-weight:800}
</style>
</head>

<div><span id="creatorEmail" style="font-size:11px;color:#888"></span>
<a href="index.html" style="background:#222;color:white;text-decoration:none;padding:8px 14px;border-radius:99px;font-size:12px;margin-left:8px">Home</a>
