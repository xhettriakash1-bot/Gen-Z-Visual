<!DOCTYPE html>
<html><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Creator v704.5 - Comic + Novel LIVE</title>
<style>
*{box-sizing:border-box;font-family:system-ui}body{margin:0;background:#080808;color:#fff}
header{padding:12px 16px;border-bottom:1px solid #222;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;background:#080808;z-index:10}
.wrap{max-width:700px;margin:18px auto;padding:0 16px 120px}
.card{background:#15151a;border:1px solid #222;border-radius:20px;padding:20px}
input,textarea,select{width:100%;padding:13px;margin:7px 0;background:#0e0e12;border:1px solid #2a2a2a;border-radius:12px;color:#fff;outline:none}
input:focus,textarea:focus{border-color:#ff00ff}
.btn{width:100%;padding:13px;border:none;border-radius:99px;font-weight:900;cursor:pointer;margin-top:10px}
.btn-p{background:linear-gradient(135deg,#ff00ff,#7a00ff);color:#fff}.btn-g{background:#1f1f1f;color:#fff;border:1px solid #2a2a2a}
.tabs{display:flex;gap:8px;margin:10px 0}.tab{flex:1;padding:12px;border-radius:99px;text-align:center;cursor:pointer;border:1px solid #2a2a2a;background:#1a1a1e;font-weight:800;font-size:13px}
.tab.active{background:#fff;color:#000}
.item{display:flex;gap:10px;background:#0e0e12;border:1px solid #222;padding:10px;border-radius:12px;margin:6px 0}
.item img{width:48px;height:66px;object-fit:cover;border-radius:8px}
</style>
</head><body>
<header>
<b>Creator Studio <span style="background:#00ff88;color:#000;padding:3px 8px;border-radius:20px;font-size:10px">v704.5 COMIC+NOVEL</span></b>
<a href="index.html?v=704.5" style="background:#222;color:#fff;padding:8px 12px;border-radius:20px;text-decoration:none;font-size:12px">Home</a>
</header>

<div class="wrap">
<div class="card">
<div class="tabs">
<div class="tab active" id="tabNovel" onclick="setType('novel')">📚 Novel</div>
<div class="tab" id="tabComic" onclick="setType('comic')">🎨 Comic</div>
</div>

<input id="title" placeholder="Title *">
<input id="cover" placeholder="Cover URL * https://...">
<textarea id="desc" rows="3" placeholder="Description *"></textarea>
<div id="novelBox">
<textarea id="content" rows="8" placeholder="Novel Content * Full story / chapter text"></textarea>
</div>
<div id="comicBox" style="display:none">
<textarea id="pages" rows="8" placeholder="Comic Pages * comma separated URLs: https://page1.jpg, https://page2.jpg, https://page3.jpg"></textarea>
<p style="font-size:10px;color:#666">Upload pages to imgur / postimages and paste links here separated by comma</p>
</div>

<select id="genre"><option>Fantasy</option><option>Action</option><option>Romance</option><option>Drama</option><option>Comics</option><option>Manga</option><option>Horror</option><option>City</option><option>Neon</option></select>

<button class="btn btn-p" onclick="publish()">🚀 Publish LIVE - Visible to ALL</button>
<p id="msg" style="font-size:12px;text-align:center;margin-top:10px;white-space:pre-wrap"></p>

<div style="margin-top:18px;border-top:1px solid #222;padding-top:12px">
<b style="font-size:13px">📦 My LIVE</b> <span id="cnt" style="font-size:11px;color:#666"></span>
<div id="list" style="margin-top:8px">Loading...</div>
</div>
</div>
</div>

<script>
const API="https://gen-z-visual-2.onrender.com";
let TYPE="novel";
let USER={}; try{USER=JSON.parse(localStorage.getItem("user")||localStorage.getItem("genz_user")||"{}");}catch{}
let TOKEN=localStorage.getItem("token")||localStorage.getItem("genz_token")||"";

function setType(t){
 TYPE=t;
 document.getElementById("tabNovel").classList.toggle("active",t==="novel");
 document.getElementById("tabComic").classList.toggle("active",t==="comic");
 document.getElementById("novelBox").style.display=t==="novel"?"block":"none";
 document.getElementById("comicBox").style.display=t==="comic"?"block":"none";
}
async function publish(){
 let title=document.getElementById("title").value.trim();
 let cover=document.getElementById("cover").value.trim();
 let desc=document.getElementById("desc").value.trim();
 let genre=document.getElementById("genre").value;
 let m=document.getElementById("msg");
 if(!title||!cover||!desc){m.style.color="#f44";m.innerText="⛔ Title+Cover+Desc required";return;}
 if(!TOKEN){m.style.color="#f44";m.innerHTML="⛔ Not logged in <a href='login.html?v=704.5' style='color:#ff00ff'>Login</a>";return;}
 m.style.color="#fa0"; m.innerText="Publishing "+TYPE+" LIVE...";
 let body={title,cover,coverImage:cover,description:desc,author:USER.name||USER.email||"GenZ",creatorEmail:USER.email||localStorage.getItem("email"),genre};
 let endpoint="";
 if(TYPE==="novel"){
  let content=document.getElementById("content").value.trim();
  if(!content){m.style.color="#f44";m.innerText="⛔ Novel content required";return;}
  body.content=content;
  endpoint="/api/novels";
 } else {
  let p=document.getElementById("pages").value.trim();
  let pages=p? p.split(",").map(s=>s.trim()).filter(Boolean) : [cover];
  if(pages.length===0){m.style.color="#f44";m.innerText="⛔ Add page URLs";return;}
  body.pages=pages;
  endpoint="/api/comics";
 }
 try{
  let r=await fetch(API+endpoint,{method:"POST",headers:{"Content-Type":"application/json","Authorization":"Bearer "+TOKEN},body:JSON.stringify(body)});
  let d=await r.json();
  if(!r.ok) throw new Error(JSON.stringify(d));
  m.style.color="#0f8"; m.innerText="✅ PUBLISHED LIVE! "+title+" as "+TYPE.toUpperCase()+"\nID: "+(d._id||"ok")+" → Check "+(TYPE==="novel"?"novels.html":"comic.html")+" in incognito";
  load();
 }catch(e){m.style.color="#f44";m.innerText="❌ "+e.message;}
}
async function load(){
 try{
  let [rn,rc]=await Promise.all([fetch(API+"/api/novels"),fetch(API+"/api/comics")]);
  let n=await rn.json(); let c=await rc.json();
  let all=[...n.map(x=>({...x,_t:"NOVEL"})),...c.map(x=>({...x,_t:"COMIC"}))];
  let email=(USER.email||localStorage.getItem("email")||"").toLowerCase();
  let mine=all.filter(x=>(x.creatorEmail||"").toLowerCase()===email); if(mine.length===0) mine=all.slice(0,5);
  document.getElementById("cnt").innerText=mine.length;
  document.getElementById("list").innerHTML=mine.map(x=>`<div class="item"><img src="${x.cover||x.coverImage}"><div style="flex:1"><b style="font-size:12px">${x.title}</b> <span style="font-size:8px;background:#00ff8815;border:1px solid #00ff8840;color:#00ff88;padding:2px 6px;border-radius:20px">${x._t} LIVE</span><br><small style="color:#666">${x._id||""}</small></div></div>`).join("");
 }catch(e){document.getElementById("list").innerText="Waking backend... "+e.message;}
}
load();
// auto detect?type=comic from URL
if(new URLSearchParams(location.search).get("type")==="comic") setType("comic");
</script>
</body></html>
