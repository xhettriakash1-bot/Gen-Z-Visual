<script>
let comicPages=[], isAdmin=localStorage.getItem("isAdmin")==="true";
function getPass(){return localStorage.getItem("adminPass")||"Akash123";}
function tab(t){ document.getElementById('novelBox').style.display=t==='novel'?'block':'none'; document.getElementById('comicBox').style.display=t==='comic'?'block':'none'; document.getElementById('tN').className=t==='novel'?'tab active':'tab'; document.getElementById('tC').className=t==='comic'?'tab active':'tab'; }
function login(){let p=prompt("Password?"); if(p===getPass()){localStorage.setItem("isAdmin","true");isAdmin=true;show();}else alert("Wrong - try "+getPass());}
function logout(){localStorage.removeItem("isAdmin");isAdmin=false;show();}
function changeP(){let v=document.getElementById("newPass").value; if(v.length<4){alert("min 4");return;} localStorage.setItem("adminPass",v); show();}

// COMPRESS IMAGES v704.1 FIX
function prev(e){
 comicPages=[]; document.getElementById('preview').innerHTML=''; document.getElementById('sizeInfo').innerText='Compressing...';
 let files=[...e.target.files].slice(0,15);
 let done=0;
 files.forEach(f=>{
  let r=new FileReader();
  r.onload=ev=>{
   let img=new Image(); img.onload=()=>{
    let c=document.createElement('canvas'); let max=600; let ratio=Math.min(max/img.width,max/img.height,1);
    c.width=img.width*ratio; c.height=img.height*ratio;
    c.getContext('2d').drawImage(img,0,0,c.width,c.height);
    let compressed=c.toDataURL('image/jpeg',0.6);
    comicPages.push(compressed);
    let im=document.createElement('img'); im.src=compressed; document.getElementById('preview').appendChild(im);
    done++; if(done===files.length){ document.getElementById('sizeInfo').innerText=done+' pages | ~'+Math.round(JSON.stringify(comicPages).length/1024)+'KB (compressed)'; }
   }; img.src=ev.target.result;
  }; r.readAsDataURL(f);
 });
}

 let t=document.getElementById('nTitle').value; if(!t){alert('Title?');return;}
 let a=JSON.parse(localStorage.getItem('myNovels')||'[]');
 a.unshift({id:Date.now(),title:t,author:document.getElementById('nAuthor').value||'You',cover:document.getElementById('nCover').value||`https://picsum.photos/400/600?random=${Date.now()}`,description:document.getElementById('nDesc').value,content:document.getElementById('nContent').value});
 localStorage.setItem('myNovels',JSON.stringify(a)); alert('Novel Published!'); show(); document.getElementById('nTitle').value='';
}
function publishComic(){
 let t=document.getElementById('cTitle').value; if(!t){alert('Title?');return;}
 if(!comicPages.length){alert('Select comic pages first!');return;}
 let item={id:Date.now(),title:t,author:document.getElementById('cAuthor').value||'You',cover:document.getElementById('cCover').value||comicPages[0],description:document.getElementById('cDesc').value,pages:comicPages,createdAt:Date.now()};
 try{
  let a=JSON.parse(localStorage.getItem('myBooks')||'[]'); a.unshift(item); localStorage.setItem('myBooks',JSON.stringify(a));
  let b=JSON.parse(localStorage.getItem('myComics')||'[]'); b.unshift(item); localStorage.setItem('myComics',JSON.stringify(b));
  alert('✅ Comic Published! '+comicPages.length
