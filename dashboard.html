<script>
const API="https://gen-z-visual-2.onrender.com/api";
let comicPages=[], token=localStorage.getItem('token')||localStorage.getItem('genz_token')||'';
let user=JSON.parse(localStorage.getItem('user')||localStorage.getItem('genz_user')||'null');
function switchTab(t){ document.getElementById('novelBox').style.display=t==='novel'?'block':'none'; document.getElementById('comicBox').style.display=t==='comic'?'block':'none'; document.getElementById('tN').className=t==='novel'?'tab active':'tab'; document.getElementById('tC').className=t==='comic'?'tab active':'tab'; }
(function(){ switchTab('novel'); updateLoginUI(); loadList(); document.getElementById('nAccess').onchange=e=>document.getElementById('nPrice').style.display=e.target.value==='paid'?'block':'none'; document.getElementById('cAccess').onchange=e=>document.getElementById('cPrice').style.display=e.target.value==='paid'?'block':'none'; if(token) loadUpi(); })();
function updateLoginUI(){ token=localStorage.getItem('token')||localStorage.getItem('genz_token')||''; user=JSON.parse(localStorage.getItem('user')||localStorage.getItem('genz_user')||'null'); if(token&&user){ document.getElementById('adminStatus').innerText='✅ '+user.email; document.getElementById('loginInfo').innerText='LIVE Enabled ✅'; document.getElementById('loginBtn').style.display='none'; document.getElementById('logoutBtn').style.display='block'; document.getElementById('authStatus').innerText='Token OK'; } else { document.getElementById('adminStatus').innerText='👤 Guest Mode'; document.getElementById('loginInfo').innerText='Login for LIVE'; document.getElementById('loginBtn').style.display='block'; document.getElementById('logoutBtn').style.display='none'; } }
async function realLogin(){ 
  const email=prompt('Email:','xhettriakash1@gmail.com'); 
  const pass=prompt('Password:','Akash123'); 
  if(!email||!pass) return; 
  document.getElementById('authStatus').innerText='Logging...';
  try{
    const r=await fetch(API+'/auth/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email,password:pass})});
    const d=await r.json();
    const tk=d.token||d.accessToken||d.access_token;
    if(r.ok&&tk){
      localStorage.setItem('token',tk);
      localStorage.setItem('genz_token',tk);
      localStorage.setItem('user',JSON.stringify(d.user||{email:email,role:'admin'}));
      localStorage.setItem('genz_user',JSON.stringify(d.user||{email:email,role:'admin'}));
      alert('✅ Login OK - Reloading');
      location.reload();
    }else{
      document.getElementById('authStatus').innerText='❌ '+(d.error||JSON.stringify(d));
    }
  }catch(e){ document.getElementById('authStatus').innerText='❌ '+e.message; }
  }
