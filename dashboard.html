<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Studio v703 ADMIN PRO</title>
<link rel="stylesheet" href="style.css?v=703">
<script>
// NO DOMAIN LOCK - PUBLIC
// Only simple XSS firewall kept
const Firewall={patterns:[/<script/gi,/javascript:/gi,/onerror=/gi,/onload=/gi,/union.*select/gi],scan(v){return this.patterns.some(p=>p.test(v))},protect(){document.addEventListener('input',e=>{if(e.target.tagName==="INPUT"||e.target.tagName==="TEXTAREA"){if(this.scan(e.target.value)){e.target.value="";e.target.style.border="2px solid #ff00ff"}}})}};
window.addEventListener('DOMContentLoaded',()=>Firewall.protect());
</script>
<style>
.studio{max-width:800px;margin:0 auto;padding:16px 20px 140px}
.top-ultra{position:sticky;top:0;z-index:99;display:flex;justify-content:space-between;align-items:center;padding:14px 20px;background:rgba(10,10,12,0.85);backdrop-filter:blur(25px);border-bottom:1px solid rgba(255,255,255,0.06)}
.welcome-card{background:linear-gradient(135deg,rgba(255,0,255,0.15),rgba(122,0,255,0.15));backdrop-filter:blur(25px);border:1px solid rgba(255,0,255,0.2);border-radius:24px;padding:20px;margin:14px 0;position:relative;overflow:hidden}
.switcher{display:flex;background:rgba(20,20,23,0.8);border:1px solid rgba(255,255,255,0.08);border-radius:99px;padding:5px;margin:20px 0}
.switcher div{flex:1;text-align:center;padding:13px;border-radius:99px;font-weight:800;cursor:pointer;color:#666;transition:0.3s;font-size:14px}
.switcher div.on{background:white;color:black;transform:scale(1.02)}
.card-ultra{background:rgba(20,20,23,0.85);backdrop-filter:blur(20px);border:1px solid rgba(255,255,255,0.07);border-radius:20px;padding:18px;margin:12px 0}
.input-ultra{width:100%;background:rgba(255,255,255,0.04);border:1px solid rgba(255,255,255,0.08);border-radius:14px;padding:14px;color:white;font-size:14px;outline:none;margin:8px 0}
.input-ultra:focus{border-color:#ff00ff}
.file-box{background:rgba(255,255,255,0.03);border:1px dashed rgba(255,0,255,0.3);border-radius:16px;padding:14px;margin:10px 0}
.btn-ultra{width:100%;padding:15px;border-radius:14px;border:none;font-weight:900;cursor:pointer;background:white;color:black;margin-top:12px}
.admin-bar{display:none;background:linear-gradient(90deg,#ff00ff,#7a00ff);padding:12px;border-radius:14px;margin:12px 0;gap:8px;align-items:center;justify-content:space-between}
.admin-bar.show{display:flex}
.stat-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;margin:14px 0}
.stat{background:rgba(255,255,255,0.06);border:1px solid rgba(255,255,255,0.08);border-radius:14px;padding:12px;text-align:center}
.admin-list-item{display:flex;gap:10px;align-items:center;background:rgba(255,255,255,0.04);border:1px solid rgba(255,255,255,0.06);border-radius:12px;padding:10px;margin:8px 0}
.admin-list-item img{width:44px;height:60px;object-fit:cover;border-radius:8px}
</style>
</head>
<body>
<div class="top-ultra">
  <div id="logoBtn" style="font-weight:900;font-size:18px;letter-spacing:-1px;cursor:pointer">Gen-Z STUDIO <span style="color:#ff00ff">v703 ADMIN</span></div>
  <div style="display:flex;gap:10px">
    <a href="index.html" style="color:#888;text-decoration:none;font-size:13px;font-weight:700">Home</a>
    <a href="novels.html" style="color:#888;text-decoration:none;font-size:13px">Novels</a>
    <a href="comic.html" style="color:#888;text-decoration:none;font-size:13px">Comics</a>
  </div>
</div>

<div class="studio">
  <div class="welcome-card">
    <div style="font-size:22px;font-weight:900">Create <span style="color:#ff00ff">ULTRA</span> <span id="adminBadge" style="display:none;background:#00ff88;color:black;font-size:10px;padding:4px 8px;border-radius:20px;vertical-align:middle">ADMIN</span></div>
    <div style="color:#aaa;font-size:12px;margin-top:4px">Tap logo 5x to unlock admin • File upload + monitor + control</div>
    <div style="margin-top:10px;display:flex;gap:8px">
      <button onclick="adminLogin()" style="background:#ff00ff;color:white;border:none;padding:6px 12px;border-radius:20px;font-size:11px;font-weight:800">🔐 Admin Login</button>
      <button onclick="logoutAdmin()" id="logoutBtn" style="display:none;background:#333;color:white;border:none;padding:6px 12px;border-radius:20px;font-size:11px">Logout</button>
    </div>
  </div>

  <!-- ADMIN PANEL -->
  <div id="adminPanel" style="display:none">
    <div class="admin-bar show">
      <b>👑 ADMIN PANEL</b>
      <span id="adminStatsSmall" style="font-size:11px"></span>
    </div>

    <div class="stat-grid">
      <div class="stat"><div id="totalNovels" style="font-weight:900;font-size:18px">0</div><div style="font-size:10px;color:#888">NOVELS</div></div>
      <div class="stat"><div id="totalComics" style="font-weight:900;font-size:18px">0</div><div style="font-size:10px;color:#888">COMICS</div></div>
      <div class="stat"><div id="storageUse" style="font-weight:900;font-size:18px">0KB</div><div style="font-size:10px;color:#888">STORAGE</div></div>
    </div>

    <div class="card-ultra">
      <b style="font-size:13px">🔑 Change Admin Password</b>
      <input id="newPassInput" type="password" class="input-ultra" placeholder="New password">
      <button onclick="changePass()" style="background:#00ff88;color:black;border:none;padding:10px 14px;border-radius:10px;font-weight:800;width:100%;margin-top:6px">Update Password</button>
    </div>

    <div class="card-ultra">
      <b style="font-size:13px">📚 Control All Content</b>
      <div id="adminContentList" style="margin-top:10px;max-height:400px;overflow:auto"></div>
    </div>
  </div>

  <!-- NORMAL PUBLISH PANEL -->
  <div class="switcher">
    <div id="swNovel" class="on" onclick="setType('novel')">📚 Novel</div>
    <div id="swComic" onclick="setType('comic')">🖼️ Comic</div>
  </div>

  <div class="card-ultra">
    <input id="titleInput" class="input-ultra" placeholder="Title">
    <input id="authorInput" class="input-ultra" placeholder="Author" value="GenZ Studio">
    <textarea id="descInput" class="input-ultra" rows="3" placeholder="Description..."></textarea>

    <div class="file-box">
      <label style="font-size:11px;color:#ff00ff;font-weight:800">📁 COVER FROM DEVICE</label>
      <input type="file" id="coverFile" accept="image/*" style="width:100%;margin-top:8px;color:#999;font-size:11px">
      <img id="coverPreview" style="width:100%;height:180px;object-fit:cover;border-radius:12px;margin-top:10px;display:none">
      <input id="coverInput" class="input-ultra" placeholder="Or Cover URL fallback">
    </div>

    <div class="file-box" id="novelFileBox">
      <label style="font-size:11px;color:#00ff88;font-weight:800">📄 NOVEL PDF FROM DEVICE</label>
      <input type="file" id="novelFile" accept=".pdf,.txt" style="width:100%;margin-top:8px;color:#999;font-size:11px">
      <div id="novelFileName" style="font-size:11px;color:#00ff88;margin-top:6px"></div>
      <input id="pdfInput" class="input-ultra" placeholder="Or PDF URL fallback">
    </div>

    <div class="file-box" id="comicFileBox" style="display:none">
      <label style="font-size:11px;color:#ff8800;font-weight:800">🖼️ COMIC PAGES - MULTIPLE</label>
      <input type="file" id="comicFiles" accept="image/*" multiple style="width:100%;margin-top:8px;color:#999;font-size:11px">
      <div id="comicPreview" style="display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:10px"></div>
      <textarea id="pagesInput" class="input-ultra" rows="2" placeholder="Or page URLs comma separated..."></textarea>
    </div>

    <button class="btn-ultra" id="btnPublish">🚀 PUBLISH v703</button>
    <div id="status" style="text-align:center;font-size:11px;color:#666;margin-top:10px"></div>
  </div>
</div>

<script>
let curType="novel";
let uploadedCoverBase64=null, uploadedPagesBase64=[], uploadedNovelFileBase64=null;
let isAdmin = localStorage.getItem("isAdmin")==="true";
const DEFAULT_PASS = "admin123";

function getAdminPass(){ return localStorage.getItem("adminPass") || DEFAULT_PASS; }

function setType(t){
  curType=t;
  document.getElementById("swNovel").classList.toggle("on",t==="novel");
  document.getElementById("swComic").classList.toggle("on",t==="comic");
  document.getElementById("novelFileBox").style.display=t==="novel"?"block":"none";
  document.getElementById("comicFileBox").style.display=t==="comic"?"block":"none";
}

// ADMIN LOGIN
function adminLogin(){
  const pass = prompt("Enter Admin Password:");
  if(pass===getAdminPass()){
    localStorage.setItem("isAdmin","true");
    isAdmin=true; updateAdminUI(); alert("Admin unlocked 👑");
  }else{ alert("Wrong password! Default is admin123"); }
}
function logoutAdmin(){ localStorage.removeItem("isAdmin"); isAdmin=false; updateAdminUI(); location.reload(); }
function changePass(){
  const np=document.getElementById("newPassInput").value.trim();
  if(np.length<4){ alert("Min 4 chars"); return; }
  localStorage.setItem("adminPass",np); alert("Password changed to: "+np); document.getElementById("newPassInput").value="";
}
let logoClicks=0;
document.getElementById("logoBtn").onclick=()=>{ logoClicks++; if(logoClicks>=5){ logoClicks=0; adminLogin(); } setTimeout(()=>logoClicks=0,2000); };

function updateAdminUI(){
  document.getElementById("adminBadge").style.display=isAdmin?"inline-block":"none";
  document.getElementById("logoutBtn").style.display=isAdmin?"block":"none";
  document.getElementById("adminPanel").style.display=isAdmin?"block":"none";
  if(isAdmin) loadAdminStats();
}

function loadAdminStats(){
  const novels = JSON.parse(localStorage.getItem("myNovels")||"[]");
  const comics = JSON.parse(localStorage.getItem("myBooks")||"[]");
  document.getElementById("totalNovels").innerText=novels.length;
  document.getElementById("totalComics").innerText=comics.length;
  const allStr = localStorage.getItem("myNovels")||"" + localStorage.getItem("myBooks")||"";
  document.getElementById("storageUse").innerText=(allStr.length/1024).toFixed(1)+"KB";
  document.getElementById("adminStatsSmall").innerText=`${novels.length+comics.length} items`;

  // List with delete control
  const listEl=document.getElementById("adminContentList");
  let html="";
  [...novels.map(n=>({...n,type:"novel"})),...comics.map(c=>({...c,type:"comic"}))].forEach(item=>{
    html+=`<div class="admin-list-item">
      <img src="${item.cover}">
      <div style="flex:1"><b style="font-size:12px">${item.title}</b><br><small style="color:#666">${item.type}</small></div>
      <button onclick="deleteItem('${item.id}','${item.type}')" style="background:#ff0044;color:white;border:none;padding:6px 10px;border-radius:8px;font-size:11px;font-weight:800">DELETE</button>
    </div>`;
  });
  listEl.innerHTML=html||"<small style='color:#666'>No content</small>";
}

function deleteItem(id,type){
  if(!confirm("Delete this?")) return;
  if(type==="novel"){
    let arr=JSON.parse(localStorage.getItem("myNovels")||"[]");
    arr=arr.filter(x=>String(x.id)!==String(id));
    localStorage.setItem("myNovels",JSON.stringify(arr));
  }else{
    let arr=JSON.parse(localStorage.getItem("myBooks")||"[]");
    arr=arr.filter(x=>String(x.id)!==String(id));
    localStorage.setItem("myBooks",JSON.stringify(arr));
  }
  loadAdminStats();
}

// FILE HANDLERS - same v701
document.getElementById("coverFile").addEventListener("change",e=>{
  const file=e.target.files[0]; if(!file) return;
  const r=new FileReader(); r.onload=ev=>{ uploadedCoverBase64=ev.target.result; const p=document.getElementById("coverPreview"); p.src=uploadedCoverBase64; p.style.display="block"; }; r.readAsDataURL(file);
});
document.getElementById("comicFiles").addEventListener("change",e=>{
  uploadedPagesBase64=[]; const files=[...e.target.files].slice(0,20); const prev=document.getElementById("comicPreview"); prev.innerHTML="";
  files.forEach(f=>{ const r=new FileReader(); r.onload=ev=>{ uploadedPagesBase64.push(ev.target.result); prev.innerHTML+=`<img src="${ev.target.result}" style="width:100%;height:70px;object-fit:cover;border-radius:8px">`; }; r.readAsDataURL(f); });
});
document.getElementById("novelFile").addEventListener("change",e=>{
  const file=e.target.files[0]; if(!file) return;
  document.getElementById("novelFileName").innerText=file.name;
  const r=new FileReader(); r.onload=ev=>uploadedNovelFileBase64=ev.target.result; r.readAsDataURL(file);
});

document.getElementById("btnPublish").onclick=async()=>{
  const title=document.getElementById("titleInput").value.trim();
  if(!title){ alert("Title required"); return; }
  const author=document.getElementById("authorInput").value.trim()||"GenZ Studio";
  const desc=document.getElementById("descInput").value.trim();
  const finalCover=uploadedCoverBase64||document.getElementById("coverInput").value.trim()||`https://picsum.photos/400/600?random=${Date.now()}`;
  const finalPages=uploadedPagesBase64.length?uploadedPagesBase64:document.getElementById("pagesInput").value.trim().split(",").map(s=>s.trim()).filter(Boolean);
  const finalPdf=uploadedNovelFileBase64||document.getElementById("pdfInput").value.trim()||"https://www.w3.org/WAI/ER/tests/xhtml/testfiles/resources/pdf/dummy.pdf";
  const status=document.getElementById("status"); status.innerText="Publishing...";
  try{
    if(curType==="novel"){
      let arr=JSON.parse(localStorage.getItem("myNovels")||"[]");
      arr.unshift({id:Date.now(),title,author,cover:finalCover,description:desc,pdf:finalPdf,created:Date.now()});
      localStorage.setItem("myNovels",JSON.stringify(arr));
      try{ await fetch("https://gen-z-visual-2.onrender.com/api/novels",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({title,author,description:desc,cover:finalCover,pdfUrl:finalPdf})}) }catch(e){}
      status.innerText="✅ Novel Published";
    }else{
      let arr=JSON.parse(localStorage.getItem("myBooks")||"[]");
      arr.unshift({id:Date.now(),title,author,cover:finalCover,description:desc,pages:finalPages,created:Date.now()});
      localStorage.setItem("myBooks",JSON.stringify(arr));
      try{ await fetch("https://gen-z-visual-2.onrender.com/api/comics",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({title,author,description:desc,cover:finalCover,pages:finalPages})}) }catch(e){}
      status.innerText="✅ Comic Published "+finalPages.length+" pages";
    }
    if(isAdmin) loadAdminStats();
    setTimeout(()=>location.href=curType==="novel"?"novels.html":"comic.html",1000);
  }catch(err){ status.innerText="❌ "+err.message; }
};

updateAdminUI();
</script>
</body>
  </html>
