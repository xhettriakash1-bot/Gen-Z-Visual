<script>
// ===== FIREWALL v350 - KEPT SAME AS LOGIN =====
if(window.top!==window.self) window.top.location=window.self.location;
const Firewall={
  patterns:[/<script/gi,/javascript:/gi,/onerror=/gi,/onload=/gi,/union.*select/gi,/<iframe/gi,/eval\(/gi],
  scan(v){ return this.patterns.some(p=>p.test(v)); },
  protect(){
    document.addEventListener('input',e=>{
      if(e.target.tagName==="INPUT"||e.target.tagName==="TEXTAREA"){
        if(this.scan(e.target.value)){ e.target.value=""; e.target.style.border="2px solid red"; e.target.placeholder="⛔ Blocked"; }
      }
    });
  }
};
window.addEventListener('DOMContentLoaded',()=>Firewall.protect());

// ===== ROLE CHECK - CREATOR + ADMIN (YOUR 2 PROTECTED) =====
(function(){
  const role = (localStorage.getItem("role") || JSON.parse(localStorage.getItem("user")||"{}").role || "").toLowerCase();
  const email = (localStorage.getItem("email") || localStorage.getItem("genz_user") || "").toLowerCase();
  const ALLOWED_ADMINS = ["xhettriakash1@gmail.com","akashchettri2003@gmail.com"];
  if(role!=="creator" && role!=="admin" && !ALLOWED_ADMINS.includes(email)){
    location.href="login.html";
    throw new Error("Not creator");
  }
})();
</script>
