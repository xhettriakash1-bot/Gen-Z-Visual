<!DOCTYPE html><html><head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Admin v703.2 FIX</title>
<style>body{background:#000;color:#fff;font-family:sans-serif;padding:0;margin:0}.top{background:#111;padding:14px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #222}.card{background:#151515;border:1px solid #222;border-radius:16px;padding:14px;margin:12px}.input{width:100%;padding:12px;background:#0a0a0a;border:1px solid #333;border-radius:10px;color:#fff;margin:6px 0;box-sizing:border-box}.btn{width:100%;padding:12px;background:#fff;color:#000;border:none;border-radius:10px;font-weight:900;margin-top:8px}.stat{display:inline-block;background:#1a1a1a;border:1px solid #222;border-radius:10px;padding:10px 16px;margin:4px;text-align:center}</style>
</head><body>
<div class="top">
<div style="font-weight:900">Gen-Z <span style="color:#f0f">Studio v703.2</span></div>
<div><a href="index.html" style="color:#888;text-decoration:none;font-size:12px">Home</a></div>
</div>

<div style="max-width:600px;margin:0 auto;padding:12px">

<div class="card" style="background:#1a001a">
<b id="adminStatus">👤 User Mode</b><br>
<small style="color:#888">Default pass: admin123 | Tap button to become admin</small><br><br>
<button class="btn" style="background:#ff00ff;color:#fff" onclick="login()">🔐 ADMIN LOGIN</button>
<button class="btn" style="background:#333;color:#fff;display:none" id="logoutBtn" onclick="logout()">Logout Admin</button>
</div>

<div id="adminBox" style="display:none">
<div class="card">
<div><span class="stat">Novels: <b id="c1">0</b></span> <span class="stat">Comics: <b id="c2">0</b></span> <span class="stat">Storage: <b id="c3">0</b></span></div>
</div>
<div class="card">
<b>Change Password</b>
<input id="newPass" class="input" placeholder="new password">
<button class="btn" style="background:#0f8" onclick="changeP()">Update Password</button>
<div style="font-size:11px;color:#666;margin-top:6px">Current: <span id="curP"></span></div>
</div>
<div class="card">
<b>All Books (DELETE Control)</b>
<div id="list"></div>
</div>
</div>

<div class="card">
<b>Quick Publish Test</b>
<input id="t" class="input" placeholder="Title">
<input id="cover" class="input" placeholder="Cover URL (optional)">
<button class="btn" onclick="publishTest()">Publish Test Novel</button>
<div id="msg" style="font-size:11px;color:#666;margin-top:6px"></div>
</div>

</div>
<script>
// SUPER SAFE - NO CRASH
let isAdmin = localStorage.getItem("isAdmin")==="true";
function getPass(){ return localStorage.getItem("adminPass")||"admin123"; }
function login(){
  let p=prompt("Password? default admin123");
  if(p===getPass()){ localStorage.setItem("isAdmin","true"); isAdmin=true; show(); alert("Admin OK"); }
  else alert("Wrong - try admin123");
}
function logout(){ localStorage.removeItem("isAdmin"); isAdmin=false; show(); }
function changeP(){ let v=document.getElementById("newPass").value; if(v.length<4){alert("min 4");return;} localStorage.setItem("adminPass",v); alert("New pass: "+v); show(); }
function show(){
  document.getElementById("adminStatus").innerText=isAdmin?"👑 ADMIN MODE":"👤 User Mode";
  document.getElementById("adminBox").style.display=isAdmin?"block":"none";
  document.getElementById("logoutBtn").style.display=isAdmin?"block":"none";
  document.getElementById("curP").innerText=getPass();
  if(!isAdmin) return;
  try{
    let n=JSON.parse(localStorage.getItem("myNovels")||"[]");
    let c=JSON.parse(localStorage.getItem("myBooks")||"[]");
    document.getElementById("c1").innerText=n.length;
    document.getElementById("c2").innerText=c.length;
    document.getElementById("c3").innerText=Math.round(((localStorage.getItem("myNovels")||"").length+(localStorage.getItem("myBooks")||"").length)/1024)+"KB";
    let html="";
    [...n.map(x=>({...x,k:"myNovels"})),...c.map(x=>({...x,k:"myBooks"}))].forEach(it=>{
      html+=`<div style="display:flex;gap:8px;align-items:center;background:#1e1e1e;padding:8px;border-radius:8px;margin:6px 0"><img src="${it.cover}" style="width:36px;height:50px;object-fit:cover;border-radius:6px"><div style="flex:1;font-size:12px"><b>${it.title}</b></div><button onclick="del('${it.k}','${it.id}')" style="background:#f00;color:#fff;border:none;padding:6px 10px;border-radius:6px;font-size:11px">DEL</button></div>`;
    });
    document.getElementById("list").innerHTML=html||"Empty";
  }catch(e){ document.getElementById("list").innerText="Error: "+e.message+" - Click to clear storage"; document.getElementById("list").innerHTML+='<br><button onclick="localStorage.clear();location.reload()" style="background:red;color:white;padding:8px;border:none;border-radius:6px;margin-top:8px">CLEAR ALL</button>'; }
}
function del(k,id){ if(!confirm("Delete?")) return; let a=JSON.parse(localStorage.getItem(k)||"[]"); a=a.filter(x=>String(x.id)!==String(id)); localStorage.setItem(k,JSON.stringify(a)); show(); }
function publishTest(){ let t=document.getElementById("t").value||"Test "+Date.now(); let cover=document.getElementById("cover").value||"https://picsum.photos/400/600"; let a=JSON.parse(localStorage.getItem("myNovels")||"[]"); a.unshift({id:Date.now(),title:t,author:"Admin",cover:cover,description:"test"}); localStorage.setItem("myNovels",JSON.stringify(a)); document.getElementById("msg").innerText="Published!"; show(); }
show();
</script>
</body></html>
