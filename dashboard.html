<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Creator Studio Pro</title>
<link rel="stylesheet" href="style.css">
<style>
*{box-sizing:border-box}
body{background:#0a0a0a;color:white;margin:0;font-family:system-ui}
.top{position:sticky;top:0;z-index:10;display:flex;justify-content:space-between;align-items:center;padding:12px 16px;background:rgba(10,10,10,0.9);backdrop-filter:blur(10px);border-bottom:1px solid #222}
.logo{font-weight:900;font-size:20px}
.logo span{color:#a855f7}
.studio{max-width:650px;margin:0 auto;padding:16px;padding-bottom:100px}
.switcher{display:flex;background:#141417;border:1px solid #232326;border-radius:99px;padding:4px;margin:16px 0}
.switcher div{flex:1;text-align:center;padding:12px;border-radius:99px;font-weight:800;cursor:pointer;color:#888}
.switcher div.on{background:white;color:black}
.card{background:#141417;border:1px solid #232326;border-radius:22px;padding:18px;margin-bottom:18px}
.card h3{margin:0 0 10px;font-size:16px}
.card input,.card textarea,.card select{width:100%;padding:13px;margin:7px 0;background:#0e0e10;border:1px solid #2a2a2e;border-radius:12px;color:white;outline:none;font-size:14px}
.card label{font-size:11px;color:#888;margin-top:6px;display:block}
.btn{width:100%;padding:15px;border:none;border-radius:99px;font-weight:900;margin-top:10px;cursor:pointer;font-size:14px}
.btn-pub{background:white;color:black}
.btn-log{background:#1e1e22;color:white;border:1px solid #333}
.preview{width:90px;height:120px;border-radius:10px;object-fit:cover;margin-top:8px;display:none}
.status{font-size:12px;margin-top:8px;min-height:16px}
.list-item{display:flex;gap:10px;align-items:center;background:#141417;border:1px solid #232326;border-radius:14px;padding:10px;margin-bottom:8px}
.list-item img{width:48px;height:68px;border-radius:8px;object-fit:cover}
.del{margin-left:auto;background:#ff0055;color:white;border:none;padding:6px 12px;border-radius:99px;font-weight:800}
</style>
</head>
<body>
<div class="top"><div class="logo">Studio <span>PRO</span></div><button class="btn-log" style="width:auto;padding:8px 16px" onclick="logout()">Logout</button></div>

<div class="studio">
<h2 id="welcome" style="margin:10px 0">Loading...</h2>

<!-- NEW SWITCHER - 100% WORKING -->
<div class="switcher">
<div id="swNovel" class="on">📚 Novel</div>
<div id="swComic">💥 Comic</div>
</div>

<!-- NOVEL -->
<div id="boxNovel" class="card">
<h3>Publish Novel</h3>
<input id="nTitle" placeholder="Title*">
<input id="nAuthor" placeholder="Author*">
<select id="nGenre"><option>Fantasy</option><option>Romance</option><option>Action</option><option>Horror</option><option>Sci-Fi</option></select>
<label>Cover Image</label>
<input type="file" id="nCoverFile" accept="image/*">
<img id="nPrev" class="preview">
<label>PDF Link (BEST - use Google Drive link) OR small PDF file <3MB</label>
<input type="file" id="nPdfFile" accept="application/pdf">
<input id="nPdfLink" placeholder="https://drive.google.com/...">
<textarea id="nDesc" rows="3" placeholder="Description"></textarea>
<button class="btn btn-pub" id="btnN">📚 Publish Novel</button>
<p id="nStat" class="status"></p>
</div>

<!-- COMIC -->
<div id="boxComic" class="card" style="display:none">
<h3>Publish Comic</h3>
<input id="cTitle" placeholder="Comic Title*">
<input id="cAuthor" placeholder="Author">
<label>Cover Image</label>
<input type="file" id="cCoverFile" accept="image/*">
<img id="cPrev" class="preview">
<label>Comic Pages (Max 12 images)</label>
<input type="file" id="cPages" accept="image/*" multiple>
<p style="font-size:11px;color:#666" id="pageCount"></p>
<textarea id="cDesc" rows="3" placeholder="Description"></textarea>
<button class="btn btn-pub" id="btnC">💥 Publish Comic</button>
<p id="cStat" class="status"></p>
</div>

<h3 style="margin-top:24px">My Uploads</h3>
<div id="myList"></div>
</div>

<script>
// LOGIN CHECK
if(localStorage.getItem("role")!=="creator"){ location.href="login.html"; }
document.getElementById("welcome").innerText="Hello, "+(localStorage.getItem("genz_name")||"Creator")+" 👋";

// SWITCH LOGIC - NEW 100% WORKING METHOD
document.getElementById("swNovel").addEventListener("click", ()=>{
  document.getElementById("boxNovel").style.display="block";
  document.getElementById("boxComic").style.display="none";
  document.getElementById("swNovel").className="on";
  document.getElementById("swComic").className="";
});
document.getElementById("swComic").addEventListener("click", ()=>{
  document.getElementById("boxNovel").style.display="none";
  document.getElementById("boxComic").style.display="block";
  document.getElementById("swNovel").className="";
  document.getElementById("swComic").className="on";
});

// PREVIEW
document.getElementById("nCoverFile").addEventListener("change", function(){ preview(this,"nPrev") });
document.getElementById("cCoverFile").addEventListener("change", function(){ preview(this,"cPrev") });
document.getElementById("cPages").addEventListener("change", function(){ document.getElementById("pageCount").innerText=this.files.length+" pages selected"; });

function preview(input, imgId){
 let f=input.files[0]; if(!f) return;
 let r=new FileReader(); r.onload=e=>{ let im=document.getElementById(imgId); im.src=e.target.result; im.style.display="block"; }; r.readAsDataURL(f);
}
function compress(file, maxW=500, q=0.6){
 return new Promise(res=>{
  let fr=new FileReader();
  fr.onload=e=>{
   let im=new Image();
   im.onload=()=>{
    let c=document.createElement('canvas');
    let sc=maxW/im.width; if(sc>1) sc=1;
    c.width=im.width*sc; c.height=im.height*sc;
    c.getContext('2d').drawImage(im,0,0,c.width,c.height);
    res(c.toDataURL('image/jpeg', q));
   };
   im.src=e.target.result;
  };
  fr.readAsDataURL(file);
 });
}
function fileToBase64(f){ return new Promise((res,rej)=>{ let r=new FileReader(); r.onload=e=>res(e.target.result); r.onerror=rej; r.readAsDataURL(f); }); }

document.getElementById("btnN").addEventListener("click", async ()=>{
 let st=document.getElementById("nStat"); let btn=document.getElementById("btnN");
 try{
  btn.innerText="Publishing..."; st.innerText="";
  let t=document.getElementById("nTitle").value.trim();
  let a=document.getElementById("nAuthor").value.trim();
  if(!t||!a) throw "Enter title & author";
  let coverF=document.getElementById("nCoverFile").files[0];
  let cover=coverF? await compress(coverF, 400, 0.6) : "https://via.placeholder.com/300x400?text=No+Cover";
  let pdfLink=document.getElementById("nPdfLink").value.trim();
  let pdfF=document.getElementById("nPdfFile").files[0];
  let pdf=pdfLink;
  if(pdfF){ if(pdfF.size>2.5*1024*1024) throw "PDF >2.5MB! Use Drive link"; pdf=await fileToBase64(pdfF); }
  if(!pdf) throw "Add PDF link or file";
  let list=JSON.parse(localStorage.getItem("myNovels")||"[]");
  list.push({id:Date.now(), title:t, author:a, genre:document.getElementById("nGenre").value, cover, pdf, desc:document.getElementById("nDesc").value});
  localStorage.setItem("myNovels", JSON.stringify(list));
  st.style.color="#22c55e"; st.innerText="✅ Novel Published! Check Novels page";
  loadList();
 }catch(e){ st.style.color="#ff6b6b"; st.innerText="❌ "+e; if(String(e).includes("quota")) st.innerText="❌ Storage full! Use Drive Link + delete old uploads"; }
 btn.innerText="📚 Publish Novel";
});

document.getElementById("btnC").addEventListener("click", async ()=>{
 let st=document.getElementById("cStat"); let btn=document.getElementById("btnC");
 try{
  btn.innerText="Compressing..."; st.innerText="";
  let t=document.getElementById("cTitle").value.trim();
  if(!t) throw "Enter comic title";
  let coverF=document.getElementById("cCoverFile").files[0];
  let cover=coverF? await compress(coverF, 400, 0.6) : "https://via.placeholder.com/300x400?text=Comic";
  let files=[...document.getElementById("cPages").files];
  if(files.length==0) throw "Select pages";
  if(files.length>12) throw "Max 12 pages";
  let pages=[];
  for(let i=0;i<files.length;i++){ st.innerText="Compressing "+(i+1)+"/"+files.length; pages.push(await compress(files[i], 700, 0.5)); }
  let list=JSON.parse(localStorage.getItem("myComics")||"[]");
  list.push({id:Date.now(), title:t, author:document.getElementById("cAuthor").value, cover, pages, desc:document.getElementById("cDesc").value});
  localStorage.setItem("myComics", JSON.stringify(list));
  st.style.color="#22c55e"; st.innerText="✅ Comic Published! Check Comics page";
  loadList();
 }catch(e){ st.style.color="#ff6b6b"; st.innerText="❌ "+e; }
 btn.innerText="💥 Publish Comic";
});

function loadList(){
 let n=JSON.parse(localStorage.getItem("myNovels")||"[]");
 let c=JSON.parse(localStorage.getItem("myComics")||"[]");
 let h="";
 n.forEach(x=>h+=`<div class="list-item"><img src="${x.cover}"><div><b>${x.title}</b><br><small style="color:#888">Novel</small></div><button class="del" onclick="delN(${x.id})">X</button></div>`);
 c.forEach(x=>h+=`<div class="list-item"><img src="${x.cover}"><div><b>${x.title}</b><br><small style="color:#888">Comic • ${x.pages.length} pages</small></div><button class="del" onclick="delC(${x.id})">X</button></div>`);
 document.getElementById("myList").innerHTML=h||"<p style='color:#666;font-size:12px'>No uploads yet</p>";
}
window.delN=(id)=>{ localStorage.setItem("myNovels", JSON.stringify(JSON.parse(localStorage.getItem("myNovels")||"[]").filter(x=>x.id!=id))); loadList(); }
window.delC=(id)=>{ localStorage.setItem("myComics", JSON.stringify(JSON.parse(localStorage.getItem("myComics")||"[]").filter(x=>x.id!=id))); loadList(); }
function logout(){ localStorage.clear(); location.href="login.html"; }
loadList();
</script>
</body>
 </html>
