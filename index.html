<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Segoe UI',sans-serif}
body{background:#080808;color:#fff;overflow-x:hidden}
header{padding:15px 20px;display:flex;justify-content:space-between;align-items:center;background:rgba(20,20,20,0.8);backdrop-filter:blur(10px);position:sticky;top:0;z-index:100;border-bottom:1px solid #222}
.logo{font-size:22px;font-weight:900;letter-spacing:1px}
.logo span{color:#ff00ff}
.search{width:100%;margin:15px 20px;background:#1a1a1a;border:1px solid #333;border-radius:30px;padding:12px 18px;color:white;outline:none;display:block}
.hero{margin:15px 20px;background:linear-gradient(135deg,#ff00ff,#7000ff);border-radius:20px;padding:25px}
.hero h1{font-size:28px;line-height:1.1}
.hero p{opacity:0.9;margin:10px 0 15px;font-size:14px}
.hero-btn{background:#fff;color:#000;border:none;padding:10px 20px;border-radius:30px;font-weight:700}
.section{padding:15px 20px}
.section-head{display:flex;justify-content:space-between;margin-bottom:12px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.card{background:#151515;border:1px solid #262626;border-radius:16px;overflow:hidden;transition:0.3s}
.card:hover{transform:translateY(-3px);border-color:#ff00ff}
.card img{width:100%;height:200px;object-fit:cover}
.card-info{padding:10px}
.card-info b{font-size:14px}
.card-info small{color:#888;font-size:11px}
.badge{display:inline-block;background:#ff00ff22;color:#ff00ff;border:1px solid #ff00ff44;font-size:10px;padding:2px 8px;border-radius:20px;margin-top:5px}
.nav{position:fixed;bottom:0;left:0;right:0;background:#111;border-top:1px solid #222;display:flex;justify-content:space-around;padding:10px 0;z-index:100}
.nav a{color:#666;text-decoration:none;font-size:11px;text-align:center}
.nav a.active{color:#ff00ff}
</style>
</head>
