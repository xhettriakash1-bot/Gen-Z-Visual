<!DOCTYPE html><html><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gen-Z Visual - Stories for Gen-Z by Gen-Z | Read Novels & Comics</title>

<meta name="keywords" content="Gen-Z Visual, Gen Z stories, novels, comics, visual stories, Akash, akash1-bot, webcomic, webnovel">

<link rel="canonical" href="https://akash1-bot.github.io/">

<style>*{box-sizing:border-box}body{margin:0;background:#07070a;color:#fff;font-family:system-ui}
header{position:sticky;top:0;z-index:99;display:flex;justify-content:space-between;align-items:center;padding:12px 16px;background:rgba(15,15,18,0.95);backdrop-filter:blur(20px);border-bottom:1px solid #222}
.logo{font-weight:900;font-size:20px}.logo span{color:#ff00ff}
.top-btn{padding:8px 14px;border-radius:20px;border:1px solid #333;background:#1a1a1e;color:#aaa;text-decoration:none;font-size:12px;font-weight:700}
.top-btn.primary{background:#fff;color:#000}
.search-wrap{max-width:700px;margin:16px auto;padding:0 16px}
.search-wrap input{width:100%;padding:14px 16px;background:#15151a;border:1px solid #25252c;border-radius:99px;color:#fff;outline:none}
.hero{max-width:700px;margin:0 auto;padding:30px 20px}
.hero h1{font-size:42px;line-height:0.9;letter-spacing:-2px;font-weight:900}
.hero h1 span{background:linear-gradient(90deg,#ff00ff,#7a00ff);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.hero p{color:#888;font-size:14px;margin:14px 0;max-width:400px}
.grid{max-width:700px;margin:0 auto;padding:0 16px 120px;display:grid;grid-template-columns:1fr 1fr;gap:12px}
.card{background:#15151a;border:1px solid #222;border-radius:16px;overflow:hidden;cursor:pointer;transition:transform .2s}
.card:hover{transform:translateY(-3px);border-color:#ff00ff44}
.card img{width:100%;height:180px;object-fit:cover}
.card-body{padding:10px}.card-body b{font-size:13px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.card-body small{color:#666;font-size:11px}
.nav{position:fixed;bottom:0;left:0;right:0;background:#111;border-top:1px solid #222;display:flex;justify-content:space-around;padding:8px 0;z-index:99}
.nav a{color:#666;text-decoration:none;font-size:11px;text-align:center}.nav a.active{color:#ff00ff}
</style>
<script type="application/ld+json">{"@context":"https://schema.org","@type":"WebSite","name":"Gen-Z Visual","url":"https://akash1-bot.github.io/","description":"Read, create, and share visual stories for Gen-Z"}</script>
</head><body>
<header><div class="logo">Gen-Z <span>Visual</span> <span style="font-size:10px;background:#00ff88;color:#000;padding:2px 6px;border-radius:20px">v704.5 FINAL</span></div>
<div style="display:flex;gap:6px"><a href="login.html?v=704.5" class="top-btn primary">Login</a><a href="dashboard.html?v=704.5" class="top-btn">Studio</a></div></header>
<div class="search-wrap"><input id="searchBox" placeholder="Search novels, comics..." oninput="filterCards()"></div>
<div class="hero"><h1>Stories for<br><span>Gen-Z</span><br>by Gen-Z</h1><p>Read, create, and share visual stories. LIVE + LOCAL merged</p><div style="display:flex;gap:10px"><a href="novels.html?v=704.5" style="padding:12px 20px;background:#fff;color:#000;border-radius:99px;text-decoration:none;font-weight:900;font-size:13px">📚 Novels →</a><a href="comic.html?v=704.5" style="padding:12px 20px;background:#ffffff15;color:#fff;border-radius:99px;text-decoration:none;font-weight:800;font-size:13px;border:1px solid #333">🎨 Comics</a></div><div id="status" style="margin-top:16px;font-size:11px;color:#00ff88">● Checking LIVE...</div></div>
<div id="grid" class="grid"><div style="grid-column:1/-1;text-align:center;color:#555;padding:20px">Loading stories...</div></div>
<div class="nav"><a href="index.html" class="active">🏠<br>Home</a><a href="novels.html">📚<br>Novels</a><a href="comic.html">💥<br>Comics</a><a href="dashboard.html">📝<br>Studio</a></div>
<script>
const API="https://gen-z-visual-2.onrender.com/api";
let allItems=[];
async function loadAll(){
 let grid=document.getElementById('grid'), status=document.getElementById('status');
 try{
  status.innerText='● LIVE Checking...';
  let r1=await fetch(API+'/novels'); let d1=await r1.json();
  let r2=await fetch(API+'/comics'); let d2=await r2.json();
  let novels=(d1.novels||d1||[]).map(n=>({...n,type:'novel'}));
  let comics=(d2.comics||d2||[]).map(c=>({...c,type:'comic'}));
  allItems=[...novels,...comics];
  if(allItems.length==0){ grid.innerHTML='<div style="grid-column:1/-1;color:#666">No stories yet. Be first to publish!</div>'; status.innerText='● LIVE Empty'; return; }
  render(allItems); status.innerText='● LIVE '+allItems.length+' stories';
 }catch(e){ status.innerText='● LOCAL Mode'; let local=JSON.parse(localStorage.getItem('myNovels')||'[]'); allItems=local; render(local); }
}
function render(items){
 let g=document.getElementById('grid');
 g.innerHTML=items.map(i=>`<div class="card" onclick="openItem('${i._id||i.id}','${i.type||'novel'}')"><img src="${i.cover||i.coverImage||'https://picsum.photos/seed/'+(i._id||i.id)+'/400/600'}" loading="lazy"><div class="card-body"><b>${i.title||'Untitled'}</b><small>${i.author||'Akash'} • ${i.type||'novel'}</small></div></div>`).join('');
}
function filterCards(){ let q=document.getElementById('searchBox').value.toLowerCase(); render(allItems.filter(i=>(i.title||'').toLowerCase().includes(q))); }
function openItem(id,type){ if(type=='comic') location.href='read-comic.html?id='+id; else location.href='read.html?id='+id; }
loadAll();
</script></body></html>
