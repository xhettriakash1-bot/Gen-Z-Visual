<!DOCTYPE html>
<html><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gen-Z Visual v703.2 - Home</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#07070a;color:#fff;font-family:system-ui,sans-serif}
header{position:sticky;top:0;z-index:99;display:flex;justify-content:space-between;align-items:center;padding:12px 16px;background:rgba(15,15,18,0.9);backdrop-filter:blur(20px);border-bottom:1px solid #222}
.logo{font-weight:900;font-size:20px;letter-spacing:-1px}.logo span{color:#ff00ff}
.top-btn{padding:8px 14px;border-radius:20px;border:1px solid #333;background:#1a1a1e;color:#aaa;text-decoration:none;font-size:12px;font-weight:700}
.top-btn.primary{background:#fff;color:#000;border-color:#fff}
.search-wrap{max-width:700px;margin:16px auto;padding:0 16px}
.search-wrap input{width:100%;padding:14px 16px;background:#15151a;border:1px solid #25252c;border-radius:99px;color:#fff;outline:none}
.hero{max-width:700px;margin:0 auto;padding:30px 20px}
.hero h1{font-size:42px;line-height:0.9;letter-spacing:-2px;font-weight:900}
.hero h1 span{background:linear-gradient(90deg,#ff00ff,#7a00ff);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.hero p{color:#888;font-size:14px;margin:14px 0;max-width:400px}
.hero-btn{padding:12px 20px;background:#fff;color:#000;border-radius:99px;text-decoration:none;font-weight:900;display:inline-block;font-size:13px}
.grid{max-width:700px;margin:0 auto;padding:0 16px 120px;display:grid;grid-template-columns:1fr 1fr;gap:12px}
.card{background:#15151a;border:1px solid #222;border-radius:16px;overflow:hidden}
.card img{width:100%;height:180px;object-fit:cover}
.card-body{padding:10px}
.card-body b{font-size:13px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card-body small{color:#666;font-size:11px}
.nav{position:fixed;bottom:0;left:0;right:0;background:#111;border-top:1px solid #222;display:flex;justify-content:space-around;padding:8px 0;z-index:99}
.nav a{color:#666;text-decoration:none;font-size:11px;text-align:center}
.nav a.active{color:#ff00ff}
</style>
</head><body>
<header>
<div class="logo">Gen-Z <span>Visual</span> <span style="font-size:10px;background:#ff00ff;color:#fff;padding:2px 6px;border-radius:20px">v703.2</span></div>
<div style="display:flex;gap:6px">
<a href="login.html" class="top-btn primary">Login</a>
<a href="dashboard.html" class="top-btn">Studio</a>
</div>
</header>

<div class="search-wrap">
<input id="searchBox" placeholder="Search novels, comics..." oninput="filterCards()">
</div>

<div class="hero">
<h1>Stories for<br><span>Gen-Z</span><br>by Gen-Z</h1>
<p>Read, create, and share visual stories. 100% free, creator-first. v703.2 PUBLIC - No Domain Lock.</p>
<div style="display:flex;gap:10px">
<a href="novels.html" class="hero-btn">📚 Novels →</a>
<a href="comic.html" class="top-btn" style="background:#ffffff15;color:#fff">🎨 Comics</a>
</div>
<div id="status" style="margin-top:16px;font-size:11px;color:#00ff88;background:#00ff8815;border:1px solid #00ff8830;padding:6px 12px;border-radius:20px;display:inline-block">● LIVE v703.2</div>
</div>

<div class="grid" id="grid"></div>

<div class="nav">
<a href="index.html" class="active">🏠<br>Home</a>
<a href="novels.html">📚<br>Novels</a>
<a href="comic.html">🎨<br>Comics</a>
<a href="dashboard.html">📝<br>Studio</a>
</div>

<script>
const API="https://gen-z-visual-2.onrender.com";
let allItems=[];
async function load(){
  let novels=[], comics=[];
  try{
    const r1=await fetch(`${API}/api/novels`).then(r=>r.json()).catch(()=>[]);
    const r2=await fetch(`${API}/api/comics`).then(r=>r.json()).catch(()=>[]);
    novels=Array.isArray(r1)?r1:r1.novels||[];
    comics=Array.isArray(r2)?r2:r2.comics||[];
  }catch(e){}
  // Merge local
  try{ novels=[...JSON.parse(localStorage.getItem("myNovels")||"[]"),...novels]; }catch(e){}
  try{ comics=[...JSON.parse(localStorage.getItem("myBooks")||"[]"),...comics]; }catch(e){}
  allItems=[...novels.map(n=>({...n,type:"Novel"})),...comics.map(c=>({...c,type:"Comic"}))];
  render(allItems);
}
function render(items){
  const grid=document.getElementById("grid");
  grid.innerHTML=items.map(it=>`
    <div class="card" onclick="location.href='${it.type==='Novel'?'novels':'comic'}.html'">
      <img src="${it.cover||'https://picsum.photos/400/600'}" loading="lazy">
      <div class="card-body">
        <b>${it.title||'Untitled'}</b>
        <small>${it.type} • ${it.author||'GenZ'}</small>
      </div>
    </div>
  `).join("") || "<div style='grid-column:1/3;text-align:center;color:#666;padding:30px'>No stories yet - Be first to publish in Studio!</div>";
  document.getElementById("status").innerText=`● LIVE ${items.length} stories v703.2`;
}
function filterCards(){
  const q=document.getElementById("searchBox").value.toLowerCase();
  render(allItems.filter(i=>(i.title||"").toLowerCase().includes(q) || (i.author||"").toLowerCase().includes(q)));
}
load();
</script>
</body></html>
