<!DOCTYPE html><html><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gen-Z Visual v705 PRO</title>
<style>*{box-sizing:border-box}body{margin:0;background:#07070a;color:#fff;font-family:system-ui}
header{position:sticky;top:0;z-index:99;display:flex;justify-content:space-between;align-items:center;padding:12px 16px;background:rgba(15,15,18,0.95);border-bottom:1px solid #222}
.logo{font-weight:900;font-size:20px}.logo span{color:#ff00ff}
.top-btn{padding:8px 14px;border-radius:20px;border:1px solid #333;background:#1a1a1e;color:#aaa;text-decoration:none;font-size:12px;font-weight:700}
.top-btn.primary{background:#fff;color:#000}
.search-wrap{max-width:700px;margin:16px auto;padding:0 16px}
.search-wrap input{width:100%;padding:14px 16px;background:#15151a;border:1px solid #25252c;border-radius:99px;color:#fff;outline:none}
.hero{max-width:700px;margin:0 auto;padding:30px 20px}
.hero h1{font-size:42px;line-height:0.9;font-weight:900}
.hero h1 span{background:linear-gradient(90deg,#ff00ff,#7a00ff);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.grid{max-width:700px;margin:0 auto;padding:0 16px 120px;display:grid;grid-template-columns:1fr 1fr;gap:12px}
.card{background:#15151a;border:1px solid #222;border-radius:16px;overflow:hidden;position:relative;cursor:pointer}
.card img{width:100%;height:180px;object-fit:cover}
.card-body{padding:10px}.card-body b{font-size:13px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.card-body small{color:#666;font-size:11px}
.badge{position:absolute;top:8px;left:8px;padding:3px 8px;border-radius:20px;font-size:9px;font-weight:900}.live{background:#00ff88;color:#000}.paid{background:#facc15;color:#000}
.nav{position:fixed;bottom:0;left:0;right:0;background:#111;border-top:1px solid #222;display:flex;justify-content:space-around;padding:8px 0}
.nav a{color:#666;text-decoration:none;font-size:11px;text-align:center}.nav a.active{color:#ff00ff}
.footer{max-width:700px;margin:0 auto;padding:40px 20px 120px;text-align:center;border-top:1px solid #222;margin-top:30px}.footer a{color:#888;text-decoration:none;margin:0 8px;font-size:12px}
</style>
</head><body>
<header><div class="logo">Gen-Z <span>Visual</span></div><div style="display:flex;gap:6px"><a href="login.html" class="top-btn primary">Login</a><a href="dashboard.html" class="top-btn">Studio</a></div></header>
<div class="search-wrap"><input id="searchBox" placeholder="Search novels, comics..." oninput="filterCards()"></div>
<div class="hero"><h1>Stories for<br><span>Gen-Z</span><br>by Gen-Z</h1><p>LIVE + PAID ₹ + VIEWS - NEVER EMPTY</p><div id="status" style="margin-top:16px;font-size:11px;color:#00ff88">● Waking LIVE...</div></div>
<div id="grid" class="grid"></div>

<footer class="footer">
<div style="color:#666;font-size:11px;margin-bottom:12px">Gen-Z Visual © 2025 | Digital Novels ₹10 & Comics ₹20</div>
<a href="terms.html">Terms</a> | <a href="privacy.html">Privacy</a> | <a href="refund.html">Refund</a> | <a href="cancellation.html">Cancellation</a> | <a href="contact.html">Contact</a>
<div style="margin-top:12px;color:#555;font-size:10px">xhettriakash1@gmail.com | Instant Digital Delivery</div>
</footer>

<div class="nav"><a href="index.html" class="active">🏠<br>Home</a><a href="novels.html">📚<br>Novels</a><a href="comics.html">💥<br>Comics</a><a href="dashboard.html">📝<br>Studio</a></div>
<script>
const API_BASE="https://gen-z-visual-2.onrender.com"; const API=API_BASE+"/api"; let allItems=[];
async function getLive(){ try{ let [r1,r2]=await Promise.all([fetch(API+'/novels'),fetch(API+'/comics')]); let n=await r1.json(); let c=await r2.json(); n=Array.isArray(n)?n:(n.novels||[]); c=Array.isArray(c)?c:(c.comics||[]); return [...n.map(x=>({...x,type:'novel'})), ...c.map(x=>({...x,type:'comic'}))]; }catch{ return []; } }
async function loadAll(){ 
  try{
    await fetch(API_BASE+"/api/health");
    document.getElementById('status').innerText="● LIVE - Connected";
  }catch{}
  let live=await getLive(); allItems=live;
  let g=document.getElementById('grid'); 
  if(live.length>0){ 
    g.innerHTML=live.map(i=>{
      const pid=i._id||i.id;
      const link=i.type==='novel'?`read-novel.html?id=${pid}`:`read-comic.html?id=${pid}`;
      return `<div class="card" onclick="location.href='${link}'"><span class="badge ${i.access==='paid'?'paid':'live'}">${i.access==='paid'?'₹'+(i.price||10):'LIVE'}</span><img src="${i.cover||i.coverImage||''}" onerror="this.src='https://via.placeholder.com/300x400/15151a/ff00ff?text=GenZ'"><div class="card-body"><b>${i.title}</b><small>${i.author||'Creator'}</small></div></div>`
    }).join(''); 
    document.getElementById('status').innerText=`● LIVE - ${live.length} Stories Active`;
  } else {
    document.getElementById('status').innerText="● LIVE - Ready";
    g.innerHTML='<div style="grid-column:1/3;text-align:center;color:#555;padding:30px">Publish first story in Studio</div>';
  }
}
function filterCards(){
  let q=document.getElementById('searchBox').value.toLowerCase();
  let f=allItems.filter(i=>i.title.toLowerCase().includes(q));
  let g=document.getElementById('grid');
  if(f.length===0){ g.innerHTML='<div style="grid-column:1/3;text-align:center;color:#666">No match</div>'; return; }
  g.innerHTML=f.map(i=>{
    const pid=i._id||i.id;
    const link=i.type==='novel'?`read-novel.html?id=${pid}`:`read-comic.html?id=${pid}`;
    return `<div class="card" onclick="location.href='${link}'"><span class="badge ${i.access==='paid'?'paid':'live'}">${i.access==='paid'?'₹'+(i.price||10):'LIVE'}</span><img src="${i.cover||i.coverImage}"><div class="card-body"><b>${i.title}</b><small>${i.author}</small></div></div>`
  }).join('');
}
loadAll();
setInterval(()=>{ fetch(API_BASE+"/api/health").catch(()=>{}); }, 240000);
setTimeout(()=>{ fetch(API_BASE+"/api/health").then(()=>{ document.getElementById('status').innerText="● LIVE - All OK"; }).catch(()=>{}); }, 3000);
</script></body></html>
