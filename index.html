<!DOCTYPE html><html><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gen-Z Visual v707 FACEBOOK</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#07070a;color:#fff;font-family:system-ui}
header{position:sticky;top:0;z-index:99;display:flex;justify-content:space-between;align-items:center;padding:12px 16px;background:rgba(15,15,18,0.9);backdrop-filter:blur(14px);border-bottom:1px solid #222}
.logo{font-weight:900;font-size:21px}.logo span{background:linear-gradient(90deg,#ff00ff,#ff8800);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.top-btn{padding:8px 14px;border-radius:20px;border:1px solid #333;background:#1a1a1e;color:#aaa;text-decoration:none;font-size:12px;font-weight:700}.top-btn.primary{background:#fff;color:#000}
.search-wrap{max-width:700px;margin:12px auto;padding:0 16px;position:sticky;top:58px;z-index:90}
.search-wrap input{width:100%;padding:13px 16px;background:#15151a;border:1px solid #25252c;border-radius:99px;color:#fff;outline:none}
.hero{max-width:700px;margin:0 auto;padding:18px 16px 6px}
.hero h1{font-size:40px;line-height:0.9;font-weight:900;margin:0}.hero h1 span{background:linear-gradient(90deg,#ff00ff,#7a00ff);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.pills{max-width:700px;margin:8px auto;padding:0 16px;display:flex;gap:8px;overflow:auto}.pills::-webkit-scrollbar{display:none}
.pill{padding:8px 14px;border-radius:99px;border:1px solid #333;background:#15151a;color:#888;font-size:12px;font-weight:800;white-space:nowrap;cursor:pointer}.pill.active{background:#fff;color:#000}
.trend{max-width:700px;margin:10px auto;padding:0 16px;display:flex;gap:10px;overflow:auto}.trend::-webkit-scrollbar{display:none}
.tcard{min-width:260px;height:150px;border-radius:18px;overflow:hidden;position:relative;background:#15151a;border:1px solid #222;flex-shrink:0}
.tcard img{width:100%;height:100%;object-fit:cover;opacity:0.75}
.tcard .ov{position:absolute;bottom:0;left:0;right:0;padding:10px;background:linear-gradient(transparent,#000)}
.grid{max-width:700px;margin:0 auto;padding:10px 16px 120px;display:grid;grid-template-columns:1fr 1fr;gap:10px}
.card{background:#15151a;border:1px solid #222;border-radius:16px;overflow:hidden;position:relative;cursor:pointer;transition:.2s}
.card:hover{transform:translateY(-3px);border-color:#ff00ff44;box-shadow:0 6px 24px rgba(255,0,255,.15)}
.card img{width:100%;height:185px;object-fit:cover;background:#111}
.card-body{padding:9px}.card-body b{font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block}
.card-body small{color:#777;font-size:11px;display:flex;justify-content:space-between;margin-top:3px}
.badge{position:absolute;top:7px;left:7px;padding:3px 8px;border-radius:20px;font-size:9px;font-weight:900}.live{background:#00ff88;color:#000}.paid{background:#facc15;color:#000}.hot{background:linear-gradient(90deg,#ff00ff,#ff8800);color:#fff}
.actions{display:flex;gap:6px;padding:6px 8px 8px;border-top:1px solid #1f1f26;margin-top:6px}
.act{flex:1;padding:6px;background:#1e1e26;border:1px solid #262636;border-radius:8px;color:#aaa;font-size:11px;text-align:center;cursor:pointer}
.act.liked{background:#ff00ff22;color:#ff00ff;border-color:#ff00ff44}
.skel{height:230px;border-radius:16px;background:linear-gradient(90deg,#15151a 25%,#1f1f27 50%,#15151a 75%);background-size:200% 100%;animation:sh 1.1s infinite}
@keyframes sh{0%{background-position:200% 0}100%{background-position:-200% 0}}
.nav{position:fixed;bottom:0;left:0;right:0;background:rgba(17,17,17,.94);backdrop-filter:blur(14px);border-top:1px solid #222;display:flex;justify-content:space-around;padding:7px 0;z-index:99}
.nav a{color:#666;text-decoration:none;font-size:11px;text-align:center}.nav a.active{color:#ff00ff}
</style>
</head><body>
<header><div class="logo">Gen-Z <span>Visual</span> <small style="background:#00ff88;color:#000;font-size:9px;padding:2px 6px;border-radius:6px">v707 FB</small></div><div style="display:flex;gap:6px"><a href="login.html" class="top-btn primary">Login</a><a href="dashboard.html?v=707" class="top-btn">Studio</a></div></header>
<div class="search-wrap"><input id="searchBox" placeholder="🔍 Search..." oninput="doFilter()"></div>
<div class="hero"><h1>Stories for<br><span>Gen-Z</span><br>by Gen-Z</h1><div id="status" style="margin-top:8px;font-size:11px;color:#00ff88">● Waking LIVE...</div></div>
<div class="pills" id="pills"><div class="pill active" onclick="setCat('all',this)">✨ All</div><div class="pill" onclick="setCat('novel',this)">📚 Novels</div><div class="pill" onclick="setCat('comic',this)">💥 Comics</div><div class="pill" onclick="setCat('free',this)">🆓 Free</div><div class="pill" onclick="setCat('paid',this)">💎 Paid</div><div class="pill" onclick="setCat('saved',this)">📚 Saved</div></div>
<div class="trend" id="trend" style="display:none"></div>
<div id="grid" class="grid"><div class="skel"></div><div class="skel"></div></div>
<div class="nav"><a class="active">🏠<br>Home</a><a href="novels.html">📚<br>Novels</a><a href="comics.html">💥<br>Comics</a><a href="dashboard.html">📝<br>Studio</a></div>
<script>
const API_BASE="https://gen-z-visual-2.onrender.com";const API=API_BASE+"/api";
let all=[],filtered=[],cat='all',page=0;const PAGE_SIZE=10;
let saved=JSON.parse(localStorage.getItem('genz_saved')||'[]');
let liked=JSON.parse(localStorage.getItem('genz_liked')||'[]');

async function getLive(){
 try{
  let [r1,r2]=await Promise.all([fetch(API+'/novels',{cache:"no-store"}),fetch(API+'/comics',{cache:"no-store"})]);
  let n=await r1.json();let c=await r2.json();
  n=Array.isArray(n)?n:(n.novels||[]);c=Array.isArray(c)?c:(c.comics||[]);
  return [...n.map(x=>({...x,type:'novel',views:x.views||0})),...c.map(x=>({...x,type:'comic',views:x.views||0}))].sort((a,b)=>b.views-a.views);
 }catch{return [];}
}
function setCat(c,el){
 cat=c;document.querySelectorAll('.pill').forEach(p=>p.classList.remove('active'));el.classList.add('active');
 page=0;doFilter();
}
function toggleSave(id,e){
 e.stopPropagation();
 let i=saved.indexOf(id);
 if(i>-1){saved.splice(i,1)}else{saved.push(id)}
 localStorage.setItem('genz_saved',JSON.stringify(saved));
 doFilter();
}
function toggleLike(id,e){
 e.stopPropagation();
 let i=liked.indexOf(id);
 if(i>-1){liked.splice(i,1)}else{liked.push(id)}
 localStorage.setItem('genz_liked',JSON.stringify(liked));
 doFilter();
}
function doFilter(){
 let q=document.getElementById('searchBox').value.toLowerCase();
 filtered=all.filter(x=>{
  let okCat = cat==='all' || (cat==='novel'&&x.type==='novel') || (cat==='comic'&&x.type==='comic') || (cat==='free'&&x.access!=='paid') || (cat==='paid'&&x.access==='paid') || (cat==='saved'&&saved.includes(x._id||x.id));
  let okQ = !q || x.title.toLowerCase().includes(q);
  return okCat && okQ;
 });
 page=0;render(true);
}
function render(reset){
 let g=document.getElementById('grid');
 if(reset) g.innerHTML='';
 let slice=filtered.slice(page*PAGE_SIZE,(page+1)*PAGE_SIZE);
 if(slice.length===0 && page===0){ g.innerHTML='<div style="grid-column:1/3;text-align:center;color:#555;padding:40px">No stories<br><small>Try other category</small></div>'; return; }
 slice.forEach(i=>{
  let pid=i._id||i.id;let link=i.type==='novel'?`read-novel.html?id=${pid}`:`read-comic.html?id=${pid}`;
  let isSaved=saved.includes(pid);let isLiked=liked.includes(pid);
  let div=document.createElement('div');div.className='card';
  div.innerHTML=`<span class="badge ${i.access==='paid'?'paid':'live'}">${i.access==='paid'?'₹'+(i.price||10):'LIVE'}</span><img loading="lazy" src="${i.cover||i.coverImage||''}" onerror="this.src='https://via.placeholder.com/300x400/15151a/ff00ff?text=GenZ'" onclick="location.href='${link}'"><div class="card-body" onclick="location.href='${link}'"><b>${i.title.slice(0,26)}</b><small><span>${i.type==='novel'?'📚':'💥'} ${i.views||0} 👁️</span><span>${i.author||'Akash'}</span></small></div><div class="actions"><div class="act ${isLiked?'liked':''}" onclick="toggleLike('${pid}',event)">${isLiked?'❤️ Liked':'🤍 Like'}</div><div class="act ${isSaved?'liked':''}" onclick="toggleSave('${pid}',event)">${isSaved?'📚 Saved':'🔖 Save'}</div></div>`;
  g.appendChild(div);
 });
 document.getElementById('status').innerText=`● LIVE • ${filtered.length} stories • ${saved.length} saved`;
}
async function loadAll(){
 try{await fetch(API_BASE+"/",{cache:"no-store"})}catch{}
 all=await getLive();
 // trending top 3
 if(all.length>1){
  let tr=document.getElementById('trend');tr.style.display='flex';
  tr.innerHTML=all.slice(0,3).map(i=>{
   let pid=i._id||i.id;let link=i.type==='novel'?`read-novel.html?id=${pid}`:`read-comic.html?id=${pid}`;
   return `<div class="tcard" onclick="location.href='${link}'"><img src="${i.cover||i.coverImage}" loading="lazy"><span class="badge hot" style="top:8px;left:8px">🔥 ${i.views||0} views</span><div class="ov"><b style="font-size:13px">${i.title.slice(0,22)}</b><br><small style="color:#ccc">Trending now</small></div></div>`
  }).join('');
 }
 doFilter();
}
// infinite scroll like Facebook
window.addEventListener('scroll',()=>{
 if(window.innerHeight+window.scrollY >= document.body.offsetHeight-600){
  if((page+1)*PAGE_SIZE < filtered.length){ page++; render(false); }
 }
});
loadAll();
setInterval(()=>fetch(API_BASE+"/",{cache:"no-store"}).catch(()=>{}),240000);
</script></body></html>
