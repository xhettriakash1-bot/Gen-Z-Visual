<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gen-Z Visual - Read Comics & Novels</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<header>
<div class="logo">Gen-Z <span>Visual</span></div>
<div style="display:flex;gap:8px">
<a href="login.html" class="top-btn" style="background:#1e1e22;color:white;">Login</a>
<a href="dashboard.html" class="top-btn" style="background:#00ff88;color:black;">Dashboard</a>
</div>
</header>

<div class="search-wrap">
<input class="search" id="searchBox" placeholder="🔍 Search novels, comics, creators..." onkeyup="searchNow()">
</div>

<div class="hero">
<h1>Read What<br>Gen-Z Loves.</h1>
<p>1000+ Comics & Novels. Creator-first platform built with XML.</p>
<button class="hero-btn" onclick="location.href='novels.html'">Start Reading →</button>
</div>

<div class="section">
<div class="section-head"><h3>🔥 Trending Novels</h3><a href="novels.html" class="viewall">VIEW ALL</a></div>
<div class="grid" id="novelGrid">
<div class="card skeleton" style="height:280px"></div><div class="card skeleton" style="height:280px"></div>
</div>
</div>

<div class="section" style="margin-bottom:100px">
<div class="section-head"><h3>🎨 Top Comics</h3><a href="comic.html" class="viewall" style="color:#00ff88">VIEW ALL</a></div>
<div class="grid" id="comicGrid"></div>
</div>

<div class="nav">
<a class="active" href="index.html">🏠<br>Home</a>
<a href="novels.html">📖<br>Novels</a>
<a href="comic.html">🎨<br>Comics</a>
<a href="dashboard.html">👤<br>You</a>
</div>

<script>
// LOAD FROM XML - PURE JS + XML
async function loadAll(){
  try{
    // NOVELS
    let r1 = await fetch('data/novels.xml');
    let t1 = await r1.text();
    let x1 = new DOMParser().parseFromString(t1,"text/xml");
    let grid = document.getElementById("novelGrid");
    grid.innerHTML="";
    [...x1.querySelectorAll("novel")].forEach(n=>{
      let id=n.querySelector("id")?.textContent||"1";
      let title=n.querySelector("title")?.textContent||"Untitled";
      let author=n.querySelector("author")?.textContent||"Unknown";
      let cover=n.querySelector("cover")?.textContent||`https://via.placeholder.com/300x400/222/fff?text=${encodeURIComponent(title)}`;
      grid.innerHTML+=`<div class="card" onclick="location.href='read.html?id=${id}'"><img src="${cover}" onerror="this.src='https://via.placeholder.com/300x400/222/fff?text=No+Cover'"><div class="card-info"><b>${title}</b><small>by ${author}</small><br><span class="badge">NOVEL</span></div></div>`;
    });

    // COMICS
    let r2 = await fetch('data/comics.xml');
    let t2 = await r2.text();
    let x2 = new DOMParser().parseFromString(t2,"text/xml");
    let cGrid = document.getElementById("comicGrid");
    cGrid.innerHTML="";
    [...x2.querySelectorAll("comic")].slice(0,4).forEach(c=>{
      let id=c.querySelector("id")?.textContent||"1";
      let title=c.querySelector("title")?.textContent||"Untitled";
      let author=c.querySelector("author")?.textContent||"Unknown";
      let cover=c.querySelector("cover")?.textContent||"";
      cGrid.innerHTML+=`<div class="card" onclick="location.href='read-comic.html?id=${id}'"><img src="${cover}"><div class="card-info"><b>${title}</b><small>by ${author}</small><br><span class="badge" style="background:#00ff8822;border-color:#00ff8844;color:#00ff88">COMIC</span></div></div>`;
    });
  }catch(e){
    document.getElementById("novelGrid").innerHTML="<p style='color:#666;padding:10px'>Make sure data/novels.xml and data/comics.xml exist</p>";
  }
}

function searchNow(){
  let q=document.getElementById("searchBox").value.toLowerCase();
  document.querySelectorAll(".card").forEach(c=>{
    c.style.display=c.innerText.toLowerCase().includes(q)?"block":"none";
  });
}
loadAll();
</script>
</body>
  </html>
