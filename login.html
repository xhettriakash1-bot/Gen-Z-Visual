<!DOCTYPE html><html><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Login v708 FB - Gen-Z Visual</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#07070a;color:#fff;font-family:system-ui}
header{position:sticky;top:0;display:flex;justify-content:space-between;align-items:center;padding:12px 16px;background:#111;border-bottom:1px solid #222}
.logo{font-weight:900}.logo span{color:#ff00ff}
.top-btn{background:#222;color:#aaa;padding:8px 14px;border-radius:20px;font-size:12px;text-decoration:none}
.box{max-width:460px;margin:20px auto;padding:0 16px 110px}
.card{background:#15151a;border:1px solid #25252c;border-radius:24px;padding:22px}
.tabs{display:flex;background:#0e0e12;padding:4px;border-radius:99px;margin-bottom:16px;border:1px solid #222}
.tabs div{flex:1;text-align:center;padding:10px;border-radius:99px;font-weight:800;cursor:pointer;color:#666;font-size:11px}
.tabs div.on{background:#fff;color:#000}
.role{display:flex;gap:8px;margin:12px 0}
.role div{flex:1;text-align:center;padding:10px;border-radius:99px;background:#1a1a22;color:#888;font-weight:800;cursor:pointer;border:1px solid #222;font-size:12px}
.role div.on{background:linear-gradient(135deg,#ff00ff,#7a00ff);color:#fff}
input,textarea{width:100%;padding:12px 14px;margin:6px 0;background:#0e0e12;border:1px solid #2a2a32;border-radius:12px;color:#fff;outline:none}
input:focus{border-color:#ff00ff}
.btn{width:100%;padding:13px;background:#fff;color:#000;border:none;border-radius:99px;font-weight:900;cursor:pointer;margin-top:10px}
.btn.primary{background:linear-gradient(135deg,#ff00ff,#7a00ff);color:#fff}
.msg{font-size:11px;margin-top:8px;text-align:center;min-height:14px;color:#ff8800;white-space:pre-wrap}
.nav{position:fixed;bottom:0;left:0;right:0;background:#111;border-top:1px solid #222;display:flex;justify-content:space-around;padding:8px 0}
.nav a{color:#666;text-decoration:none;font-size:11px;text-align:center}.nav a.active{color:#ff00ff}
</style>
</head><body>
<header><div class="logo">Gen-Z <span>Visual</span> <span style="font-size:10px;background:#ff00ff;color:#fff;padding:3px 8px;border-radius:99px">v708 FB OPEN</span></div><a href="index.html?v=708" class="top-btn">Home</a></header>
<div class="box">
<div class="card">
<div style="text-align:center;margin-bottom:14px"><div style="width:56px;height:56px;background:linear-gradient(135deg,#ff00ff,#7a00ff);border-radius:16px;display:flex;align-items:center;justify-content:center;font-size:28px;margin:0 auto">🔐</div><h2 style="margin:10px 0 4px;font-weight:900">Welcome v708 FB</h2><p style="font-size:11px;color:#666;margin:0">LIVE + FB LIKE ❤️ + PAID ₹ + 👁️ • gen-z-visual-2</p></div>
<div class="tabs"><div id="tLogin" class="on" onclick="showLogin()">Login</div><div id="tSignup" onclick="showSignup()">Sign Up</div><div id="tForgot" onclick="showForgot()">Change Pass</div></div>
<div id="loginBox">
<input id="lEmail" placeholder="Email">
<input id="lPass" type="password" placeholder="Password">
<button class="btn primary" onclick="doLogin()" id="loginBtn">Login → v708 FB</button>
<p id="lMsg" class="msg"></p>
<div style="text-align:center;font-size:11px;color:#00ff88" id="healthCheck">Waking v708 FB...</div>
</div>
<div id="signupBox" style="display:none">
<div class="role"><div id="rReader" class="on" onclick="setRole('reader')">📚 Reader</div><div id="rCreator" onclick="setRole('creator')">🎨 Creator</div></div>
<input id="sName" placeholder="Full Name*"><input id="sEmail" placeholder="Email*"><input id="sPass" type="password" placeholder="Password* min 6"><input id="sPass2" type="password" placeholder="Confirm*">
<div id="creatorExtra" style="display:none;border:1px dashed #ff00ff40;border-radius:14px;padding:12px;margin-top:8px;background:#ff00ff08">
<input id="sCode" placeholder="Creator Code* CREATOR2026"><input id="sPortfolio" placeholder="Portfolio / Insta*"><textarea id="sBio" placeholder="Why creator? min 20 chars*" rows="3"></textarea>
</div>
<label style="display:flex;gap:8px;margin-top:10px;align-items:center"><input type="checkbox" id="agree" style="width:16px"><span style="font-size:11px;color:#888">I agree to Terms*</span></label>
<button class="btn primary" onclick="doSignup()">Create Account ✨ v708</button>
<p id="sMsg" class="msg"></p>
</div>
<div id="forgotBox" style="display:none">
<input id="fEmail" placeholder="Email*">
<input id="fOldPass" type="password" placeholder="Old Password* OR CREATOR2026">
<input id="fNewPass" type="password" placeholder="New Password* min 6">
<input id="fNewPass2" type="password" placeholder="Confirm*">
<button class="btn primary" onclick="doChangePass()">Change Password 🔑 v708 FB</button>
<p id="fMsg" class="msg"></p>
<p style="font-size:10px;color:#555;text-align:center;margin-top:6px">User: old password<br>Admin: CREATOR2026 reset</p>
</div>
</div>
</div>
<div class="nav"><a href="index.html?v=708">🏠<br>Home</a><a href="dashboard.html?v=708">📝<br>Studio</a><a href="login.html?v=708" class="active">🔐<br>Login</a><a href="admin.html?v=708">👑<br>Admin</a></div>
<script>
const API_BASE="https://gen-z-visual-2.onrender.com";const API=API_BASE+"/api";
let curRole="reader";
function showLogin(){loginBox.style.display="block";signupBox.style.display="none";forgotBox.style.display="none";tLogin.className="on";tSignup.className="";tForgot.className="";}
function showSignup(){loginBox.style.display="none";signupBox.style.display="block";forgotBox.style.display="none";tSignup.className="on";tLogin.className="";tForgot.className="";}
function showForgot(){loginBox.style.display="none";signupBox.style.display="none";forgotBox.style.display="block";tForgot.className="on";tLogin.className="";tSignup.className="";}
function setRole(r){curRole=r;rReader.className=r==='reader'?'on':'';rCreator.className=r==='creator'?'on':'';creatorExtra.style.display=r==='creator'?'block':'none';}
async function wake(){ try{ healthCheck.innerText="● Waking v708 15s ⏳"; await fetch(API_BASE+"/",{cache:"no-store"}); let r=await fetch(API+"/novels",{cache:"no-store"}); if(r.ok) healthCheck.innerText="● LIVE v708 FB ✅ "+new Date().toLocaleTimeString(); else throw new Error(); }catch{ healthCheck.innerHTML='⏳ Waking... <button onclick="wake()" style="background:#fff;color:#000;border:none;padding:4px 10px;border-radius:20px;font-weight:800;margin-left:6px">Retry</button>'; } } wake();
async function smartFetch(path,body){ let urls=[`${API_BASE}/api/auth${path}`,`${API}/auth${path}`,`${API}${path}`]; for(let url of urls){ try{ let res=await fetch(url,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(body)}); let text=await res.text(); let data={}; try{data=JSON.parse(text)}catch{data={raw:text}} if(res.status!==404) return {res,data,url}; }catch(e){continue;} } throw new Error("Backend waking - retry"); }
async function doLogin(){ let email=lEmail.value.trim(), password=lPass.value; if(!email||!password){lMsg.innerText="❌ Fill all";return;} lMsg.innerText="Logging v708..."; loginBtn.disabled=true; try{ await fetch(API_BASE+"/",{cache:"no-store"}); let {res,data}=await smartFetch("/login",{email,password}); if(res.ok&&(data.token||data.accessToken)){ let token=data.token||data.accessToken; localStorage.setItem("token",token); localStorage.setItem("genz_token",token); localStorage.setItem("user",JSON.stringify(data.user||{email})); localStorage.setItem("genz_user",JSON.stringify(data.user||{email})); localStorage.setItem("email",data.user?.email||email); localStorage.setItem("isAdmin","true"); lMsg.innerText="✅ OK "+(data.user?.email||email)+" → v708"; setTimeout(()=>location.href="dashboard.html?v=708",700); } else lMsg.innerText="❌ "+(data.error||data.message||JSON.stringify(data).slice(0,200)); }catch(e){lMsg.innerText="❌ "+e.message;} loginBtn.disabled=false; }
async function doSignup(){ if(!agree.checked){sMsg.innerText="❌ Agree terms";return;} if(sPass.value!==sPass2.value){sMsg.innerText="❌ Pass mismatch";return;} if(sPass.value.length<6){sMsg.innerText="❌ Min 6";return;} let payload={name:sName.value.trim(),email:sEmail.value.trim(),password:sPass.value,role:curRole}; if(!payload.name||!payload.email){sMsg.innerText="❌ Fill name+email";return;} if(curRole==="creator"){ if(sCode.value!=="CREATOR2026"){sMsg.innerText="❌ Code CREATOR2026";return;} if((sBio.value||'').length<20){sMsg.innerText="❌ Bio min 20";return;} payload.code=sCode.value; payload.portfolio=sPortfolio.value; payload.bio=sBio.value; } sMsg.innerText="Creating v708..."; try{ await fetch(API_BASE+"/",{cache:"no-store"}); let {res,data}=await smartFetch(curRole==="creator"?"/register-creator":"/register",payload); if(res.ok){sMsg.innerText="✅ Created v708! Login now"; showLogin(); lEmail.value=payload.email;} else sMsg.innerText="❌ "+(data.error||JSON.stringify(data).slice(0,200)); }catch(e){sMsg.innerText="❌ "+e.message;} }
async function doChangePass(){ let email=fEmail.value.trim(); let oldPass=fOldPass.value; let newPass=fNewPass.value; let newPass2=fNewPass2.value; if(!email||!oldPass||!newPass){fMsg.innerText="❌ Fill all";return;} if(newPass!==newPass2){fMsg.innerText="❌ Mismatch";return;} if(newPass.length<6){fMsg.innerText="❌ Min 6";return;} fMsg.innerText="Changing v708..."; try{ let {res,data}=await smartFetch("/change-password",{email, oldPassword: oldPass, newPassword: newPass}); if(res.ok){fMsg.innerText="✅ Changed v708! Login"; setTimeout(()=>showLogin(),1000);} else fMsg.innerText="❌ "+(data.error||JSON.stringify(data).slice(0,200)); }catch(e){fMsg.innerText="❌ "+e.message;} }
</script>
</body></html>
