<style>
*{box-sizing:border-box}body{margin:0;background:#07070a;color:#fff;font-family:system-ui}

.nav a{color:#666;text-decoration:none;font-size:11px;text-align:center}.nav a.active{color:#ff00ff}
</style>
</head><body>
<header><div class="logo">Gen-Z <span>Visual</span> <span style="font-size:10px;background:#00ff88;color:#000;padding:3px 8px;border-radius:99px">v704.5 FIXED</span></div><a href="index.html?v=704.5" class="top-btn">Home</a></header>
<div class="box">
<div class="card">
<div style="text-align:center;margin-bottom:14px"><div style="width:56px;height:56px;background:linear-gradient(135deg,#ff00ff,#7a00ff);border-radius:16px;display:flex;align-items:center;justify-content:center;font-size:28px;margin:0 auto">🔐</div><h2 style="margin:10px 0 4px;font-weight:900">Welcome Back</h2><p style="font-size:11px;color:#666;margin:0">v704.5 PUBLIC | gen-z-visual-2 LIVE FIXED</p></div>
<div class="tabs"><div id="tLogin" class="on" onclick="showLogin()">Login</div><div id="tSignup" onclick="showSignup()">Sign Up</div></div>
<div id="loginBox">
<input id="lEmail" placeholder="Email" value="xhettriakash1@gmail.com">
<input id="lPass" type="password" placeholder="Password" value="Akash123">
<button class="btn primary" onclick="doLogin()">Login →</button>
<p id="lMsg" class="msg"></p>
<div style="text-align:center;font-size:11px;color:#00ff88" id="healthCheck">Checking backend...</div>
</div>
<div id="signupBox" style="display:none">
<div class="role"><div id="rReader" class="on" onclick="setRole('reader')">📚 Reader</div><div id="rCreator" onclick="setRole('creator')">🎨 Creator</div></div>
<input id="sName" placeholder="Full Name*"><input id="sEmail" placeholder="Email*"><input id="sPass" type="password" placeholder="Password* min 6"><input id="sPass2" type="password" placeholder="Confirm*">
<div id="creatorExtra" style="display:none;border:1px dashed #ff00ff40;border-radius:14px;padding:12px;margin-top:8px;background:#ff00ff08">
<input id="sCode" placeholder="Creator Code* CREATOR2026"><input id="sPortfolio" placeholder="Portfolio / Insta*"><textarea id="sBio" placeholder="Why creator? min 20 chars*" rows="3"></textarea>
</div>
<label style="display:flex;gap:8px;margin-top:10px;align-items:center"><input type="checkbox" id="agree" style="width:16px"><span style="font-size:11px;color:#888">I agree to Terms*</span></label>
<button class="btn primary" onclick="doSignup()">Create Account ✨</button>
<p id="sMsg" class="msg"></p>
</div>
</div>
</div>
<div class="nav"><a href="index.html?v=704.5">🏠<br>Home</a><a href="dashboard.html?v=704.5">📝<br>Studio</a><a href="login.html?v=704.5" class="active">🔐<br>Login</a><a href="admin.html?v=704.5">👑<br>Admin</a></div>
<script>
const API_BASE="https://gen-z-visual-2.onrender.com";
let curRole="reader";
function showLogin(){document.getElementById('loginBox').style.display="block";document.getElementById('signupBox').style.display="none";document.getElementById('tLogin').className="on";document.getElementById('tSignup').className="";}
function showSignup(){document.getElementById('loginBox').style.display="none";document.getElementById('signupBox').style.display="block";document.getElementById('tSignup').className="on";document.getElementById('tLogin').className="";}
function setRole(r){curRole=r; document.getElementById('rReader').className=r==='reader'?'on':''; document.getElementById('rCreator').className=r==='creator'?'on':''; document.getElementById('creatorExtra').style.display=r==='creator'?'block':'none';}
fetch(API_BASE+"/api/novels").then(()=>document.getElementById('healthCheck').innerText="● Backend LIVE ✅").catch(()=>document.getElementById('healthCheck').innerText="⏳ Waking 30s...");
async function smartFetch(path,body){
 for(let url of [`${API_BASE}/api/auth${path}`,`${API_BASE}/api${path}`]){
  try{ let res=await fetch(url,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(body)}); let data=await res.json(); if(res.status!==404) return {res,data}; }catch(e){continue;}
 } throw new Error("Backend waking 30s");
}
async function doLogin(){
 let email=document.getElementById('lEmail').value.trim(), password=document.getElementById('lPass').value;
 if(!email||!password){document.getElementById('lMsg').innerText="❌ Fill all";return;}
 document.getElementById('lMsg').innerText="Logging...";
 try{
  let {res,data}=await smartFetch("/login",{email,password});
  if(res.ok&&data.token){
   localStorage.setItem("token",data.token); localStorage.setItem("genz_token",data.token);
   localStorage.setItem("user",JSON.stringify(data.user)); localStorage.setItem("genz_user",JSON.stringify(data.user));
   localStorage.setItem("email",data.user.email); localStorage.setItem("isAdmin","true");
   document.getElementById('lMsg').innerText="✅ OK "+data.user.email;
   setTimeout(()=>location.href="dashboard.html?v=704.5",700);
  } else document.getElementById('lMsg').innerText="❌ "+(data.error||JSON.stringify(data));
 }catch(e){document.getElementById('lMsg').innerText="❌ "+e.message;}
}
async function doSignup(){
 if(!document.getElementById('agree').checked){document.getElementById('sMsg').innerText="❌ Agree terms";return;}
 if(document.getElementById('sPass').value!==document.getElementById('sPass2').value){document.getElementById('sMsg').innerText="❌ Pass mismatch";return;}
 if(document.getElementById('sPass').value.length<6){document.getElementById('sMsg').innerText="❌ Min 6";return;}
 let payload={name:document.getElementById('sName').value,email:document.getElementById('sEmail').value,password:document.getElementById('sPass').value,role:curRole};
 if(curRole==="creator"){if(document.getElementById('sCode').value!=="CREATOR2026"){document.getElementById('sMsg').innerText="❌ Wrong code";return;} payload.code=document.getElementById('sCode').value; payload.portfolio=document.getElementById('sPortfolio').value; payload.bio=document.getElementById('sBio').value;}
 document.getElementById('sMsg').innerText="Creating...";
 try{ let {res,data}=await smartFetch(curRole==="creator"?"/register-creator":"/register",payload); if(res.ok){document.getElementById('sMsg').innerText="✅ Created! Login now"; showLogin(); document.getElementById('lEmail').value=document.getElementById('sEmail').value;} else document.getElementById('sMsg').innerText="❌ "+(data.error||JSON.stringify(data)); }catch(e){document.getElementById('sMsg').innerText="❌ "+e.message;}
}
</script>
</body></html>
