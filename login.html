<!DOCTYPE html><html><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Login - Gen-Z v704.5 FINAL</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#07070a;color:#fff;font-family:system-ui}
header{position:sticky;top:0;z-index:9;display:flex;justify-content:space-between;align-items:center;padding:12px 16px;background:#111;border-bottom:1px solid #222}
.logo{font-weight:900} .logo span{color:#ff00ff}
.box{max-width:460px;margin:20px auto;padding:0 16px 110px}

.role div.on{background:linear-gradient(135deg,#ff00ff,#7a00ff);color:#fff}
input,textarea{width:100%;padding:12px 14px;margin:6px 0;background:#0e0e12;border:1px solid #2a2a32;border-radius:12px;color:#fff;outline:none}
.btn{width:100%;padding:13px;background:#fff;color:#000;border:none;border-radius:99px;font-weight:900;cursor:pointer;margin-top:10px}
.btn.primary{background:linear-gradient(135deg,#ff00ff,#7a00ff);color:#fff}
.msg{font-size:11px;margin-top:8px;text-align:center;min-height:14px;color:#ff8800}
.nav{position:fixed;bottom:0;left:0;right:0;background:#111;border-top:1px solid #222;display:flex;justify-content:space-around;padding:8px 0}
.nav a{color:#666;text-decoration:none;font-size:11px;text-align:center}.nav a.active{color:#ff00ff}

</head><body>
<header><div class="logo">Gen-Z <span>Visual</span> <span style="font-size:10px;background:#00ff88;color:#000;padding:3px 8px;border-radius:99px">v704.5</span></div><a href="index.html?v=704.5" style="color:#888;text-decoration:none;font-size:12px">Home</a></header>
<div class="box">
<div class="card">
<div style="text-align:center;margin-bottom:14px"><div style="width:56px;height:56px;background:linear-gradient(135deg,#ff00ff,#7a00ff);border-radius:16px;display:flex;align-items:center;justify-content:center;font-size:28px;margin:0 auto">🔐</div><h2 style="margin-top:10px;font-weight:900">Welcome</h2><p style="font-size:11px;color:#666">v704.5 LIVE FIXED — gen-z-visual-2</p></div>
<div class="tabs"><div id="tLogin" class="on" onclick="showL()">Login</div><div id="tSignup" onclick="showS()">Sign Up</div></div>
<div id="loginBox">
<input id="lEmail" placeholder="Email" value="xhettriakash1@gmail.com">
<input id="lPass" type="password" placeholder="Password" value="Akash123">
<button class="btn primary" onclick="doLogin()">Login →</button>
<p id="lMsg" class="msg"></p>
<div style="text-align:center;font-size:11px;color:#00ff88" id="health">Checking backend...</div>
</div>
<div id="signupBox" style="display:none">
<div class="role"><div id="rReader" class="on" onclick="setRole('reader')">📚 Reader</div><div id="rCreator" onclick="setRole('creator')">🎨 Creator</div></div>
<input id="sName" placeholder="Full Name*">
<input id="sEmail" placeholder="Email*">
<input id="sPass" type="password" placeholder="Password* min 6">
<input id="sPass2" type="password" placeholder="Confirm*">
<div id="creatorExtra" style="display:none;border:1px dashed #ff00ff40;border-radius:14px;padding:12px;margin-top:8px;background:#ff00ff08">
<input id="sCode" placeholder="Creator Code* CREATOR2026">
<input id="sPortfolio" placeholder="Portfolio / Insta*">
<textarea id="sBio" placeholder="Why creator? min 20 chars*" rows="3"></textarea>
</div>
<label style="display:flex;gap:8px;margin-top:10px;align-items:center"><input type="checkbox" id="agree" style="width:16px"><span style="font-size:11px;color:#888">I agree to Terms*</span></label>
<button class="btn primary" onclick="doSignup()">Create Account ✨</button>
<p id="sMsg" class="msg"></p>
</div>
</div>
</div>
<div class="nav"><a href="index.html?v=704.5">🏠<br>Home</a><a href="dashboard.html?v=704.5">📝<br>Studio</a><a href="login.html?v=704.5" class="active">🔐<br>Login</a><a href="admin.html?v=704.5">👑<br>Admin</a></div>
<script>
const API="https://gen-z-visual-2.onrender.com";
let curRole="reader";
function showL(){ loginBox.style.display="block"; signupBox.style.display="none"; tLogin.className="on"; tSignup.className=""; }
function showS(){ loginBox.style.display="none"; signupBox.style.display="block"; tSignup.className="on"; tLogin.className=""; }
function setRole(r){ curRole=r; rReader.className=r=='reader'?'on':''; rCreator.className=r=='creator'?'on':''; creatorExtra.style.display=r=='creator'?'block':'none'; }
// Health
fetch(API+"/api/novels").then(()=>health.innerText="● Backend LIVE ✅").catch(()=>health.innerText="⏳ Backend waking 30s...");
async function smartFetch(path,body){
 let urls=[`${API}/api/auth${path}`,`${API}/api${path}`];
 for(let url of urls){
  try{ let res=await fetch(url,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(body)}); let data=await res.json().catch(()=>({})); if(res.status!==404) return {res,data}; }catch(e){ continue; }
 }
 throw new Error("Backend sleep");
}
async function doLogin(){
 let email=lEmail.value.trim(), password=lPass.value;
 if(!email||!password){ lMsg.innerText="❌ Fill all"; return; }
 lMsg.innerText="Logging...";
 try{
  let {res,data}=await smartFetch("/login",{email,password});
  if(res.ok && data.token){
   localStorage.setItem("token",data.token); localStorage.setItem("genz_token",data.token);
   localStorage.setItem("user",JSON.stringify(data.user)); localStorage.setItem("genz_user",JSON.stringify(data.user));
   localStorage.setItem("email",data.user.email); localStorage.setItem("isAdmin","true");
   lMsg.innerText="✅ Login OK: "+data.user.email;
   setTimeout(()=>location.href="dashboard.html?v=704.5",600);
  } else lMsg.innerText="❌ "+(data.error||data.message||JSON.stringify(data));
 }catch(e){ lMsg.innerText="❌ "+e.message+" - wait 30s retry"; }
}
async function doSignup(){
 if(!agree.checked){ sMsg.innerText="❌ Agree terms"; return; }
 if(sPass.value!==sPass2.value){ sMsg.innerText="❌ Pass mismatch"; return; }
 if(sPass.value.length<6){ sMsg.innerText="❌ Min 6 chars"; return; }
 let payload={name:sName.value,email:sEmail.value,password:sPass.value,role:curRole};
 if(curRole==="creator"){ if(sCode.value!=="CREATOR2026"){ sMsg.innerText="❌ Wrong creator code"; return; } payload.code=sCode.value; payload.portfolio=sPortfolio.value; payload.bio=sBio.value; }
 sMsg.innerText="Creating...";
 try{
  let {res,data}=await smartFetch(curRole==="creator"?"/register-creator":"/register",payload);
  if(res.ok){ sMsg.innerText="✅ Created! Now login"; showL(); lEmail.value=sEmail.value; }
  else sMsg.innerText="❌ "+(data.error||JSON.stringify(data));
 }catch(e){ sMsg.innerText="❌ "+e.message; }
}
</script>
</body></html>
