<!DOCTYPE html><html><head><meta name="viewport" content="width=device-width, initial-scale=1"><title>Login</title><style>body{background:#0a0a0a;color:white;font-family:sans-serif;padding:20px}.card{background:#1a1a1a;padding:20px;border-radius:12px}input{width:90%;padding:12px;margin:10px 0;border-radius:8px;border:none}.btn{background:#ff00ff;color:white;padding:12px;border:none;border-radius:20px;width:100%}</style></head><body><div class="card"><h2>Login / Signup</h2><input id="email" placeholder="Email"><input id="pass" type="password" placeholder="Password"><button class="btn" onclick="login()">Login</button><p id="msg"></p></div><script>function login(){localStorage.setItem('user',document.getElementById('email').value); document.getElementById('msg').innerHTML='Logged in! Go back to Home';}</script></body></html>
