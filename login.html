<!DOCTYPE html>
<html><head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Login - Gen-Z Visual</title>
<link rel="stylesheet" href="style.css">
<style>
.login-box{max-width:400px;margin:24px auto;padding:24px;background:#141417;border:1px solid #232326;border-radius:24px}
.tabs{display:flex;gap:8px;background:#0e0e10;padding:4px;border-radius:99px;margin-bottom:16px}
.tabs button{flex:1;padding:10px;border:none;border-radius:99px;font-weight:800;background:transparent;color:#888;cursor:pointer}
.tabs button.active{background:white;color:black}
.role{display:flex;gap:8px;margin:10px 0}
.role button{flex:1;padding:10px;border:1px solid #2a2a2e;border-radius:99px;background:#0e0e10;color:#888;font-weight:700;cursor:pointer}
.role button.active{background:white;color:black;border-color:white}
.login-box input{width:100%;padding:13px;margin:7px 0;background:#0e0e10;border:1px solid #2a2a2e;border-radius:12px;color:white;outline:none}
.main-btn{width:100%;padding:14px;background:white;color:black;border:none;border-radius:99px;font-weight:900;cursor:pointer;margin-top:10px}
.link{font-size:12px;color:#888;text-align:center;margin-top:12px;cursor:pointer}
.link span{color:white;text-decoration:underline}
</style></head><body>
<header><div class="logo">Gen-Z <span>Visual</span></div><a href="index.html" class="top-btn" style="background:white;color:black">Home</a></header>

<div class="login-box">
<div class="tabs">
<button id="tabLogin" class="active" onclick="showTab('login')">Login</button>
<button id="tabSignup" onclick="showTab('signup')">Create Account</button>
</div>

<!-- LOGIN BOX -->
<div id="loginForm">
<h2 style="font-size:24px;font-weight:900">Welcome back</h2>
<p style="font-size:12px;color:#888;margin:6px 0 12px">Login to continue</p>
<input id="lEmail" placeholder="Email">
<input id="lPass" type="password" placeholder="Password">
<button class="main-btn" onclick="doLogin()">Login</button>
<p id="lMsg" style="font-size:12px;color:#ff6b6b;margin-top:8px"></p>
</div>

<!-- SIGNUP BOX -->
<div id="signupForm" style="display:none">
<h2 style="font-size:24px;font-weight:900">Create account</h2>
<p style="font-size:12px;color:#888;margin:6px 0 12px">Choose role and sign up</p>

<div class="role">
<button id="rReader" class="active" onclick="setRole('reader')">📚 Reader</button>
<button id="rCreator" onclick="setRole('creator')">🎨 Creator</button>
</div>

<input id="sName" placeholder="Full Name">
<input id="sEmail" placeholder="Email">
<input id="sPass" type="password" placeholder="Password (min 4 chars)">
<button class="main-btn" onclick="doSignup()">Create <span id="roleText">Reader</span> Account</button>
<p id="sMsg" style="font-size:12px;margin-top:8px"></p>
</div>

<div class="link" onclick="toggleTab()"><span id="toggleText">Don't have account? Create one</span></div>
</div>

<script>
let currentRole='reader';
let currentTab='login';

function showTab(t){
 currentTab=t;
 document.getElementById("loginForm").style.display=t=='login'?'block':'none';
 document.getElementById("signupForm").style.display=t=='signup'?'block':'none';
 document.getElementById("tabLogin").className=t=='login'?'active':'';
 document.getElementById("tabSignup").className=t=='signup'?'active':'';
 document.getElementById("toggleText").innerText=t=='login'?"Don't have account? Create one":"Already have account? Login";
}
function toggleTab(){ showTab(currentTab=='login'?'signup':'login'); }
function setRole(r){
 currentRole=r;
 document.getElementById("rReader").className=r=='reader'?'active':'';
 document.getElementById("rCreator").className=r=='creator'?'active':'';
 document.getElementById("roleText").innerText=r=='creator'?'Creator':'Reader';
}

// INIT DEFAULT USERS IF NOT EXIST
if(!localStorage.getItem("allUsers")){
 let defaultUsers=[
   {name:"Demo Reader", email:"reader@gmail.com", pass:"1234", role:"reader"},
   {name:"Demo Creator", email:"creator@gmail.com", pass:"1234", role:"creator"}
 ];
 localStorage.setItem("allUsers", JSON.stringify(defaultUsers));
}

function doSignup(){
 let name=document.getElementById("sName").value.trim();
 let email=document.getElementById("sEmail").value.trim().toLowerCase();
 let pass=document.getElementById("sPass").value.trim();
 let msg=document.getElementById("sMsg");
 if(!name||!email||!pass){ msg.style.color="#ff6b6b"; msg.innerText="Fill all fields"; return; }
 if(pass.length<4){ msg.style.color="#ff6b6b"; msg.innerText="Password min 4 chars"; return; }
 
 let users=JSON.parse(localStorage.getItem("allUsers")||"[]");
 if(users.find(u=>u.email==email)){ msg.style.color="#ff6b6b"; msg.innerText="Email already exists! Login now."; return; }

 users.push({name, email, pass, role:currentRole});
 localStorage.setItem("allUsers", JSON.stringify(users));
 msg.style.color="#22c55e";
 msg.innerText="Account created! Now login...";
 setTimeout(()=>showTab('login'),1000);
}
