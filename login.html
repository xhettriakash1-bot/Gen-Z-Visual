<!DOCTYPE html>
<html><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Login ULTRA - Gen-Z Visual v700</title>
<link rel="stylesheet" href="style.css?v=700">
<style>
.box-ultra{max-width:460px;margin:20px auto;padding:0 20px 110px}
.card-ultra{background:rgba(20,20,23,0.9);backdrop-filter:blur(30px) saturate(180%);border:1px solid rgba(255,255,255,0.08);border-top:1px solid rgba(255,255,255,0.14);border-radius:32px;padding:28px;box-shadow:0 30px 70px rgba(0,0,0,0.6),inset 0 1px 1px rgba(255,255,255,0.08);position:relative;overflow:hidden}
.card-ultra::before{content:"";position:absolute;top:-60%;left:-50%;width:200%;height:200%;background:radial-gradient(circle,rgba(255,0,255,0.07) 1px,transparent 1px);background-size:30px 30px;animation:stars 20s linear infinite;pointer-events:none}
.tabs{display:flex;background:rgba(10,10,12,0.8);backdrop-filter:blur(10px);padding:5px;border-radius:99px;margin-bottom:20px;border:1px solid rgba(255,255,255,0.06);position:relative;z-index:1}
.tabs div{flex:1;text-align:center;padding:12px;border-radius:99px;font-weight:800;cursor:pointer;color:#666;transition:0.4s;font-size:14px}
.tabs div.on{background:white;color:black;box-shadow:0 8px 20px rgba(255,255,255,0.3);transform:scale(1.02)}
.role{display:flex;gap:8px;margin:14px 0;position:relative;z-index:1}
.role div{flex:1;text-align:center;padding:13px;border-radius:99px;background:rgba(255,255,255,0.04);color:#888;font-weight:800;cursor:pointer;border:1px solid rgba(255,255,255,0.08);transition:0.3s;backdrop-filter:blur(10px);font-size:13px}
.role div.on{background:linear-gradient(135deg,#ff00ff,#7a00ff);color:white;border-color:transparent;box-shadow:0 8px 20px #ff00ff40;transform:translateY(-1px)}
.card-ultra input,.card-ultra textarea{width:100%;padding:14px 18px;margin:8px 0;background:rgba(10,10,12,0.9);border:1px solid rgba(255,255,255,0.08);border-radius:14px;color:white;outline:none;transition:0.4s;position:relative;z-index:1}
.card-ultra input:focus,.card-ultra textarea:focus{border-color:var(--neon);box-shadow:0 0 0 4px #ff00ff15,0 0 25px #ff00ff15;transform:translateY(-1px)}
.btn-ultra{width:100%;padding:15px;background:white;color:black;border:none;border-radius:99px;font-weight:900;cursor:pointer;margin-top:14px;font-size:15px;transition:all 0.3s cubic-bezier(0.175,0.885,0.32,1.275);position:relative;z-index:1;box-shadow:0 8px 20px rgba(255,255,255,0.2)}
.btn-ultra:hover{transform:translateY(-3px) scale(1.02);box-shadow:0 15px 30px rgba(255,255,255,0.3)}
.btn-ultra.primary{background:linear-gradient(135deg,#ff00ff,#7a00ff);color:white;box-shadow:0 10px 25px #ff00ff45}
.btn-ultra.primary:hover{box-shadow:0 18px 35px #ff00ff60}
.msg{font-size:12px;margin-top:12px;min-height:16px;text-align:center;font-weight:800;position:relative;z-index:1}
.creator-extra{border:1px dashed #ff00ff40;border-radius:20px;padding:16px;margin-top:12px;background:linear-gradient(135deg,rgba(168,85,247,0.08),rgba(255,0,255,0.05));backdrop-filter:blur(10px);position:relative;z-index:1}
.health-badge{display:inline-flex;align-items:center;gap:6px;padding:8px 14px;border-radius:99px;background:rgba(0,255,136,0.08);border:1px solid rgba(0,255,136,0.2);color:#00ff88;font-size:11px;font-weight:800;margin-top:14px;backdrop-filter:blur(10px);position:relative;z-index:1}
.health-badge::before{content:"";width:6px;height:6px;background:#00ff88;border-radius:50%;box-shadow:0 0 10px #00ff88;animation:livePulse 1.5s infinite}
@keyframes livePulse{0%,100%{transform:scale(1)}50%{transform:scale(1.5)}}
</style>
</head>
<body>
<header><div class="logo">Gen-Z <span>Visual</span> <span style="font-size:10px;background:linear-gradient(90deg,#ff00ff,#7a00ff);padding:3px 8px;border-radius:99px;color:white;margin-left:6px">ULTRA v700</span></div><a href="index.html" class="top-btn">Home</a></header>

<div class="box-ultra">
<div class="card-ultra">
<div style="text-align:center;margin-bottom:18px;position:relative;z-index:1"><div style="width:64px;height:64px;background:linear-gradient(135deg,#ff00ff,#7a00ff);border-radius:20px;display:flex;align-items:center;justify-content:center;font-size:32px;margin:0 auto;box-shadow:0 10px 30px #ff00ff50">🔐</div><h2 style="margin-top:12px;font-weight:900;letter-spacing:-0.5px">Welcome Back</h2><p style="font-size:12px;color:#666;margin-top:4px">Firewall v700 ACTIVE 🔒 | gen-z-visual-2 LIVE</p></div>

<div class="tabs"><div id="tLogin" class="on">Login</div><div id="tSignup">Sign Up</div></div>

<div id="loginBox">
<input id="lEmail" placeholder="Email" value="xhettriakash1@gmail.com">
<input id="lPass" type="password" placeholder="Password" value="Akash123">
<button class="btn-ultra primary" id="btnLogin">Login →</button>
<p id="lMsg" class="msg"></p>
<div style="text-align:center"><span class="health-badge" id="healthCheck">Checking backend...</span></div>
<p style="font-size:11px;color:#555;text-align:center;margin-top:14px;position:relative;z-index:1">Protected: xhettriakash1@gmail.com<br>akashchettri2003@gmail.com 👑</p>
</div>

<div id="signupBox" style="display:none">
<div class="role"><div id="rReader" class="on">📚 Reader</div><div id="rCreator">🎨 Creator</div></div>
<input id="sName" placeholder="Full Name*">
<input id="sEmail" placeholder="Email*">
<input id="sPass" type="password" placeholder="Password* min 6">
<input id="sPass2" type="password" placeholder="Confirm Password*">
<div id="creatorExtra" class="creator-extra" style="display:none">
<h4 style="margin:0 0 10px;color:#ff88ff;font-size:14px">🎨 Creator Verification</h4>
<input id="sCode" placeholder="Creator Code* CREATOR2026">
<input id="sPortfolio" placeholder="Portfolio / Insta* (link)">
<textarea id="sBio" placeholder="Why you want to be creator? min 20 chars*" rows="3"></textarea>
</div>
<label style="display:flex;gap:8px;margin-top:14px;align-items:center;position:relative;z-index:1"><input type="checkbox" id="agree" style="width:18px;height:18px;margin:0;accent-color:#ff00ff"><span style="font-size:11px;color:#888">I agree to Terms & Firewall v700*</span></label>
<button class="btn-ultra primary" id="btnSignup">Create Account ✨</button>
<p id="sMsg" class="msg"></p>
</div>
</div>
</div>

<div class="nav"><a href="index.html">🏠<span>Home</span></a><a href="dashboard.html">📚<span>Studio</span></a><a href="login.html" class="active">🔐<span>Login</span></a><a href="admin.html">👑<span>Admin</span></a></div>

<script>
const API_BASE="https://gen-z-visual-2.onrender.com";
let curRole="reader";
let rR=document.getElementById("rReader"), rC=document.getElementById("rCreator"), cExtra=document.getElementById("creatorExtra");
rR.onclick=()=>{curRole="reader";rR.className="on";rC.className="";cExtra.style.display="none";};
rC.onclick=()=>{curRole="creator";rC.className="on";rR.className="";cExtra.style.display="block";};
tLogin.onclick=()=>{loginBox.style.display="block";signupBox.style.display="none";tLogin.className="on";tSignup.className="";};
tSignup.onclick=()=>{loginBox.style.display="none";signupBox.style.display="block";tSignup.className="on";tLogin.className="";};

async function smartFetch(path, body){
  const urls=[`${API_BASE}/api/auth${path}`,`${API_BASE}/api${path}`];
  for(let url of urls){
    try{
      const res=await fetch(url,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(body)});
      const data=await res.json();
      if(res.status!==404) return {res,data,url};
    }catch(e){continue;}
  }
  throw new Error("Backend not reachable");
}

btnLogin.onclick=async()=>{
  const email=lEmail.value.trim(),password=lPass.value,lMsg=document.getElementById("lMsg");
  if(!email||!password){lMsg.style.color="#ff4444";lMsg.innerText="❌ Fill all fields";return;}
  lMsg.style.color="#a855f7";lMsg.innerText="⏳ Logging to LIVE v700...";
  try{
    const {res,data}=await smartFetch("/login",{email,password});
    if(res.ok){
      localStorage.setItem("token",data.token);localStorage.setItem("genz_token",data.token);
      localStorage.setItem("user",JSON.stringify(data.user));localStorage.setItem("genz_user",JSON.stringify(data.user));
      localStorage.setItem("email",data.user.email);localStorage.setItem("role",data.user.role);
      lMsg.style.color="#00ff88";lMsg.innerText=`✅ Success! Role: ${data.user?.role||'admin'} → Redirecting...`;
      setTimeout(()=>{if(data.user?.role==="admin")location.href="admin.html";else location.href="dashboard.html";},900);
    }else{lMsg.style.color="#ff4444";lMsg.innerText="❌ "+(data.message||data.error||"Login failed");}
  }catch(e){lMsg.style.color="#ff4444";lMsg.innerText="❌ Backend error - "+e.message+" (Render waking 30s)";}
};

btnSignup.onclick=async()=>{
  const name=sName.value.trim(),email=sEmail.value.trim(),pass=sPass.value,pass2=sPass2.value,agree=agreeEl=>document.getElementById("agree").checked,msg=sMsg;
  if(!name||!email||!pass||!pass2){msg.style.color="#ff4444";msg.innerText="❌ Fill all * fields";return;}
  if(pass!==pass2){msg.style.color="#ff4444";msg.innerText="❌ Passwords not match";return;}
  if(!document.getElementById("agree").checked){msg.style.color="#ff4444";msg.innerText="❌ Agree terms";return;}
  let body={name,email,password:pass,role:curRole};
  if(curRole==="creator"){body.creatorCode=sCode.value.trim();body.portfolio=sPortfolio.value.trim();body.bio=sBio.value.trim();if(!body.creatorCode||!body.bio||body.bio.length<20){msg.style.color="#ff4444";msg.innerText="❌ Creator: code + bio 20 chars*";return;}}
  msg.style.color="#a855f7";msg.innerText="⏳ Creating account on LIVE v700...";
  try{
    const {res,data}=await smartFetch("/register",body);
    if(res.ok){msg.style.color="#00ff88";msg.innerText="✅ Account created! Now Login ✨";setTimeout(()=>{tLogin.click();lEmail.value=email;},800);}
    else{msg.style.color="#ff4444";msg.innerText="❌ "+(data.message||data.error||"Failed");}
  }catch(e){msg.style.color="#ff4444";msg.innerText="❌ Backend error - "+e.message;}
};

fetch(`${API_BASE}/api/health`).then(r=>r.json()).then(d=>{
  healthCheck.innerHTML=`✅ Mongo: ${d.mongo||'connected'} | v700 LIVE | ${d.admins?.length||2} admins`;
  healthCheck.style.color="#00ff88";healthCheck.style.borderColor="#00ff8840";
}).catch(()=>fetch(`${API_BASE}/`).then(r=>r.text()).then(t=>{
  healthCheck.innerText=`✅ Backend LIVE - v700`;
}).catch(e=>{
  healthCheck.innerText=`❌ Backend waking... wait 30s then retry`;healthCheck.style.color="#f59e0b";healthCheck.style.borderColor="#f59e0b40";
}));
</script></body></html>
