<!DOCTYPE html>
<html><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Novels v705 PRO - Gen-Z Visual</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#07070a;color:#fff;font-family:system-ui}
header{position:sticky;top:0;z-index:9;display:flex;justify-content:space-between;align-items:center;padding:12px 16px;background:#111;border-bottom:1px solid #222}
.logo{font-weight:900}.logo span{color:#ff00ff}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px;padding:14px 16px 120px}
.card{background:#15151a;border:1px solid #222;border-radius:18px;overflow:hidden;cursor:pointer;position:relative;transition:.3s}
.card:hover{transform:translateY(-4px);border-color:#ff00ff60}
.card img{width:100%;height:200px;object-fit:cover}
.info{padding:10px 12px}
.badge{position:absolute;top:8px;left:8px;padding:3px 8px;border-radius:20px;font-size:8px;font-weight:900}
.badge-live{background:#00ff88;color:#000}.badge-paid{background:#facc15;color:#000}.badge-xml{background:#333;color:#aaa}
.head{display:flex;justify-content:space-between;align-items:center;padding:16px 16px 0}
.nav{position:fixed;bottom:0;left:0;right:0;background:#111;border-top:1px solid #222;display:flex;justify-content:space-around;padding:8px 0}
.nav a{color:#666;text-decoration:none;font-size:11px;text-align:center}.nav a.active{color:#ff00ff}
</style>
</head><body>
<header><div class="logo">Gen-Z <span>Novels</span> <span style="font-size:9px;background:#00ff88;padding:2px 6px;border-radius:10px;color:#000">v705 PRO DYNAMIC</span></div><a href="dashboard.html?v=705" style="padding:8px 14px;border-radius:20px;background:#fff;color:#000;text-decoration:none;font-size:12px;font-weight:800">✍️ Studio</a></header>

<div class="head">
<h2 style="margin:0;font-size:20px;font-weight:900">Novels <span style="color:#00ff88">LIVE</span></h2>
<span style="font-size:11px;color:#888;background:#1a1a1e;border:1px solid #222;padding:5px 10px;border-radius:20px" id="count">Loading v705...</span>
</div>

<div id="grid" class="grid"></div>

<div class="nav">
<a href="index.html?v=705">🏠<br>Home</a>
<a href="novels.html?v=705" class="active">📚<br>Novels</a>
<a href="comics.html?v=705">🎨<br>Comics</a>
<a href="dashboard.html?v=705">📝<br>Studio</a>
</div>

<script>
const API="https://gen-z-visual-2.onrender.com";
async function getLive(){
 try{ await fetch(API+"/",{cache:"no-store"}); let r=await fetch(API+"/api/novels",{cache:"no-store"}); let d=await r.json(); return Array.isArray(d)?d:[]; }catch{return [];}
}
async function getXML(){
 try{
  let txt=await fetch("data/novels.xml?v=705",{cache:"no-store"}).then(r=>r.text());
  let doc=new DOMParser().parseFromString(txt,"text/xml");
  return [...doc.querySelectorAll("novel")].map(n=>({
   _id:n.querySelector("id")?.textContent, title:n.querySelector("title")?.textContent, author:n.querySelector("author")?.textContent,
   cover:n.querySelector("cover")?.textContent, access:n.querySelector("access")?.textContent||"free", views:0, isXML:true, genre:n.querySelector("genre")?.textContent
  }));
 }catch{return [];}
}
async function load(){
 let grid=document.getElementById("grid"); grid.innerHTML="<p style='color:#666'>Waking LIVE backend... ⏳</p>";
 let live=await getLive(); let list=live.length?live:await getXML();
 document.getElementById("count").innerText=live.length? `✅ ${live.length} LIVE • ${live.reduce((s,x)=>s+(x.views||0),0)} views` : `⚠️ ${list.length} XML fallback - NEVER EMPTY`;
 grid.innerHTML=list.map(n=>`
  <div class="card" onclick="location.href='read-novel.html?${n.isXML?'xml':'id'}=${n._id}&v=705'">
   <span class="badge ${n.isXML?'badge-xml':(n.access==='paid'?'badge-paid':'badge-live')}">${n.isXML?'XML':(n.access==='paid'?'₹'+n.price:'LIVE')}</span>
   <img src="${n.cover||n.coverImage||'https://picsum.photos/400/600'}" loading="lazy">
   <div class="info"><h3 style="font-size:12px;margin:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${n.title}</h3><p style="font-size:10px;color:#888;margin:3px 0 0">${n.author||'Anon'} • 👁️ ${n.views||0} • ${n.access==='paid'?'PAID':'FREE'}</p></div>
  </div>`).join('');
}
load();
</script>
</body></html>
