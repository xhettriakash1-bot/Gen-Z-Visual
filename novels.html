<!DOCTYPE html><html><head><meta name="viewport" content="width=device-width, initial-scale=1"><title>Novels</title><link rel="stylesheet" href="style.css"><style>.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:16px}.card{background:#141417;border:1px solid #232326;border-radius:16px;overflow:hidden}.card img{width:100%;height:200px;object-fit:cover}.card h3{font-size:13px;padding:8px 10px 0}.card p{font-size:10px;color:#888;padding:0 10px 10px}</style></head><body>
<header><div class="logo">Gen-Z <span>Visual</span></div><a href="dashboard.html" class="top-btn" style="background:white;color:black">Studio</a></header>
<div class="section"><h2>Novels</h2><div id="grid" class="grid"></div></div>
<nav class="bottom-nav"><a href="index.html">Home</a><a href="novels.html" style="color:white">Novels</a><a href="comic.html">Comics</a><a href="login.html">Login</a></nav>
<script>
async function load(){
 let grid=document.getElementById("grid");
 grid.innerHTML="Loading...";
 try{
  let res=await fetch('data/novels.xml');
  let text=await res.text();
  let xml=new DOMParser().parseFromString(text,"text/xml");
  let novels=[...xml.querySelectorAll("novel")];
  grid.innerHTML="";
  novels.forEach(n=>{
    let id=n.querySelector("id").textContent;
    let title=n.querySelector("title").textContent;
    let author=n.querySelector("author").textContent;
    let cover=n.querySelector("cover").textContent;
    grid.innerHTML+=`<div class="card" onclick="location.href='read.html?id=${id}'"><img src="${cover}"><h3>${title}</h3><p>${author}</p></div>`;
  });
 }catch(e){ grid.innerHTML="XML not found"; }

 // MY UPLOADED NOVELS
 let myNovels=JSON.parse(localStorage.getItem("myNovels")||"[]");
 myNovels.forEach(n=>{
   grid.innerHTML+=`<div class="card" style="border:1px solid #a855f7" onclick="location.href='read.html?id=my_${n.id}'"><img src="${n.cover}"><h3>${n.title} ✨</h3><p>${n.author} • My Upload</p></div>`;
 });
}
load();
</script>
</body></html>
