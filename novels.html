<!DOCTYPE html>
<html><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Novels - Gen-Z Visual v704.5</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#07070a;color:#fff;font-family:system-ui,sans-serif}
header{position:sticky;top:0;z-index:9;display:flex;justify-content:space-between;align-items:center;padding:12px 16px;background:#111;border-bottom:1px solid #222}
.logo{font-weight:900}.logo span{color:#ff00ff}
.top-btn{padding:8px 14px;border-radius:20px;background:#fff;color:#000;text-decoration:none;font-size:12px;font-weight:800}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px;padding:14px 16px 120px}
.card{background:#15151a;border:1px solid #222;border-radius:18px;overflow:hidden;cursor:pointer;position:relative;transition:.3s}
.card:hover{transform:translateY(-4px);border-color:#ff00ff60}
.card img{width:100%;height:200px;object-fit:cover}
.info{padding:10px 12px}
.info h3{font-size:12px;font-weight:800;margin:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.info p{font-size:10px;color:#888;margin:3px 0 0}
.badge-my{position:absolute;top:8px;right:8px;padding:3px 8px;border-radius:20px;background:linear-gradient(135deg,#ff00ff,#7a00ff);color:#fff;font-size:8px;font-weight:900}
.badge-live{position:absolute;top:8px;left:8px;padding:3px 8px;border-radius:20px;background:#00ff88;color:#000;font-size:8px;font-weight:900}
.head{display:flex;justify-content:space-between;align-items:center;padding:16px 16px 0}
.count{font-size:11px;color:#888;background:#1a1a1e;border:1px solid #222;padding:5px 10px;border-radius:20px}
.nav{position:fixed;bottom:0;left:0;right:0;background:#111;border-top:1px solid #222;display:flex;justify-content:space-around;padding:8px 0}
.nav a{color:#666;text-decoration:none;font-size:11px;text-align:center}
.nav a.active{color:#ff00ff}
</style>
</head><body>
<header><div class="logo">Gen-Z <span>Novels</span> <span style="font-size:9px;background:#00ff88;padding:2px 6px;border-radius:10px;color:#000">v704.5 FIXED</span></div><a href="dashboard.html?v=704.5" class="top-btn">✍️ Studio</a></header>

<div class="head">
<h2 style="margin:0;font-size:20px;font-weight:900">Novels <span style="color:#00ff88">LIVE</span></h2>
<span class="count" id="count">Loading...</span>
</div>

<div id="grid" class="grid"></div>

<div class="nav">
<a href="index.html">🏠<br>Home</a>
<a href="novels.html" class="active">📚<br>Novels</a>
<a href="comic.html">💥<br>Comics</a>
<a href="dashboard.html">📝<br>Studio</a>
</div>

<script>
const API="https://gen-z-visual-2.onrender.com/api";
async function load(){
 let grid=document.getElementById("grid"); let count=document.getElementById("count");
 let total=0; grid.innerHTML="";
 let live=[];
 try{ let r=await fetch(`${API}/novels`); if(r.ok){ live=await r.json(); live=Array.isArray(live)?live:live.novels||[]; } }catch(e){}
 live.forEach(n=>{
   total++;
   // FIXED LINK -> read-novel.html
   grid.innerHTML+=`<div class="card" onclick="location.href='read-novel.html?id=${n._id||n.id}'"><span class="badge-live">LIVE</span><img src="${n.coverImage||n.cover||'https://picsum.photos/400/600'}" loading="lazy"><div class="info"><h3>${n.title}</h3><p>${n.author||'Anon'} • ${n.genre||'Novel'}</p></div></div>`;
 });
 // My uploads
 let my=[];
 try{ my=JSON.parse(localStorage.getItem("myNovels")||"[]"); }catch(e){}
 let my2=[];
 try{ my2=JSON.parse(localStorage.getItem("myBooks")||"[]").filter(b=>!b.pages); }catch(e){}
 [...my,...my2].forEach(n=>{
   total++;
   grid.innerHTML+=`<div class="card" style="border-color:#ff00ff40" onclick="location.href='read-novel.html?id=my_${n.id||n._id}'"><span class="badge-my">MY ✨</span><img src="${n.cover||n.coverImage}" loading="lazy"><div class="info"><h3>${n.title}</h3><p>${n.author||'Me'} • My</p></div></div>`;
 });
 count.innerText=total+" stories • v704.5 PUBLIC FIXED";
 if(total===0) grid.innerHTML="<div style='grid-column:1/-1;text-align:center;padding:40px;color:#666'>No novels yet<br><a href='dashboard.html' style='background:#fff;color:#000;padding:8px 16px;border-radius:20px;text-decoration:none;font-weight:800;display:inline-block;margin-top:10px'>Publish Now</a></div>";
}
load();
</script>
</body></html>
