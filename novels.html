<!DOCTYPE html><html><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Novels v708 FB FILTER + LIKE</title>
<link rel="stylesheet" href="style.css?v=708">
<style>
*{box-sizing:border-box}body{margin:0;background:#07070a;color:#fff;font-family:system-ui}
header{position:sticky;top:0;z-index:99;display:flex;justify-content:space-between;align-items:center;padding:10px 14px;background:rgba(17,17,18,0.94);backdrop-filter:blur(12px);border-bottom:1px solid #222}
.logo{font-weight:900}.logo span{color:#ff00ff}
.search-wrap{max-width:600px;margin:0 auto;padding:10px 14px;position:sticky;top:49px;z-index:98;background:#07070a}
.search{width:100%;padding:12px 16px;border-radius:99px;background:#1a1a1e;border:1px solid #2a2a30;color:#fff;outline:none}
.filters{display:flex;gap:8px;overflow:auto;padding:10px 14px;max-width:600px;margin:0 auto}
.chip{padding:7px 14px;border-radius:99px;background:#1a1a1e;border:1px solid #2a2a30;color:#888;font-size:12px;white-space:nowrap;cursor:pointer}
.chip.on{background:#ff00ff;color:#fff;border-color:#ff00ff;font-weight:800}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;padding:10px 14px 120px;max-width:600px;margin:0 auto}
.grid.list{grid-template-columns:1fr}
.card{background:#15151a;border:1px solid #222;border-radius:16px;overflow:hidden;cursor:pointer;position:relative}
.card.list{display:flex;gap:10px;padding:10px}
.card img{width:100%;height:190px;object-fit:cover}
.card.list img{width:80px;height:110px;border-radius:10px}
.badge{position:absolute;top:8px;left:8px;padding:3px 8px;border-radius:20px;font-size:8px;font-weight:900}
.badge-live{background:#00ff88;color:#000}.badge-paid{background:#facc15;color:#000}
.info{padding:10px}
.nav{position:fixed;bottom:0;left:0;right:0;background:#111;border-top:1px solid #222;display:flex;justify-content:space-around;padding:8px 0;z-index:99}
.nav a{color:#666;text-decoration:none;font-size:11px;text-align:center}.nav a.active{color:#ff00ff}
/* v708 UPLOAD */
.modal{position:fixed;inset:0;background:rgba(0,0,0,0.8);z-index:200;display:none;align-items:center;justify-content:center;padding:16px}
.modal.on{display:flex}
.modal-box{background:#15151a;border:1px solid #333;border-radius:16px;width:100%;max-width:420px;padding:16px}
.inp{width:100%;padding:11px 12px;border-radius:10px;background:#1a1a1e;border:1px solid #2a2a30;color:#fff;margin:6px 0;outline:none}
.btn{width:100%;padding:12px;border-radius:10px;border:0;font-weight:900;cursor:pointer;margin-top:8px}
.btn-p{background:#ff00ff;color:#fff}.btn-g{background:#222;color:#888}
.file-btn{display:block;width:100%;padding:12px;border-radius:10px;background:#222;border:1px dashed #444;color:#aaa;text-align:center;cursor:pointer;margin:6px 0}
</style>
</head><body>
<header><div class="logo">Gen-Z <span>Novels</span> <small style="font-size:9px;background:#ff00ff;color:#fff;padding:2px 5px;border-radius:5px">v708 FB LIKE</small></div><div style="display:flex;gap:8px"><button onclick="toggleView()" style="padding:6px 10px;border-radius:8px;background:#222;border:1px solid #333;color:#fff">⊞</button><button onclick="openUpload()" style="padding:7px 12px;border-radius:20px;background:#ff00ff;color:#fff;border:0;font-size:11px;font-weight:800">+ Upload</button><a href="dashboard.html?v=708" style="padding:7px 12px;border-radius:20px;background:#fff;color:#000;text-decoration:none;font-size:11px;font-weight:800">✍️ Studio</a></div></header>
<div class="search-wrap"><input id="q" class="search" placeholder="🔍 Search novels v708..." oninput="filter()"></div>
<div class="filters" id="filters">
<div class="chip on" onclick="setGenre('all',this)">All</div>
<div class="chip" onclick="setGenre('romance',this)">Romance</div>
<div class="chip" onclick="setGenre('fantasy',this)">Fantasy</div>
<div class="chip" onclick="setGenre('horror',this)">Horror</div>
<div class="chip" onclick="setGenre('sci-fi',this)">Sci-Fi</div>
<div class="chip" onclick="setGenre('free',this)">FREE</div>
<div class="chip" onclick="setGenre('paid',this)">PAID ₹</div>
</div>
<div id="grid" class="grid"></div>

<!-- FAB -->
<a href="javascript:openUpload()" style="position:fixed;bottom:80px;right:16px;background:#ff00ff;color:#fff;width:56px;height:56px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:28px;text-decoration:none;box-shadow:0 8px 20px rgba(255,0,255,0.4);z-index:100;">+</a>

<!-- v708 UPLOAD MODAL -->
<div id="upModal" class="modal" onclick="if(event.target==this)closeUpload()">
<div class="modal-box">
<h3 style="margin:0 0 8px">Upload Novel v708</h3>
<input id="uTitle" class="inp" placeholder="Title">
<input id="uAuthor" class="inp" placeholder="Author">
<select id="uGenre" class="inp"><option>romance</option><option>fantasy</option><option>horror</option><option>sci-fi</option><option>thriller</option></select>
<select id="uAccess" class="inp"><option value="free">FREE</option><option value="paid">PAID ₹10</option></select>
<textarea id="uDesc" class="inp" placeholder="Description" rows="3"></textarea>

<label for="uCover" class="file-btn">📷 Choose Cover Image <span id="coverName" style="color:#ff00ff"></span></label>
<input type="file" id="uCover" accept="image/*" hidden>

<label for="uFile" class="file-btn">📁 Choose Novel File (PDF/TXT) <span id="fileName" style="color:#00ff88"></span></label>
<input type="file" id="uFile" accept=".pdf,.txt,.docx,.epub" hidden>

<button class="btn btn-p" onclick="doUpload()">🚀 Upload Now</button>
<button class="btn btn-g" onclick="closeUpload()">Cancel</button>
<p id="upStatus" style="font-size:11px;color:#888;margin-top:8px"></p>
</div>
</div>

<div class="nav">
<a href="index.html?v=708">🏠<br>Home</a>
<a href="novels.html?v=708" class="active">📚<br>Novels</a>
<a href="comics.html?v=708">🎨<br>Comics</a>
<a href="dashboard.html?v=708">📝<br>Studio</a>
</div>
<script>
const API="https://gen-z-visual-2.onrender.com";let all=[],genre='all',isList=false;
fetch(API+"/",{cache:"no-store"}).catch(()=>{});
async function load(){
 let g=document.getElementById('grid'); g.innerHTML="<p style='color:#555;padding:20px'>⏳ Waking LIVE v708 FB...</p>";
 try{await fetch(API+"/",{cache:"no-store"})}catch{}
 try{let r=await fetch(API+"/api/novels",{cache:"no-store"});let d=await r.json(); all=Array.isArray(d)?d:d.novels||[];}catch{all=[];}
 render();
}
function render(){
 let q=document.getElementById('q').value.toLowerCase();
 let f=all.filter(n=>{
  let okG=genre==='all'||(genre==='free'&&(n.access||'free')==='free')||(genre==='paid'&&(n.access||'')==='paid')||(n.genre||'').toLowerCase().includes(genre);
  let okQ=!q||n.title.toLowerCase().includes(q)||(n.author||'').toLowerCase().includes(q);
  return okG&&okQ;
 });
 document.getElementById('grid').innerHTML=f.map(n=>`
 <div class="card ${isList?'list':''}" onclick="location.href='read-novel.html?id=${n._id}&v=708'">
  <span class="badge ${n.access==='paid'?'badge-paid':'badge-live'}">${n.access==='paid'?'₹'+(n.price||10):'FREE'}</span>
  <img src="${n.cover||n.coverImage||'https://picsum.photos/300/400'}" loading="lazy">
  <div class="info"><h3 style="font-size:13px;margin:0">${n.title.slice(0,30)}</h3><p style="font-size:11px;color:#888;margin:4px 0">${n.author||'Anon'} • 👁️ ${n.views||0} ❤️ ${n.likes||0} 💬 ${n.comments||0}</p><p style="font-size:10px;color:#555">${(n.description||'').slice(0,60)}</p></div>
 </div>`).join('')||"<p style='color:#666;padding:20px'>No novels v708</p>";
}
function filter(){render();}
function setGenre(g,el){genre=g;document.querySelectorAll('.chip').forEach(c=>c.classList.remove('on'));el.classList.add('on');render();}
function toggleView(){isList=!isList;document.getElementById('grid').classList.toggle('list',isList);render();}
function openUpload(){document.getElementById('upModal').classList.add('on')}
function closeUpload(){document.getElementById('upModal').classList.remove('on')}

document.getElementById('uCover').addEventListener('change',e=>{
 let f=e.target.files[0]; if(f) document.getElementById('coverName').textContent=' : '+f.name;
});
document.getElementById('uFile').addEventListener('change',e=>{
 let f=e.target.files[0]; if(f) document.getElementById('fileName').textContent=' : '+f.name;
});

async function doUpload(){
 let st=document.getElementById('upStatus');
 let title=document.getElementById('uTitle').value.trim();
 let author=document.getElementById('uAuthor').value.trim()||'Anon';
 let genreV=document.getElementById('uGenre').value;
 let access=document.getElementById('uAccess').value;
 let desc=document.getElementById('uDesc').value.trim();
 let coverF=document.getElementById('uCover').files[0];
 let novelF=document.getElementById('uFile').files[0];
 if(!title){st.textContent='❌ Title required'; return;}
 st.textContent='⏳ Uploading v708...';
 let fd=new FormData();
 fd.append('title',title); fd.append('author',author); fd.append('genre',genreV); fd.append('access',access); fd.append('description',desc);
 if(coverF) fd.append('cover',coverF);
 if(novelF) fd.append('file',novelF);
 if(novelF) fd.append('novelFile',novelF);
 try{
  let r=await fetch(API+'/api/novels',{method:'POST',body:fd});
  let d=await r.json();
  if(r.ok){st.textContent='✅ Uploaded!'; setTimeout(()=>{closeUpload(); load();},800);}
  else st.textContent='❌ '+(d.message||'Failed');
 }catch(e){st.textContent='❌ Network error - Render sleeping, try again in 30s';}
}
load();
</script></body></html>
