<!DOCTYPE html><html><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Novels v708 FB FILTER + LIKE</title>
<link rel="stylesheet" href="style.css?v=708">
<style>
*{box-sizing:border-box}body{margin:0;background:#07070a;color:#fff;font-family:system-ui}
header{position:sticky;top:0;z-index:99;display:flex;justify-content:space-between;align-items:center;padding:10px 14px;background:rgba(17,17,18,0.94);backdrop-filter:blur(12px);border-bottom:1px solid #222}
.logo{font-weight:900}.logo span{color:#ff00ff}
.search-wrap{max-width:600px;margin:0 auto;padding:10px 14px;position:sticky;top:49px;z-index:98;background:#07070a}
.search{width:100%;padding:12px 16px;border-radius:99px;background:#1a1a1e;border:1px solid #2a2a30;color:#fff;outline:none}
.filters{display:flex;gap:8px;overflow:auto;padding:10px 14px;max-width:600px;margin:0 auto}
.chip{padding:7px 14px;border-radius:99px;background:#1a1a1e;border:1px solid #2a2a30;color:#888;font-size:12px;white-space:nowrap;cursor:pointer}
.chip.on{background:#ff00ff;color:#fff;border-color:#ff00ff;font-weight:800}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;padding:10px 14px 120px;max-width:600px;margin:0 auto}
.grid.list{grid-template-columns:1fr}
.card{background:#15151a;border:1px solid #222;border-radius:16px;overflow:hidden;cursor:pointer;position:relative}
.card.list{display:flex;gap:10px;padding:10px}
.card img{width:100%;height:190px;object-fit:cover}
.card.list img{width:80px;height:110px;border-radius:10px}
.badge{position:absolute;top:8px;left:8px;padding:3px 8px;border-radius:20px;font-size:8px;font-weight:900}
.badge-live{background:#00ff88;color:#000}.badge-paid{background:#facc15;color:#000}
.info{padding:10px}
.nav{position:fixed;bottom:0;left:0;right:0;background:#111;border-top:1px solid #222;display:flex;justify-content:space-around;padding:8px 0;z-index:99}
.nav a{color:#666;text-decoration:none;font-size:11px;text-align:center}.nav a.active{color:#ff00ff}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.85);z-index:999;display:none;align-items:center;justify-content:center;padding:16px}
.modal.on{display:flex}.box{background:#15151a;border:1px solid #333;border-radius:16px;width:100%;max-width:400px;padding:16px}
.inp{width:100%;padding:11px;border-radius:10px;background:#1a1a1e;border:1px solid #2a2a30;color:#fff;margin:5px 0}
.fbtn{display:block;padding:12px;border-radius:10px;background:#222;border:1px dashed #555;color:#aaa;text-align:center;margin:6px 0;cursor:pointer}
</style>
</head><body>
<header><div class="logo">Gen-Z <span>Novels</span> <small style="font-size:9px;background:#ff00ff;color:#fff;padding:2px 5px;border-radius:5px">v708 FB LIKE</small></div><div style="display:flex;gap:6px"><button onclick="toggleView()" style="padding:6px 10px;border-radius:8px;background:#222;border:1px solid #333;color:#fff">⊞</button><button onclick="openUp()" style="padding:7px 12px;border-radius:20px;background:#ff00ff;color:#fff;border:0;font-size:11px;font-weight:800">+ Upload</button><a href="dashboard.html?v=708" style="padding:7px 12px;border-radius:20px;background:#fff;color:#000;text-decoration:none;font-size:11px;font-weight:800">✍️ Studio</a></div></header>
<div class="search-wrap"><input id="q" class="search" placeholder="🔍 Search novels v708..." oninput="filter()"></div>
<div class="filters" id="filters">
<div class="chip on" onclick="setGenre('all',this)">All</div>
<div class="chip" onclick="setGenre('romance',this)">Romance</div>
<div class="chip" onclick="setGenre('fantasy',this)">Fantasy</div>
<div class="chip" onclick="setGenre('horror',this)">Horror</div>
<div class="chip" onclick="setGenre('sci-fi',this)">Sci-Fi</div>
<div class="chip" onclick="setGenre('free',this)">FREE</div>
<div class="chip" onclick="setGenre('paid',this)">PAID ₹</div>
</div>
<div id="grid" class="grid"></div>

<!-- v708 UPLOAD BUTTONS -->
<button onclick="openUp()" style="position:fixed;bottom:85px;right:14px;width:56px;height:56px;border-radius:50%;background:#ff00ff;color:#fff;border:0;font-size:28px;box-shadow:0 8px 20px rgba(255,0,255,.5);z-index:90">+</button>

<div id="upM" class="modal" onclick="if(event.target==this)closeUp()"><div class="box">
<h3 style="margin:0 0 10px">Upload Novel v708</h3>
<input id="t" class="inp" placeholder="Title *">
<input id="a" class="inp" placeholder="Author">
<select id="g" class="inp"><option>romance</option><option>fantasy</option><option>horror</option><option>sci-fi</option></select>
<select id="ac" class="inp"><option value="free">FREE</option><option value="paid">PAID ₹</option></select>
<textarea id="d" class="inp" rows="2" placeholder="Description"></textarea>
<label for="c" class="fbtn">📷 Cover Image <b id="cn" style="color:#ff00ff"></b></label><input id="c" type="file" accept="image/*" hidden>
<label for="f" class="fbtn">📁 Novel File PDF/TXT <b id="fn" style="color:#0f8"></b></label><input id="f" type="file" accept=".pdf,.txt,.docx,.epub" hidden>
<button onclick="up()" style="width:100%;padding:12px;border-radius:10px;background:#ff00ff;color:#fff;border:0;font-weight:800;margin-top:6px">🚀 Upload</button>
<button onclick="closeUp()" style="width:100%;padding:10px;border-radius:10px;background:#222;color:#888;border:0;margin-top:6px">Cancel</button>
<p id="s" style="font-size:11px;color:#888"></p>
</div></div>

<div class="nav">
<a href="index.html?v=708">🏠<br>Home</a>
<a href="novels.html?v=708" class="active">📚<br>Novels</a>
<a href="comics.html?v=708">🎨<br>Comics</a>
<a href="dashboard.html?v=708">📝<br>Studio</a>
</div>
<script>
const API="https://gen-z-visual-2.onrender.com";let all=[],genre='all',isList=false;
fetch(API+"/",{cache:"no-store"}).catch(()=>{});
async function load(){
 let g=document.getElementById('grid'); g.innerHTML="<p style='color:#555;padding:20px'>⏳ Waking LIVE v708 FB...</p>";
 try{await fetch(API+"/",{cache:"no-store"})}catch{}
 try{let r=await fetch(API+"/api/novels",{cache:"no-store"});let d=await r.json(); all=Array.isArray(d)?d:d.novels||[];}catch{all=[];}
 render();
}
function render(){
 let q=document.getElementById('q').value.toLowerCase();
 let f=all.filter(n=>{
  let okG=genre==='all'||(genre==='free'&&(n.access||'free')==='free')||(genre==='paid'&&(n.access||'')==='paid')||(n.genre||'').toLowerCase().includes(genre);
  let okQ=!q||n.title.toLowerCase().includes(q)||(n.author||'').toLowerCase().includes(q);
  return okG&&okQ;
 });
 document.getElementById('grid').innerHTML=f.map(n=>`
 <div class="card ${isList?'list':''}" onclick="location.href='read-novel.html?id=${n._id}&v=708'">
  <span class="badge ${n.access==='paid'?'badge-paid':'badge-live'}">${n.access==='paid'?'₹'+(n.price||10):'FREE'}</span>
  <img src="${n.cover||n.coverImage||'https://picsum.photos/300/400'}" loading="lazy">
  <div class="info"><h3 style="font-size:13px;margin:0">${n.title.slice(0,30)}</h3><p style="font-size:11px;color:#888;margin:4px 0">${n.author||'Anon'} • 👁️ ${n.views||0} ❤️ ${n.likes||0} 💬 ${n.comments||0}</p><p style="font-size:10px;color:#555">${(n.description||'').slice(0,60)}</p></div>
 </div>`).join('')||"<p style='color:#666;padding:20px'>No novels v708</p>";
}
function filter(){render();}
function setGenre(g,el){genre=g;document.querySelectorAll('.chip').forEach(c=>c.classList.remove('on'));el.classList.add('on');render();}
function toggleView(){isList=!isList;document.getElementById('grid').classList.toggle('list',isList);render();}
function openUp(){document.getElementById('upM').classList.add('on')}
function closeUp(){document.getElementById('upM').classList.remove('on')}
document.getElementById('c').onchange=e=>{if(e.target.files[0])document.getElementById('cn').textContent=': '+e.target.files[0].name}
document.getElementById('f').onchange=e=>{if(e.target.files[0])document.getElementById('fn').textContent=': '+e.target.files[0].name}
async function up(){
 let s=document.getElementById('s'); let title=document.getElementById('t').value.trim();
 if(!title){s.textContent='❌ Title needed'; return;}
 s.textContent='⏳ Uploading v708...';
 let fd=new FormData(); fd.append('title',title); fd.append('author',document.getElementById('a').value); fd.append('genre',document.getElementById('g').value); fd.append('access',document.getElementById('ac').value); fd.append('description',document.getElementById('d').value);
 let cf=document.getElementById('c').files[0]; let nf=document.getElementById('f').files[0];
 if(cf) fd.append('cover',cf); if(nf){fd.append('file',nf); fd.append('novelFile',nf);}
 try{let r=await fetch(API+'/api/novels',{method:'POST',body:fd}); let d=await r.json(); if(r.ok){s.textContent='✅ Done!'; setTimeout(()=>{closeUp();load()},800);} else s.textContent='❌ '+(d.message||'fail')}catch{s.textContent='❌ Render sleeping, retry in 30s'}}
load();
</script></body></html>
