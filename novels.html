<!DOCTYPE html><html><head><meta name="viewport" content="width=device-width, initial-scale=1"><title>Novels</title><style>body{background:#0a0a0a;color:white;font-family:sans-serif;padding:15px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.card{background:#1a1a1a;border-radius:12px;overflow:hidden;border:1px solid #333}img{width:100%;height:180px;object-fit:cover}.info{padding:10px}.btn{background:#ff00ff;color:white;border:none;padding:8px 12px;border-radius:20px;width:100%}</style></head><body><h2>📖 All Novels</h2><div class="grid" id="novelList"></div><script>fetch('data/novels.xml').then(r=>r.text()).then(str=>{let xml=new DOMParser().parseFromString(str,"text/xml");let novels=xml.querySelectorAll("novel");let html="";novels.forEach(n=>{html+=`<div class="card"><img src="${n.querySelector('cover').textContent}"><div class="info"><b>${n.querySelector('title').textContent}</b><br><small>by ${n.querySelector('author').textContent}</small><p>${n.querySelector('desc').textContent}</p><button class="btn" onclick="location.href='read.html?id=${n.querySelector('id').textContent}'">Read</button></div></div>`});document.getElementById('novelList').innerHTML=html});</script></body></html>
