<!DOCTYPE html>
<html><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Novels ULTRA - Gen-Z Visual v700</title>
<link rel="stylesheet" href="style.css?v=700">
<style>
.grid-ultra{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:14px;padding:16px 20px 120px}
.card-ultra{background:rgba(20,20,23,0.85);backdrop-filter:blur(20px);border:1px solid rgba(255,255,255,0.08);border-top:1px solid rgba(255,255,255,0.12);border-radius:22px;overflow:hidden;cursor:pointer;transition:all 0.4s cubic-bezier(0.175,0.885,0.32,1.275);position:relative;box-shadow:0 10px 30px rgba(0,0,0,0.4)}
.card-ultra:hover{transform:translateY(-8px) scale(1.02);border-color:#ff00ff50;box-shadow:0 20px 40px rgba(0,0,0,0.5),0 0 30px #ff00ff25}
.card-ultra img{width:100%;height:220px;object-fit:cover;transition:0.5s}
.card-ultra:hover img{transform:scale(1.08)}
.card-ultra .info{padding:12px 14px;background:linear-gradient(180deg,rgba(20,20,23,0.9),rgba(14,14,16,1))}
.card-ultra h3{font-size:13px;font-weight:800;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:white}
.card-ultra p{font-size:10px;color:#888;margin-top:3px}
.badge-my{position:absolute;top:10px;right:10px;padding:4px 10px;border-radius:99px;background:linear-gradient(135deg,#ff00ff,#7a00ff);color:white;font-size:9px;font-weight:900;box-shadow:0 4px 15px #ff00ff60;z-index:2}
.badge-live{position:absolute;top:10px;left:10px;padding:4px 10px;border-radius:99px;background:#00ff88;color:black;font-size:8px;font-weight:900;z-index:2;box-shadow:0 2px 10px #00ff8840}
.section-head{display:flex;justify-content:space-between;align-items:center;padding:20px 20px 0}
.count-badge{background:rgba(255,255,255,0.06);border:1px solid rgba(255,255,255,0.08);padding:6px 14px;border-radius:99px;font-size:11px;color:#888;font-weight:700;backdrop-filter:blur(10px)}
</style>
</head><body>
<header><div class="logo">Gen-Z <span>Visual</span> <span style="font-size:10px;background:#ff00ff;color:white;padding:3px 8px;border-radius:99px;margin-left:6px">NOVELS ULTRA</span></div><a href="dashboard.html" class="top-btn" style="background:white;color:black">✍️ Studio</a></header>

<div class="section-head">
<h2 style="font-size:22px;font-weight:900">Novels <span style="color:#ff00ff">LIVE</span> <span style="font-size:11px;background:#00ff88;color:black;padding:3px 8px;border-radius:99px;vertical-align:middle">v700</span></h2>
<span class="count-badge" id="count">Loading...</span>
</div>

<div id="grid" class="grid-ultra">
<div class="skeleton" style="height:280px;border-radius:22px"></div>
<div class="skeleton" style="height:280px;border-radius:22px"></div>
<div class="skeleton" style="height:280px;border-radius:22px"></div>
<div class="skeleton" style="height:280px;border-radius:22px"></div>
</div>

<div class="nav">
<a href="index.html">🏠<span>Home</span></a>
<a href="novels.html" class="active">📚<span>Novels</span></a>
<a href="comic.html">💥<span>Comics</span></a>
<a href="login.html">👤<span>Me</span></a>
</div>

<script>
const API_BASE="https://gen-z-visual-2.onrender.com";
const API=`${API_BASE}/api`;

async function load(){
 let grid=document.getElementById("grid");
 let countEl=document.getElementById("count");
 try{
   // 1. LIVE BACKEND FIRST - v700
   let liveNovels=[];
   try{
     let res=await fetch(`${API}/novels`);
     if(res.ok){liveNovels=await res.json();}
   }catch(e){console.log("Backend waking")}

   grid.innerHTML="";
   let total=0;

   // Show LIVE backend
   liveNovels.filter(n=>!n.type || n.type==="novel").forEach(n=>{
     total++;
     grid.innerHTML+=`<div class="card-ultra" onclick="location.href='read.html?id=${n._id}'"><span class="badge-live">LIVE</span><img src="${n.coverImage||n.cover||`https://picsum.photos/400/600?random=${n._id}`}"><div class="info"><h3>${n.title}</h3><p>${n.author||n.creatorName||'Anonymous'} • ${n.genre||'Novel'}</p></div></div>`;
   });

   // 2. XML FALLBACK (your old data)
   try{
     let res=await fetch('data/novels.xml');
     let text=await res.text();
     let xml=new DOMParser().parseFromString(text,"text/xml");
     let novels=[...xml.querySelectorAll("novel")];
     novels.forEach(n=>{
       total++;
       let id=n.querySelector("id")?.textContent;
       let title=n.querySelector("title")?.textContent;
       let author=n.querySelector("author")?.textContent;
       let cover=n.querySelector("cover")?.textContent;
       grid.innerHTML+=`<div class="card-ultra" onclick="location.href='read.html?id=${id}'"><img src="${cover}"><div class="info"><h3>${title}</h3><p>${author}</p></div></div>`;
     });
   }catch{}

   // 3. MY UPLOADED NOVELS (your localStorage logic KEPT)
   let myNovels=JSON.parse(localStorage.getItem("myNovels")||"[]");
   let myBooks=JSON.parse(localStorage.getItem("myBooks")||"[]");
   [...myNovels, ...myBooks.filter(b=>!b.type||b.type==="novel")].forEach(n=>{
     total++;
     grid.innerHTML+=`<div class="card-ultra" style="border-color:#ff00ff40" onclick="location.href='read.html?id=${n.id ? 'my_'+n.id : n._id}'"><span class="badge-my">MY UPLOAD ✨</span><img src="${n.cover||n.coverImage}"><div class="info"><h3>${n.title} ✨</h3><p>${n.author||n.creatorName} • My Upload</p></div></div>`;
   });

   countEl.innerText=total+" stories • Firewall v700 🔒";
   if(total===0) grid.innerHTML="<div style='grid-column:1/-1;text-align:center;padding:40px;color:#666'><div style='font-size:40px'>📚</div>No novels yet<br><small>Be first to publish in Studio</small><br><br><a href='dashboard.html' style='background:white;color:black;padding:10px 20px;border-radius:99px;text-decoration:none;font-weight:800'>Publish Now</a></div>";

 }catch(e){ 
   grid.innerHTML=`<div style='grid-column:1/-1;text-align:center;padding:30px;color:#ff4444'>❌ ${e.message}<br><small>Backend waking, retry in 30s</small></div>`; 
   countEl.innerText="Offline";
 }
}
load();
</script>
</body></html>
