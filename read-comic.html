<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Read Comic v708 FB</title><style>
*{box-sizing:border-box}body{margin:0;background:#000;color:#fff;font-family:system-ui}
header{display:flex;justify-content:space-between;padding:10px 14px;background:#111;border-bottom:1px solid #222;position:sticky;top:0;z-index:99}
.progress{height:3px;background:#222;position:sticky;top:49px;z-index:98}.progress-bar{height:100%;background:linear-gradient(90deg,#ff00ff,#ff8800);width:0%}
.reader{max-width:500px;margin:0 auto;min-height:75vh;background:#07070a}
.page-wrap img{width:100%;max-height:85vh;object-fit:contain}
.actions{display:flex;gap:8px;padding:10px;position:sticky;bottom:0;background:#111;border-top:1px solid #222;max-width:500px;margin:0 auto}
.act{flex:1;padding:10px;background:#1e1e26;border:1px solid #333;border-radius:12px;color:#ccc;text-align:center;cursor:pointer;font-size:12px;font-weight:700}
.act.liked{background:#ff00ff22;color:#ff00ff}
.comment-box{max-width:500px;margin:10px auto;padding:12px;background:#15151a;border:1px solid #222;border-radius:16px}
.c-input{width:100%;padding:10px;background:#0a0a0a;border:1px solid #333;border-radius:10px;color:#fff}
.c-item{padding:8px 0;border-bottom:1px solid #222;font-size:12px}
</style></head><body>
<header><div style="font-weight:900">Gen-Z <span style="color:#ff00ff">Comics</span> <small style="font-size:9px;background:#ff00ff;color:#fff;padding:2px 6px;border-radius:6px">v708 FB</small></div><a href="index.html?v=708" style="padding:7px 14px;background:#fff;color:#000;border-radius:99px;text-decoration:none;font-size:12px;font-weight:800">✕ Close</a></header>
<div class="progress"><div class="progress-bar" id="bar"></div></div>
<div class="reader">
<div style="padding:14px"><h2 id="t">Loading v708...</h2><p id="author" style="font-size:11px;color:#888"></p></div>
<div style="text-align:center"><img id="pageImg" style="width:100%"><div style="padding:10px"><button onclick="prevPage()">← Prev</button> <span id="counter">1 / 1</span> <button onclick="nextPage()">Next →</button></div></div>
</div>
<div class="actions">
<div class="act" id="likeBtn" onclick="toggleLike()">🤍 Like <span id="likeCount">0</span></div>
<div class="act" onclick="document.getElementById('commentBox').scrollIntoView()">💬 Comment <span id="commentCount">0</span></div>
<div class="act" id="saveBtn" onclick="toggleSave()">🔖 Save</div>
</div>

<div id="commentBox" class="comment-box">
<b>💬 Comments FB v708</b>
<div id="commentList" style="margin:10px 0"></div>
<input id="cName" placeholder="Your name" style="width:100%;padding:8px;background:#0a0a0a;border:1px solid #333;border-radius:8px;color:#fff;margin:4px 0">
<textarea id="cText" placeholder="Write comment..." style="width:100%;padding:8px;background:#0a0a0a;border:1px solid #333;border-radius:8px;color:#fff"></textarea>
<button onclick="postComment()" style="width:100%;padding:10px;background:#ff00ff;color:#fff;border:none;border-radius:10px;font-weight:800;margin-top:6px">Post Comment v708</button>
</div>

<script>
const API_BASE="https://gen-z-visual-2.onrender.com";const API=API_BASE+"/api";
let book=null,pages=[],cur=0,id=null,realId=null,liked=JSON.parse(localStorage.getItem('genz_liked')||'[]'),saved=JSON.parse(localStorage.getItem('genz_saved')||'[]');
let comments=JSON.parse(localStorage.getItem('genz_comments_'+location.search)||'[]');
async function loadStory(){
 let p=new URLSearchParams(location.search);id=p.get('id');realId=id;
 try{let r=await fetch(API+"/comics/"+realId,{cache:"no-store"});if(r.ok)book=await r.json();}catch{}
 if(!book){t.innerText='Not found';return;}
 t.innerText=book.title;author.innerText=`👁️ ${book.views||0} ❤️ ${book.likes||0} 💬 ${comments.length}`;
 likeCount.innerText=book.likes||0;commentCount.innerText=comments.length;
 pages=(book.pages||[]).map(p=>typeof p==='string'?p:p.image||p.url||'');pageImg.src=pages[0];
 renderComments();
}
function updatePage(){pageImg.src=pages[cur];counter.innerText=`${cur+1} / ${pages.length}`;bar.style.width=`${((cur+1)/pages.length)*100}%`;}
function nextPage(){if(cur<pages.length-1){cur++;updatePage();}}function prevPage(){if(cur>0){cur--;updatePage();}}
function toggleLike(){let i=liked.indexOf(id);if(i>-1){liked.splice(i,1)}else{liked.push(id);likeCount.innerText=parseInt(likeCount.innerText)+1;try{fetch(API+"/comics/"+realId+"/like",{method:'POST'})}catch{}}localStorage.setItem('genz_liked',JSON.stringify(liked));likeBtn.className='act'+(liked.includes(id)?' liked':'');likeBtn.innerHTML=(liked.includes(id)?'❤️ Liked ':'🤍 Like ')+`<span>${likeCount.innerText}</span>`;}
function toggleSave(){let i=saved.indexOf(id);if(i>-1)saved.splice(i,1);else saved.push(id);localStorage.setItem('genz_saved',JSON.stringify(saved));saveBtn.innerHTML=saved.includes(id)?'📚 Saved':'🔖 Save';}
function renderComments(){commentList.innerHTML=comments.map(c=>`<div class="c-item"><b>${c.name}</b> <small style="color:#666">${c.time}</small><br>${c.text}</div>`).join('')||'<small style="color:#555">No comments yet - be first v708!</small>';}
function postComment(){let name=cName.value||'GenZ User';let text=cText.value.trim();if(!text)return alert('Write comment');let obj={name,text,time:new Date().toLocaleString()};comments.push(obj);localStorage.setItem('genz_comments_'+location.search,JSON.stringify(comments));cText.value='';renderComments();commentCount.innerText=comments.length;}
loadStory();
</script></body></html>
