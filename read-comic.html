<!DOCTYPE html><html><head><meta name="viewport" content="width=device-width, initial-scale=1"><title>Read Comic</title><link rel="stylesheet" href="style.css"><style>img{width:100%;max-width:600px;display:block;margin:0 auto 10px;border-radius:12px}</style></head><body><header><div class="logo">Comic</div><a href="comic.html" class="top-btn" style="background:white;color:black">Back</a></header><div class="section"><h2 id="t">Loading...</h2><div id="p"></div></div><script>let id=new URLSearchParams(location.search).get("id");fetch('data/comics.xml').then(r=>r.text()).then(s=>{let x=new DOMParser().parseFromString(s,"text/xml");let c=[...x.querySelectorAll("comic")].find(v=>v.querySelector("id").textContent==id);document.getElementById("t").innerText=c.querySelector("title").textContent;let pages=c.querySelector("pages").textContent.split(",");document.getElementById("p").innerHTML=pages.map(u=>`<img src="${u.trim()}">`).join("")})</script></body></html>
