<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Read Comic v704.5 FINAL</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#07070a;color:#fff;font-family:system-ui}
header{display:flex;justify-content:space-between;align-items:center;padding:12px 16px;background:#111;border-bottom:1px solid #222;position:sticky;top:0;z-index:99}
.logo{font-weight:900}.logo span{color:#ff8800}
.top-btn{padding:8px 16px;border-radius:99px;background:#fff;color:#000;text-decoration:none;font-weight:800;font-size:12px}
.reader-wrap{max-width:700px;margin:0 auto;padding:16px 20px 120px}
.top-info{background:#15151a;border:1px solid #222;border-radius:24px;padding:18px;display:flex;gap:14px;margin-bottom:16px}
.top-info img{width:90px;height:130px;border-radius:12px;object-fit:cover}
.comic-pages{display:flex;flex-direction:column;gap:0;background:#15151a;border-radius:24px;overflow:hidden;border:1px solid #222;padding:6px}

</style></head><body>
<header><div class="logo">Gen-Z <span>Comics</span> <span style="font-size:10px;background:#00ff88;color:#000;padding:2px 6px;border-radius:10px">v704.5</span></div><a href="comic.html?v=704.5" class="top-btn">✕ Close</a></header>
<div class="progress"><div class="progress-bar" id="bar"></div></div>
<div class="reader-wrap">
<div class="top-info"><img id="cover" src="https://picsum.photos/300/400"><div style="flex:1"><h2 id="t" style="margin:0;font-size:20px;font-weight:900">Loading...</h2><p id="author" style="font-size:12px;color:#888">...</p><p id="desc" style="font-size:11px;color:#666;margin-top:8px"></p><span id="badge" style="font-size:10px;background:#ff00ff22;border:1px solid #ff00ff40;padding:4px 10px;border-radius:20px;color:#ff8aff">Searching...</span><div style="margin-top:10px"><button class="ctrl" onclick="window.scrollBy({top:-innerHeight*0.8,behavior:'smooth'})">↑</button><button class="ctrl" onclick="window.scrollBy({top:innerHeight*0.8,behavior:'smooth'})">↓</button></div></div></div>
<div class="comic-pages" id="pages"></div>
</div>
<script>
const API="https://gen-z-visual-2.onrender.com/api";
async function load(){
 let id=new URLSearchParams(location.search).get('id'); if(!id){t.innerText='No ID';return;}
 let comic=null, src="";
 try{ let all=JSON.parse(localStorage.getItem("myComics")||"[]").concat(JSON.parse(localStorage.getItem("myBooks")||"[]").filter(b=>b.pages)); comic=all.find(c=>String(c._id||c.id)===String(id)||String(c._id||c.id)===String(id).replace('my_','')); if(comic) src="DEVICE"; }catch(e){}
 if(!comic){ try{ let r=await fetch(API+'/comics'); let list=await r.json(); list=Array.isArray(list)?list:list.comics||[]; comic=list.find(c=>String(c._id)===String(id)); if(comic) src="LIVE ✅"; }catch(e){} }
 if(!comic){ t.innerText='Not found'; badge.innerText='❌ Not found'; return; }
 t.innerText=comic.title; author.innerText='by '+(comic.author||'GenZ'); desc.innerText=comic.description||''; cover.src=comic.cover||comic.coverImage||comic.pages?.[0]||'https://picsum.photos/300/400'; badge.innerText=src||'LIVE';
 let imgs=comic.pages||[]; pages.innerHTML=imgs.map((p,i)=>`<img src="${p}" loading="lazy"><div class="page-num">Page ${i+1}/${imgs.length}</div>`).join('')||'<div style="text-align:center;color:#666;padding:20px">No pages</div>';
 window.addEventListener('scroll',()=>{ let h=document.documentElement.scrollHeight-innerHeight, pct=h>0? (scrollY/h)*100:0; bar.style.width=pct+'%'; });
}
load();
</script>
</body></html>
