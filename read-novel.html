<!DOCTYPE html><html lang="en"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Read Novel - Gen-Z Visual v704.7</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#07070a;color:#fff;font-family:system-ui,sans-serif}
header{position:sticky;top:0;z-index:99;display:flex;justify-content:space-between;align-items:center;padding:12px 16px;background:rgba(17,17,17,0.9);backdrop-filter:blur(20px);border-bottom:1px solid #222}
.logo{font-weight:900}.logo span{color:#00ff88}
.top-btn{padding:8px 16px;border-radius:99px;background:#fff;color:#000;text-decoration:none;font-size:12px;font-weight:800}
.reader-wrap{max-width:700px;margin:0 auto;padding:16px 16px 120px}
.info-card{background:rgba(20,20,23,0.85);backdrop-filter:blur(25px);border:1px solid rgba(255,255,255,0.08);border-radius:28px;padding:20px;display:flex;gap:16px;margin-bottom:16px}
.info-card img{width:100px;height:150px;border-radius:14px;object-fit:cover;border:1px solid #222}
.info-text{flex:1}
.info-text h2{font-size:22px;font-weight:900;margin:0;line-height:1.1}
.badge{padding:4px 10px;border-radius:99px;background:#00ff8822;border:1px solid #00ff8840;color:#00ff88;font-size:10px;font-weight:800;display:inline-block;margin-top:8px}
.content-box{background:rgba(20,20,23,0.8);border:1px solid #222;border-radius:24px;padding:20px;line-height:1.9;font-size:16px;white-space:pre-wrap;color:#ddd;min-height:200px;font-family:Georgia,serif}
.progress{height:4px;background:#222;border-radius:99px;margin:12px 0;overflow:hidden;position:sticky;top:58px;z-index:10}
.progress-bar{height:100%;background:linear-gradient(90deg,#00ff88,#00ccff);width:0%;transition:0.2s}
.controls{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
.ctrl{padding:8px 14px;border-radius:99px;background:#1a1a1e;border:1px solid #222;color:#fff;font-size:11px;font-weight:700;cursor:pointer}
.paywall{display:none;position:fixed;inset:0;background:#07070af0;backdrop-filter:blur(20px);z-index:9999;align-items:center;justify-content:center;padding:20px}
.paywall.on{display:flex}
.pay-box{background:#15151a;border:1px solid #333;border-radius:24px;padding:24px;max-width:380px;width:100%;text-align:center}
</style>
</head><body>
<header>
  <div class="logo">Gen-Z <span>Novel</span> <span style="font-size:9px;background:#00ff88;color:#000;padding:2px 6px;border-radius:10px">v704.7 FIXED</span></div>
  <a href="novels.html?v=704.7" class="top-btn">✕ Close</a>
</header>
<div class="progress"><div class="progress-bar" id="bar"></div></div>
<div class="reader-wrap">
  <div class="info-card">
    <img id="cover" src="https://picsum.photos/300/400?random=99" alt="">
    <div class="info-text">
      <h2 id="title">Loading novel...</h2>
      <p id="author" style="font-size:12px;color:#888;margin-top:6px">by ...</p>
      <p id="desc" style="font-size:11px;color:#aaa;margin-top:8px;line-height:1.4"></p>
      <span class="badge" id="badge">🔍 Searching...</span>
      <div class="controls">
        <button class="ctrl" onclick="share()">↗ Share</button>
        <button class="ctrl" onclick="toggleFS()">⛶ Fullscreen</button>
      </div>
    </div>
  </div>
  <div class="content-box" id="content">Loading story...</div>
  <p style="text-align:center;color:#444;font-size:10px;margin-top:20px">Gen-Z Visual v704.7 LIVE Reader</p>
</div>

<!-- PAYWALL - NO CODE INSIDE, ONLY HTML -->
<div id="paywall" class="paywall"><div class="pay-box">
<div style="font-size:40px">💎</div>
<h2 style="margin:10px 0">Premium Novel</h2>
<p id="payTitle" style="color:#888;font-size:13px"></p>
<h1 id="payPrice" style="color:#00ff88;margin:10px 0">₹49</h1>
<p style="font-size:11px;color:#666">Money goes directly to author via UPI</p>
<button onclick="doPay()" style="width:100%;padding:14px;background:#00ff88;color:#000;border:none;border-radius:12px;font-weight:900;margin-top:12px;cursor:pointer">🔓 Pay & Unlock Now</button>
<p style="font-size:10px;color:#555;margin-top:10px">After payment, enter Transaction ID for verification</p>
</div></div>

<script>
const API="https://gen-z-visual-2.onrender.com/api";
let currentBook=null,currentId=null;

async function loadStory(){
  let params=new URLSearchParams(location.search);
  let novelId=params.get("id");currentId=novelId;
  if(!novelId){document.getElementById("title").innerText="No ID";return;}
  let realId=novelId.replace("my_","");let book=null,source="";
  document.getElementById("badge").innerText="🔍 Direct check...";
  try{let r=await fetch(API+"/novels/"+realId);if(r.ok){book=await r.json();source="DIRECT ✅";}}catch(e){}
  if(!book){try{let r=await fetch(API+"/comics/"+realId);if(r.ok){let b=await r.json();if(b.content){book=b;source="DIRECT COMIC";}}}catch(e){}}
  if(!book){document.getElementById("badge").innerText="🔍 Searching list...";try{let res=await fetch(API+"/novels");if(res.ok){let list=await res.json();list=Array.isArray(list)?list:list.novels||[];book=list.find(x=>String(x._id)===String(realId)||String(x._id)===String(novelId)||String(x.id)===String(realId));if(book)source="LIVE LIST ✅";}}catch(e){}}
  if(!book){try{let myNovels=JSON.parse(localStorage.getItem("myNovels")||"[]");let myBooks=JSON.parse(localStorage.getItem("myBooks")||"[]").filter(b=>!b.pages);let all=[...myNovels,...myBooks];book=all.find(x=>String(x.id||x._id)===String(realId)||String(x.id||x._id)===String(novelId));if(book)source="DEVICE";}catch(e){}}
  if(!book){document.getElementById("title").innerText="Novel not found";document.getElementById("content").innerText=`ID ${novelId} not found on LIVE. Check ${API}/novels`;document.getElementById("badge").innerText="❌ Not Found";return;}
  
  currentBook=book;
  let access=(book.access||'free').toLowerCase();let price=book.price||49;
  if(access==='paid'){
    let user=null;try{user=JSON.parse(localStorage.getItem('user')||localStorage.getItem('genz_user')||'null')}catch{}
    let bought=localStorage.getItem('bought_'+novelId)||localStorage.getItem('bought_'+realId);
    let isOwner=false;if(user){let u=(user.email||'').toLowerCase();let c=(book.creatorEmail||'').toLowerCase();if(c&&u&&c===u)isOwner=true;if(u==='xhettriakash1@gmail.com')isOwner=true;}
    if(source==="DEVICE")isOwner=true;
    if(!bought&&!isOwner){
      document.getElementById("title").innerText=book.title;
      document.getElementById("author").innerText="by "+(book.author||'GenZ');
      document.getElementById("cover").src=book.cover||book.coverImage||'';
      document.getElementById("badge").innerText='💎 PAID • ₹'+price;
      document.getElementById("payTitle").innerText=book.title;
      document.getElementById("payPrice").innerText='₹'+price;
      document.getElementById("paywall").classList.add('on');
      document.getElementById("content").innerText='🔒 This novel is PAID. Please pay to unlock.';
      return;
    }
  }
  document.getElementById("title").innerText=book.title||"Untitled";
  document.getElementById("author").innerText="by "+(book.author||book.creatorName||"Anonymous")+" • "+source+(access==='paid'?' • PAID ₹'+price:' • FREE');
  document.getElementById("desc").innerText=book.description||"";
  document.getElementById("cover").src=book.cover||book.coverImage||book.coverUrl||`https://picsum.photos/400/600?random=${realId}`;
  document.getElementById("badge").innerText=source+" • "+(access==='paid'?'PAID ₹'+price:'FREE');
  document.getElementById("content").innerText=book.content||book.pdf||book.description||"No content";
  document.title=book.title+" - Gen-Z Visual";
  document.getElementById("bar").style.width="100%";document.getElementById("bar").style.background="#00ff88";
  window.addEventListener('scroll',()=>{let scrolled=(window.scrollY/(document.body.scrollHeight-window.innerHeight))*100;document.getElementById('bar').style.width=scrolled+'%';});
}

function doPay(){
  let upi=currentBook.authorUpi||currentBook.upi||'';
  let amt=currentBook.price||20;
  if(!upi || !upi.includes('@')){alert('Author UPI not set');return;}
  window.location.href=`upi://pay?pa=${upi}&pn=GenZ-Visual&am=${amt}&cu=INR&tn=${encodeURIComponent(currentBook.title)}`;
  setTimeout(()=>{
    let txn=prompt('Enter UPI Transaction ID (12 digits) after payment:\n\nThis will be sent to author for verification');
    if(txn && txn.length>=6){
      localStorage.setItem('bought_'+currentId,'yes');
      localStorage.setItem('txn_'+currentId,txn);
      localStorage.setItem('bought_'+currentId.replace('my_',''),'yes');
      alert('Unlock request sent! Author will verify. If fake ID, access will be revoked.');
      location.reload();
    }
  },3000);
}

function share(){if(navigator.share) navigator.share({title:currentBook.title,text:currentBook.description,url:location.href});else{navigator.clipboard.writeText(location.href);alert("Link copied!");}}
function toggleFS(){let el=document.getElementById("content");if(el.requestFullscreen)el.requestFullscreen();}
loadStory();
</script></body></html>
