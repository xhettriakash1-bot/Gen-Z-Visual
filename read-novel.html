 <!DOCTYPE html><html lang="en"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Read Novel v708 FB + LIKE COMMENT</title>
<style>
*{box-sizing:border-box}
:root{--bg:#07070a;--card:#15151a;--text:#ddd;--muted:#888}
body.light{--bg:#faf7f2;--card:#ffffff;--text:#1a1a1a;--muted:#777}
body.sepia{--bg:#f4ecd8;--card:#fbf0d9;--text:#433422;--muted:#8a7a5a}
body{margin:0;background:var(--bg);color:var(--text);font-family:Georgia,serif;transition:.3s}
header{position:sticky;top:0;z-index:99;display:flex;justify-content:space-between;align-items:center;padding:10px 14px;background:rgba(15,15,18,0.92);backdrop-filter:blur(12px);border-bottom:1px solid #222}
body.light header,body.sepia header{background:rgba(255,255,255,0.92);border-color:#e5e5e5}
.logo{font-weight:900;font-family:system-ui}.logo span{color:#ff00ff}
.top-btn{padding:7px 14px;border-radius:99px;background:#fff;color:#000;text-decoration:none;font-size:12px;font-weight:800;font-family:system-ui}
.progress{height:3px;background:#222;position:sticky;top:48px;z-index:98}
.progress-bar{height:100%;background:linear-gradient(90deg,#ff00ff,#ff8800);width:0%;transition:width .2s}
.wrap{max-width:700px;margin:0 auto;padding:14px 16px 10px}
.info{background:var(--card);border:1px solid rgba(255,255,255,0.08);border-radius:20px;padding:16px;display:flex;gap:14px;margin-bottom:12px}
.info img{width:90px;height:135px;border-radius:12px;object-fit:cover}
.badge{padding:4px 10px;border-radius:99px;background:#ff00ff22;border:1px solid #ff00ff40;color:#ff00ff;font-size:10px;font-weight:800;display:inline-block;margin-top:6px;font-family:system-ui}
.tools{background:var(--card);border:1px solid rgba(255,255,255,0.08);border-radius:14px;padding:10px 14px;display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;font-family:system-ui}
.tool-btn{padding:6px 12px;border-radius:8px;background:#222;border:1px solid #333;color:#fff;font-size:12px;cursor:pointer}
.content{background:var(--card);border:1px solid rgba(255,255,255,0.08);border-radius:20px;padding:22px;line-height:1.9;font-size:18px;white-space:pre-wrap;min-height:300px}
.actions{display:flex;gap:8px;padding:10px 14px;position:fixed;bottom:0;left:0;right:0;background:rgba(15,15,18,0.92);backdrop-filter:blur(12px);border-top:1px solid #222;max-width:700px;margin:0 auto;z-index:99;font-family:system-ui}
.act{flex:1;padding:10px;background:#1e1e26;border:1px solid #333;border-radius:12px;color:#ccc;font-size:12px;font-weight:700;text-align:center;cursor:pointer}
.act.liked{background:#ff00ff22;color:#ff00ff;border-color:#ff00ff44}
.comment-box{max-width:700px;margin:10px auto 120px;padding:14px;background:var(--card);border:1px solid rgba(255,255,255,0.08);border-radius:18px;font-family:system-ui}
.c-input, .c-text{width:100%;padding:10px;background:#0a0a0a;border:1px solid #333;border-radius:10px;color:#fff;margin:4px 0}
.c-item{padding:10px 0;border-bottom:1px solid #222;font-size:12px}
.paywall{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.92);backdrop-filter:blur(16px);z-index:9999;align-items:center;justify-content:center;padding:20px}
.paywall.on{display:flex}
.pay-box{background:#15151a;border:1px solid #333;border-radius:20px;padding:22px;max-width:380px;width:100%;text-align:center;font-family:system-ui}
</style>
<script src="https://checkout.razorpay.com/v1/checkout.js"></script>
</head><body>
<header><div class="logo">Gen-Z <span>Novel</span> <small style="font-size:9px;background:#ff00ff;color:#fff;padding:2px 6px;border-radius:6px">v708 FB ❤️💬</small></div><a href="index.html?v=708" class="top-btn">✕ Close</a></header>
<div class="progress"><div class="progress-bar" id="bar"></div></div>
<div class="wrap">
<div class="info"><img id="cover" src=""><div style="flex:1"><h2 id="title" style="margin:0;font-size:20px;line-height:1.1;font-family:system-ui">Loading v708...</h2><p id="author" style="font-size:12px;color:var(--muted);margin:6px 0;font-family:system-ui"></p><p id="meta" style="font-size:11px;color:var(--muted);font-family:system-ui"></p><span class="badge" id="badge">Waking v708 FB...</span></div></div>
<div class="tools"><div style="display:flex;gap:6px;align-items:center"><span style="font-size:12px;color:var(--muted)">Aa</span><button class="tool-btn" onclick="changeFont(-2)">A-</button><button class="tool-btn" onclick="changeFont(2)">A+</button></div><div style="display:flex;gap:6px"><button class="tool-btn" onclick="setTheme('dark')">🌙</button><button class="tool-btn" onclick="setTheme('sepia')">📜</button><button class="tool-btn" onclick="setTheme('light')">☀️</button></div></div>
<div class="content" id="content">⏳ Loading novel v708 FB...</div>
</div>

<div class="actions">
<div class="act" id="likeBtn" onclick="toggleLike()">🤍 Like <span id="likeCount">0</span></div>
<div class="act" onclick="document.getElementById('commentBox').scrollIntoView({behavior:'smooth'})">💬 Comment <span id="commentCount">0</span></div>
<div class="act" id="saveBtn" onclick="toggleSave()">🔖 Save</div>
</div>

<div id="commentBox" class="comment-box">
<b>💬 Comments v708 FB</b> <small style="color:var(--muted)" id="cInfo"></small>
<div id="commentList" style="margin:10px 0"></div>
<input id="cName" class="c-input" placeholder="Your name">
<textarea id="cText" class="c-text" rows="2" placeholder="Write comment FB style..."></textarea>
<button onclick="postComment()" style="width:100%;padding:11px;background:#ff00ff;color:#fff;border:none;border-radius:10px;font-weight:900;margin-top:6px">Post Comment v708 FB</button>
</div>

<div id="paywall" class="paywall"><div class="pay-box"><div style="font-size:36px">💎</div><h2>Premium Locked v708</h2><p id="payTitle" style="color:#888;font-size:13px"></p><h1 id="payPrice" style="color:#ff00ff">₹10</h1><button id="payBtn" onclick="payNowRazorpay()" style="width:100%;padding:14px;background:#ff00ff;color:#fff;border:none;border-radius:12px;font-weight:900;margin-top:10px">🔓 Pay ₹10 & Unlock v708</button></div></div>

<script>
const BASE="https://gen-z-visual-2.onrender.com";const API=BASE+"/api";
let cur=null,cId=null,cReal=null,fontSize=18;
let liked=JSON.parse(localStorage.getItem('genz_liked')||'[]'), saved=JSON.parse(localStorage.getItem('genz_saved')||'[]');

fetch(BASE+"/",{cache:"no-store"}).catch(()=>{});
function setTheme(t){document.body.className=t==='dark'?'':t;localStorage.setItem('genz_theme',t);}
function changeFont(d){fontSize=Math.max(14,Math.min(26,fontSize+d));document.getElementById('content').style.fontSize=fontSize+'px';localStorage.setItem('genz_font',fontSize);}
(function(){let th=localStorage.getItem('genz_theme')||'dark';setTheme(th);let fs=parseInt(localStorage.getItem('genz_font')||'18');fontSize=fs;document.getElementById('content').style.fontSize=fs+'px';})();

async function loadStory(){
 let p=new URLSearchParams(location.search); cId=p.get('id')||p.get('xml'); if(!cId){document.getElementById('title').innerText='No ID v708';return;} cReal=cId.replace('my_','');
 try{await fetch(BASE+"/",{cache:"no-store"})}catch{}
 let book=null;
 try{let r=await fetch(API+"/novels/"+cReal,{cache:"no-store"}); if(r.ok) book=await r.json(); else{ let rl=await fetch(API+"/novels",{cache:"no-store"}); let list=await rl.json(); list=Array.isArray(list)?list:list.novels||[]; book=list.find(x=>String(x._id)===String(cReal)); }}catch{}
 if(!book){document.getElementById('title').innerText='Not found v708';return;} cur=book;
 let acc=(book.access||'free').toLowerCase();
 let user=null;try{user=JSON.parse(localStorage.getItem('user')||localStorage.getItem('genz_user')||'null')}catch{}
 let bought=localStorage.getItem('bought_'+cId)||localStorage.getItem('bought_'+cReal);
 let owner=user && ((user.email||'').toLowerCase()===(book.creatorEmail||'').toLowerCase() || (user.email||'').toLowerCase()==='xhettriakash1@gmail.com');
 if(acc==='paid' && !bought && !owner){document.getElementById('title').innerText=book.title;document.getElementById('cover').src=book.cover||book.coverImage||'';document.getElementById('payTitle').innerText=book.title;document.getElementById('paywall').classList.add('on');return;}

 document.getElementById('title').innerText=book.title;
 document.getElementById('author').innerText=`by ${book.author||'GenZ'} • 👁️ ${(book.views||0)+1} ❤️ ${book.likes||0}`;
 document.getElementById('cover').src=book.cover||book.coverImage||'https://picsum.photos/400/600';
 let words=(book.content||'').split(/\s+/).length; let mins=Math.max(1,Math.ceil(words/200));
 document.getElementById('meta').innerText=`${words} words • ${mins} min read • ${acc==='paid'?'PAID ₹10':'FREE'} • ❤️ ${book.likes||0} likes v708`;
 document.getElementById('badge').innerText=acc==='paid'?'💎 PAID UNLOCKED v708':'🆓 FREE v708 FB';
 document.getElementById('content').innerText=book.content||book.description||'No content';
 document.getElementById('likeCount').innerText=book.likes||0;
 try{fetch(API+"/novels/"+cReal+"/view",{method:'POST'}).catch(()=>{})}catch{}
 window.addEventListener('scroll',()=>{let s=(scrollY/(document.body.scrollHeight-innerHeight))*100;document.getElementById('bar').style.width=s+'%';});
 updateBtns(); loadComments();
}
function updateBtns(){document.getElementById('likeBtn').innerHTML=(liked.includes(cId)?'❤️ Liked ':'🤍 Like ')+`<span id="likeCount">${document.getElementById('likeCount').innerText}</span>`;document.getElementById('likeBtn').className='act'+(liked.includes(cId)?' liked':'');document.getElementById('saveBtn').innerText=saved.includes(cId)?'📚 Saved':'🔖 Save';document.getElementById('saveBtn').className='act'+(saved.includes(cId)?' liked':'');}
function toggleLike(){
 let was=liked.includes(cId);
 if(was){liked.splice(liked.indexOf(cId),1); document.getElementById('likeCount').innerText=Math.max(0,parseInt(document.getElementById('likeCount').innerText)-1);}
 else{liked.push(cId); document.getElementById('likeCount').innerText=parseInt(document.getElementById('likeCount').innerText)+1; try{fetch(API+"/novels/"+cReal+"/like",{method:'POST'}).catch(()=>{})}catch{}}
 localStorage.setItem('genz_liked',JSON.stringify(liked)); updateBtns();
}
function toggleSave(){let i=saved.indexOf(cId);if(i>-1)saved.splice(i,1);else saved.push(cId);localStorage.setItem('genz_saved',JSON.stringify(saved));updateBtns();}
function shareNovel(){if(navigator.share)navigator.share({title:cur.title,url:location.href});else{navigator.clipboard.writeText(location.href);alert('Link copied v708!');}}
function getCommentsKey(){return 'genz_comments_novel_'+cReal;}
function loadComments(){
 let arr=JSON.parse(localStorage.getItem(getCommentsKey())||'[]');
 document.getElementById('commentCount').innerText=arr.length;
 document.getElementById('cInfo').innerText=`• ${arr.length} comments`;
 document.getElementById('commentList').innerHTML=arr.map(c=>`<div class="c-item"><b>${c.name}</b> <small style="color:var(--muted)">${c.time}</small><br>${c.text}</div>`).join('')||'<small style="color:var(--muted)">No comments yet - be first v708 FB!</small>';
}
function postComment(){
 let name=document.getElementById('cName').value||'GenZ User'; let text=document.getElementById('cText').value.trim(); if(!text)return alert('Write comment');
 let arr=JSON.parse(localStorage.getItem(getCommentsKey())||'[]'); arr.push({name,text,time:new Date().toLocaleString()}); localStorage.setItem(getCommentsKey(),JSON.stringify(arr));
 document.getElementById('cText').value=''; loadComments();
 try{fetch(API+"/novels/"+cReal+"/comment",{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name,text})}).catch(()=>{})}catch{}
}
async function payNowRazorpay(){
 let btn=document.getElementById('payBtn');btn.disabled=true;btn.innerText='⏳ Waking v708...';
 try{await fetch(BASE+"/",{cache:"no-store"});let res=await fetch(`${BASE}/api/create-order`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({type:"novel",amount:10,title:cur.title,novelId:cReal})});let data=await res.json();if(!data.orderId&&!data.id) throw new Error(data.error||'Failed');
 var opt={key:data.key_id,amount:data.amount,currency:"INR",name:"Gen-Z Visual v708",description:cur.title+" - ₹10",order_id:data.orderId||data.id,handler:async function(r){let v=await fetch(`${BASE}/api/verify-payment`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(r)});let j=await v.json();if(j.ok){localStorage.setItem('bought_'+cId,'yes');localStorage.setItem('bought_'+cReal,'yes');alert('✅ Unlocked v708!');location.reload();}},theme:{color:"#ff00ff"}}; new Razorpay(opt).open();
 }catch(e){btn.disabled=false;btn.innerText='❌ Retry v708';alert(e.message);}
}
loadStory();
</script></body></html>
