<!DOCTYPE html><html><head><meta name="viewport" content="width=device-width, initial-scale=1"><title>Read</title><style>body{background:#0a0a0a;color:white;font-family:sans-serif;padding:20px;text-align:center}</style></head><body><h2 id="title">Loading...</h2><iframe id="pdfview" style="width:100%;height:80vh;background:white;border-radius:12px"></iframe><script>const params=new URLSearchParams(location.search);fetch('data/novels.xml').then(r=>r.text()).then(str=>{let xml=new DOMParser().parseFromString(str,"text/xml");let n=[...xml.querySelectorAll("novel")].find(x=>x.querySelector("id").textContent==params.get("id"));if(n){document.getElementById("title").innerText=n.querySelector("title").textContent;document.getElementById("pdfview").src=n.querySelector("pdf").textContent||"https://mozilla.github.io/pdf.js/web/viewer.html"}});</script></body></html>
