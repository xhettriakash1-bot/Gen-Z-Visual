<!DOCTYPE html><html><head><meta name="viewport" content="width=device-width, initial-scale=1"><title>Read</title><link rel="stylesheet" href="style.css"><style>iframe{width:100%;height:85vh;border:none;border-radius:16px;margin:10px 0;background:white}</style></head><body><header><div class="logo">Novel</div><a href="novels.html" class="top-btn" style="background:white;color:black">Back</a></header><div class="section"><h2 id="title">Loading...</h2><iframe id="pdf"></iframe></div><script>let id=new URLSearchParams(location.search).get("id");fetch('data/novels.xml').then(r=>r.text()).then(s=>{let x=new DOMParser().parseFromString(s,"text/xml");let n=[...x.querySelectorAll("novel")].find(v=>v.querySelector("id").textContent==id);document.getElementById("title").innerText=n.querySelector("title").textContent;document.getElementById("pdf").src=n.querySelector("pdf").textContent})</script></body></html>
