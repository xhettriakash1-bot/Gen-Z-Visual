<!DOCTYPE html><html><head><meta name="viewport" content="width=device-width, initial-scale=1"><title>Read Comic</title><style>body{background:#000;color:white;font-family:sans-serif;margin:0;text-align:center}img{width:100%;max-width:600px;display:block;margin:0 auto;border-bottom:1px solid #222}h2{padding:15px}</style></head><body><h2 id="title">Loading...</h2><div id="pages"></div><script>let id=new URLSearchParams(location.search).get("id");fetch('data/comics.xml').then(r=>r.text()).then(s=>{let x=new DOMParser().parseFromString(s,"text/xml");let c=[...x.querySelectorAll("comic")].find(a=>a.querySelector("id").textContent==id);document.getElementById("title").innerText=c.querySelector("title").textContent;let pages=c.querySelector("pages").textContent.split(",");document.getElementById("pages").innerHTML=pages.map(p=>`<img src="${p.trim()}">`).join("")});</script></body></html>
