<!DOCTYPE html><html><body style="background:#000;color:#fff;font-family:sans-serif;padding:20px">
<h2>🔧 EMERGENCY ADMIN LOGIN TEST - Firewall Kept</h2>
<input id="e" value="xhettriakash1@gmail.com" style="width:100%;padding:12px;margin:5px 0"><br>
<input id="p" value="Akash123" type="password" style="width:100%;padding:12px;margin:5px 0"><br>
<button onclick="doLogin()" style="padding:12px 20px;border-radius:20px">LOGIN AS ADMIN</button>
<pre id="out" style="background:#111;padding:15px;border-radius:12px;margin-top:15px"></pre>
<script>
const API="https://gen-z-visual-1.onrender.com/api";
async function doLogin(){
 let email=document.getElementById('e').value.trim().toLowerCase();
 let pass=document.getElementById('p').value.trim();
 document.getElementById('out').innerText="Connecting to "+API+"/login ...";
 try{
  let r=await fetch(API+"/login",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({email,password:pass})});
  let d=await r.json();
  document.getElementById('out').innerText=JSON.stringify(d,null,2);
  if(d.success){
    localStorage.setItem("user",JSON.stringify(d.user));
    localStorage.setItem("email",d.user.email);
    localStorage.setItem("role",d.user.role);
    document.getElementById('out').innerText+="\n\n✅ SAVED! Role="+d.user.role+"\nNow opening admin.html...";
    setTimeout(()=>location.href="admin.html",1000);
  }
 }catch(err){
  document.getElementById('out').innerText="❌ FETCH FAILED: "+err+"\n\n1. Check backend is live: https://gen-z-visual-1.onrender.com\n2. Check internet / CORS";
 }
}
</script>
</body></html>
